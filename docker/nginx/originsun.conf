# Website_Nginx 設定 — 服務 Astro static dist/ + 反代 /api/website/* 到 website-api 容器
#
# 部署：
#   1. 此檔放在 NAS /share/.../Website/docker/nginx/originsun.conf
#   2. docker cp 進 Website_Nginx 的 /etc/nginx/conf.d/default.conf
#   3. docker exec Website_Nginx nginx -s reload

# ── HTML 一律回頭驗證（2026-08-09）──────────────────────────────
# 🔴 原本 HTML 完全沒有 Cache-Control。沒有這個標頭時瀏覽器會用**啟發式快取**
# （拿 Last-Modified 的年齡推算能放心用多久），於是官網 rebuild 之後，訪客手上
# 那頁可能好幾小時都不會更新 —— 上架新作品、改文案、改版面都會遇到，而且從
# 我們這邊完全看不出來（owner 2026-08-09 就是這樣看到已經修好的舊版作品牆）。
#
# `no-cache` 不是「不要快取」，是「用之前一定要問我」—— 配上既有的 ETag，
# 沒變就回 304（幾百 bytes），內容更新則立刻拿到新的。
# `/_astro/` 那些檔名帶 hash 的資產維持 1 年長快取（見下方 location）。
#
# 用 map 而不是在 location 裡 add_header：nginx 的 add_header **不會繼承** ——
# 子層一旦有自己的 add_header，上面那三個安全標頭就會在該 location 整組消失。
map $sent_http_content_type $osun_html_cache {
    default              "";
    ~*text/html          "no-cache";
    ~*application/xml    "no-cache";     # sitemap / rss 同理
}

# ── office 面的靜態資源快取（見檔尾的 office server 區塊）────────────────────
# 另開一份 map 而不是改上面那個：上面那個同時管著對外站的 location /，動它會連
# Astro 頁面的快取行為一起改，而這兩個面的取捨完全不同。
#
# 這裡只管 js/css，**不管 text/html** —— office 的頁面是 office-api 自己送的，
# 它已經帶了 `Cache-Control: no-store`。nginx 再 add_header 一次會變成兩行
# Cache-Control（合併後語意還是對的，但排查時看起來像有人設錯）。
#
# 為什麼 js 要 no-cache：`my.html` 與手機殼載的是**傳統 script**（非 ES module）、
# 載入順序敏感，發版時最怕「新 html + 舊 js」（reference_cloudflare_js_cache）。
# ⚠ 現況下 Cloudflare 那層會把 .js 改寫成 max-age=14400、蓋掉這個標頭 —— 這行是
# 為了「CF Browser Cache TTL 改成 Respect Existing Headers 之後就會生效」而先寫好，
# 以及讓 LAN 直達那條路（8091，不經 CF）現在就是對的。
map $sent_http_content_type $osun_office_cache {
    default              "";
    ~*javascript         "no-cache";
    ~*text/css           "no-cache";
}

# ── apex（裸網域）301 → www（2026-07-03 上線：canonical 統一 www、單一主機、少一跳）──
server {
    listen 80;
    server_name originsun-studio.com;
    return 301 https://www.originsun-studio.com$request_uri;
}

server {
    # default_server：明確指定為預設 server，避免上面 apex block（排在前面）搶走
    # 所有非精確匹配的流量（含 www）→ 造成 www→www 無限迴圈。
    listen 80 default_server;
    server_name www.originsun-studio.com _;
    root /usr/share/nginx/html;

    # cloudflared→nginx 走 http（$scheme=http），故 return 301 的相對路徑會被 nginx
    # 絕對化成 http://…→多一跳 http→https。關掉 → Location 保持相對、瀏覽器用當前
    # https origin 解析 → 舊網址 301 單跳直達 https 新站（保 SEO 權重）。
    absolute_redirect off;

    # 圖片 / 表單上傳（admin showcase gallery 等）— nginx 預設 1MB 太小
    client_max_body_size 20m;

    # ── SEO 硬 301 redirects（自動產出，DO NOT EDIT BY HAND） ──
    # 來源：master 的 publish_update.sync_redirects_to_nas() 拉
    # GET /api/website/redirects → 寫進 redirects.conf + nginx -s reload。
    # glob 匹配避免檔案順序耦合（snippet 還沒建時 nginx -t 也不會失敗）。
    include /etc/nginx/snippets/*.conf;

    # 安全標頭 — `always` 才會在 4xx/5xx 回應也帶上
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 值為空字串時 nginx 不會送出這個標頭 → 只有 HTML/XML 會帶（見檔頭的 map）
    add_header Cache-Control $osun_html_cache always;

    # ── 反代 API 到 website-api 容器 ──
    # cloudflared / 跨機 admin Tab 都打 /api/website/* → 進這條規則 → website-api:8001
    location /api/website/ {
        proxy_pass http://website-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # CORS preflight 由 website-api 的 CORSMiddleware 處理，不在這裡攔
    }

    # ── 影像紀錄公開頁（master 關機時同仁仍要能開連結、傳照片）──
    # 頁面與 logo 由 website-api serve（不在 Astro dist/ 裡）；
    # 上傳端點的 body 上限必須獨立放大 —— 站台預設 20m，而影像紀錄允許 500MB，
    # 不放大的話同仁傳手機影片會被 nginx 擋掉且錯誤訊息看不出是大小問題。
    location = /media-log.html {
        proxy_pass http://website-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /img/ {
        proxy_pass http://website-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;          # 已隱含 Cache-Control: max-age，不需再 add_header
    }

    # ── 專案頁 / 提案公開共編頁（客戶手上的 ?t= 連結，master 關機也要開得了）──
    # 頁面 + 它 import 的兩個模組目錄由 website-api serve（同樣不在 dist/ 裡）。
    # 只開這兩個子目錄，不是整個 /tabs/ 或 /js/ —— 那底下是內部 SPA 全部原始碼。
    #
    # 2026-08-15 由 /proposal-plan.html 改名（主鍵早已從提案換成專案）。舊路徑
    # 保留 301：**已經發給客戶的 ?t= 連結是舊網址**，而 $is_args$args 這段就是
    # 把 token 帶過去 —— 少了它，每一條分享連結都會變成一個沒有 token 的空頁。
    location = /proposal-plan.html {
        return 301 /project.html$is_args$args;
    }

    location = /project.html {
        proxy_pass http://website-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 提案公開頁的「研究頁 ↗」連過去的那頁（同一組 ?t= token）
    location = /reference.html {
        proxy_pass http://website-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 單篇會議記錄的唯讀分享頁（自己的 ?t= token）
    location = /meeting-note.html {
        proxy_pass http://website-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/references/shared/ {
        proxy_pass http://website-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /tabs/proposals/ {
        proxy_pass http://website-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /js/shared/ {
        proxy_pass http://website-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 提案的 token 端點（列企劃/共編/資料夾/下載）。分享夾的檔可能是幾百 MB 的
    # 影片 —— 反代預設 60s 會在大檔中途切斷，故放寬讀取逾時。
    location ^~ /api/v1/proposals/shared/ {
        proxy_pass http://website-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;            # 大檔邊收邊送，不先落 nginx 暫存
    }

    location ^~ /api/v1/crm/public/media-log/ {
        proxy_pass http://website-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 對齊後端 _MAX_UPLOAD_BYTES（tests/unit/test_public_surface.py 釘住）。
        # ⚠ nginx 放行不代表傳得上來 —— Cloudflare 在更前面有 100MB 的單請求硬
        # 上限（方案層級，改不掉）。伺服器用 cf-connecting-ip 判斷這條連線有沒有
        # 經過 CF，把上限下發給前端，超過的檔自動改走分塊端點
        # （見 core/chunked_upload.py）。這個 500m 服務的是區網直連與小檔。
        client_max_body_size 500m;
        proxy_request_buffering off;    # 大檔邊收邊轉，不先落 nginx 暫存
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── 報價單線上檢視（客戶手上的 /q/<短碼>，master 關機也要打得開）──
    # 憑證就是網址裡那串短碼（後端逐字比對 DB、可撤銷），送出去的是寄出當下就
    # 生成好的靜態快照 —— 不重算金額、不重畫版面，所以對外容器沒有 Playwright
    # 也送得出來。
    #
    # `/q/` 這個短路徑只有 master 的 main.py 有（掛根路徑是為了讓連結短），對外
    # 容器上只有 public_router 那條長 API —— 故在 nginx 把短碼接回去。少了這段，
    # 客戶手上每一條報價連結在 master 關機時都會落到 location / 變成 404，而那條
    # 路只有客戶會走，我們這邊完全看不出來。
    # `(.*)` 一併涵蓋 `/q/<碼>/pdf`；replacement 沒有 `?` → query string 自動帶過去。
    location ^~ /q/ {
        rewrite ^/q/(.*)$ /api/v1/crm/public/quote/$1 break;
        proxy_pass http://website-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 報價單是金錢文件，後端自己送 `Cache-Control: no-store`（HTML 與 PDF 都是）。
    # 這裡刻意不寫 `expires`／`add_header Cache-Control` —— 蓋掉它就等於讓客戶端
    # 快取一份會過期的報價；而且只要這個 location 有自己的 add_header，server 層
    # 那三個安全標頭就會在這裡整組消失（見檔頭與 /_astro/ 的說明）。
    location ^~ /api/v1/crm/public/quote/ {
        proxy_pass http://website-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── healthz 直通（不經 API，給 cloudflared 健康檢查用）──
    location = /healthz {
        proxy_pass http://website-api:8001/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # 通用快取規則（Astro hash 過的檔可長期 cache）— `^~` prefix 比 regex 快
    # 且 short-circuit：matched 就不再走後面 location /
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 🔴 下面三行是**重複**的，不是多餘的：nginx 的 add_header 不繼承 ——
        # 這個 location 只要有自己的 add_header，server 層那三個安全標頭就會在
        # 這裡整組消失（2026-08-09 實測 0/3）。nginx 沒有「只加不覆蓋」的寫法，
        # 只能重抄。改 server 層那三行時**這裡與 /uploads/ 也要一起改**。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── 執行期上傳檔（團隊頭像 /uploads/team、文章圖片 /uploads/posts）──
    # 這些檔由 website-api 寫進容器 /app/uploads/、且 main.py mount StaticFiles("/uploads")
    # 對外 serve；故反代給 website-api（不在 build 出來的 dist/ 裡，不能走 location /）。
    location ^~ /uploads/ {
        proxy_pass http://website-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        expires 30d;
        add_header Cache-Control "public";
        # 同 /_astro/：有自己的 add_header → server 層的安全標頭要重抄一份
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── 員工好記入口：/staff → 個人工作台（對外站 UI 僅頁尾 STAFF 小字，刻意低調）──
    location = /staff {
        return 301 https://foundry.originsun-studio.com/my.html;
    }

    # ── Astro 靜態 dist/ 服務（fallback）──
    # /works, /about, 首頁等都進這條。Astro static 對每個 route 都生成
    # `<route>/index.html`，所以 try_files 兩條就夠（拿掉中間的 $uri/）。
    location / {
        index index.html;
        try_files $uri $uri/index.html =404;
    }
}

# ── office.originsun-studio.com — 內部同仁的三個面（office-api 容器）─────────────
#
# 跟上面那個 server 的差別不只是換個後端：這裡**沒有 Astro dist/**。整個 server 就是
# 反代給 office-api，頁面與靜態檔都由它自己 serve（清單正本 core/office_assets.py）。
# 寫 try_files 會讓所有沒對上 dist/ 檔案的路徑變成 404 —— 而這個面**每一條**路徑都
# 不在 dist/ 裡，等於整站掛掉。
#
# server_name 是精確字串，nginx 的精確比對優先於上面那個 default_server，所以放在
# 檔尾不影響既有三個區塊；反過來說，改上面那個 default_server 也不會搶走這裡的流量。
server {
    # 80：cloudflared 走的那條（CF Zero Trust 把 office. 這個 hostname 指到
    #     192.168.1.132:8090，host 的 8090 對映到本容器的 80 —— 跟對外站同一個入口）。
    listen 80;

    # 🔴 8091：LAN 直達，刻意不經 cloudflared。
    # cloudflared 自己也是 NAS 上的一個容器，CF 那層過去就出過事
    # （reference_cloudflare_malicious_redirect）。這整件事的目的是「不受某一台機器的
    # 開關影響」，如果所有路都穿過同一條隧道，那就只是把單點從 master 換到 CF 而已。
    # ⚠ 這行只在容器內開 port —— Website_Nginx 是手動 docker run 起來的（見 INDEX.md），
    #    host 端要多一條 `-p 8091:8091` 才通。改這個檔不會讓它自己出現。
    listen 8091 default_server;

    server_name office.originsun-studio.com;

    # 同 www block：cloudflared→nginx 走 http，絕對化的 Location 會多一跳 http→https。
    absolute_redirect off;

    # 這個面要能上傳發票影像、貼圖、影像紀錄的現場照片與短片。量級照 www block 的
    # media-log 那條（500m）。放在 server 層而不是各自開 location：這裡整個 server
    # 只有一個後端、每條路徑都是登入後的內部路徑，逐條列上傳端點只會漏。
    # ⚠ 同樣的提醒：Cloudflare 在更前面有 100MB 單請求硬上限（方案層級，改不掉），
    #    超過的檔由後端下發上限、前端自動改走分塊端點（core/chunked_upload.py）。
    #    8091 那條不經 CF，才吃得到這裡的 500m。
    client_max_body_size 500m;

    # 安全標頭 —— `always` 才會在 4xx/5xx 也帶上。
    # 🔴 底下的 location **一律不准有自己的 add_header**：nginx 的 add_header 不繼承，
    #    子層一旦宣告，這四行就會在該 location 整組消失（www block 的 /_astro/ 與
    #    /uploads/ 就是為此重抄了三份）。需要調快取請改檔頭的 $osun_office_cache map。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 值為空字串時 nginx 不送這個標頭 → 只有 js/css 會帶（見檔頭的 map）
    add_header Cache-Control $osun_office_cache always;

    # proxy_set_header 會繼承到 location（跟 add_header 的規則一樣：子層沒宣告才繼承），
    # 所以只在這裡寫一次，下面的 location 都不要再宣告 proxy_set_header。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 大檔邊收邊送，不先落 nginx 暫存；也讓報價助理那類逐段吐的回應真的是逐段到瀏覽器
    # （攢在 nginx 裡就沒有串流的意義了）。後端是 async uvicorn，慢速客戶端不佔 worker。
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 裸網域進來給一個落點：office-api 沒有 `/` 路由，不接的話同仁把
    # https://office.originsun-studio.com 存成書籤會看到 FastAPI 的 {"detail":"Not Found"}。
    location = / {
        return 302 /my.html;
    }

    # healthz 直通（給 cloudflared / 外部監控）。access_log off 才不會把健康檢查
    # 灌進 log 淹掉真的請求。這裡刻意不宣告任何 proxy_set_header，讓 server 層那組生效。
    location = /healthz {
        proxy_pass http://office-api:8002/healthz;
        access_log off;
    }

    # 其餘全部給 office-api：頁面（/my.html、/m/*）、模組目錄（/js/shared、/js/my、
    # /tabs/petty、/img）、以及所有 /api/v1/* —— 由 main_office 決定哪些掛得上，
    # nginx 這層不再維護第二份清單（維護兩份的結果一定是漂掉）。
    location / {
        proxy_pass http://office-api:8002;
    }
}
