# NAS 部署的 docker-compose — 啟動 website-api 容器
#
# 使用：在 NAS 上 cd 到此目錄後跑 `docker compose up -d`
# 更新 code：master 端 rsync 推 ../code/ 到 NAS 後 `docker restart website-api`
# .env 在同層放（不進 git，內含 DATABASE_URL / JWT_SECRET / CORS）

services:
  website-api:
    container_name: website-api
    build:
      context: .
      dockerfile: Dockerfile.website
    image: originsun/website-api:latest
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      # master 端 rsync 把 code/ 同步到這個 NAS path（M2 自動同步機制）
      # 容器內看到的就是 /app（main_website.py、routers/、services/、core/、db/）
      # 不加 :ro — 因為要在 /app/uploads 掛子 volume，read-only 父目錄不能在
      # 啟動時建子掛點。容器本身不會寫 /app（程式檔不會自改），實務無風險。
      - ../code:/app
      # uploads 目錄需可寫（圖片上傳走容器，不走 master）
      - ../uploads:/app/uploads
      # 影像紀錄原檔歸檔區（現場劇照/花絮）。master 是走 SMB 寫這個資料夾，
      # 容器在 NAS 本機直接掛 → 少一層網路檔案系統。
      # ⚠ 掛載寫在這裡（版控）而非手動 docker run：容器重建時才不會靜默消失，
      #    掉了的症狀是上傳全失敗且訊息指向「管理員尚未設定資料夾」（誤導）。
      - /share/Archive:/share/Archive
      # 共用圖床 PasteAssets（貼圖 + 影像紀錄縮圖）。容器收圖時要寫 medialog
      # 縮圖到這裡；設定裡的 UNC \\192.168.1.132\Container\...\PasteAssets 由
      # core.drive_map.to_local_path 翻成 /share/Container/...（NAS_LOCAL_SHARE_ROOT）。
      - /share/Container/AI_Workspace/Originsun_Web/PasteAssets:/share/Container/AI_Workspace/Originsun_Web/PasteAssets
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      WEBSITE_CORS_ORIGINS: ${WEBSITE_CORS_ORIGINS}
      # 設定存的是 master 視角的 UNC（單一真相）；本容器把 \\192.168.1.132\X
      # 翻成 /share/X（core.drive_map.nas_local_path）。master 不設此變數 = no-op。
      # UNC 主機用程式預設（DEFAULT_NAS_UNC_HOST）—— 不在這裡設 NAS_UNC_HOST，
      # 因為 compose 會把 YAML 的 \\ 吃成單一 \，翻譯就永遠對不上（實測踩過）。
      NAS_LOCAL_SHARE_ROOT: /share
      # 收到 rebuild trigger 後 forward 給 master（npm 在 master 跑）
      # master 離線 → relay 失敗回友善錯誤，pending_count 維持等下次
      MASTER_RELAY_URL: ${MASTER_RELAY_URL}
    networks:
      # 既有 postgres 容器 (originsun_postgres) 在 postgres_default 上。
      # QNAP 防火牆擋新 bridge 建立，所以只用既有的；nginx 之後也接這條
      # 即可用 container name 互相解析。
      - postgres_default
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── office-api：內部同仁那三個面（報價／發票／員工工作台）的 24/7 版本 ──
  # owner 2026-09-10：「我希望報價單、發票、員工的工作頁面不會被 8000 的生產機開關影響」。
  # 資料本來就都在 NAS 的 Postgres，只有「把頁面端出來、把 API 跑起來」綁在 master。
  # 這個容器就是把純資料庫的那半邊在 NAS 上再跑一份（詳見 main_office.py 檔頭）。
  #
  # 跟 website-api 是兩個 service 而不是一個多 port 的容器：它們的曝露面完全不同
  # （對外匿名 vs 內部登入後），掛掉的影響範圍也不同 —— 分開才能各自重啟、各自看 log。
  office-api:
    container_name: office-api
    build:
      context: .
      dockerfile: Dockerfile.office
    image: originsun/office-api:latest
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      # 跟 website-api 同一份 code —— /publish 一次同步，兩個容器各自 restart。
      # 不加 :ro，理由同上面那個 service。
      - ../code:/app
      # 影像紀錄原檔歸檔區（手機頁會傳現場照片）。同 website-api，NAS 本機直接掛。
      - /share/Archive:/share/Archive
      # 共用圖床 PasteAssets（貼圖 + 影像紀錄縮圖 + 報價單靜態快照）。設定裡存的是
      # master 視角的 UNC，由 core.drive_map 配 NAS_LOCAL_SHARE_ROOT 翻成 /share/...。
      - /share/Container/AI_Workspace/Originsun_Web/PasteAssets:/share/Container/AI_Workspace/Originsun_Web/PasteAssets
      #
      # ✅ 發票影像（settings `invoices_root`）**是通的**：生產那個值就落在上面
      #    /share/Archive 這個掛載底下（Archive 分享 → 00_電子發票），由
      #    NAS_LOCAL_SHARE_ROOT ＋ core.drive_map 翻成 /share/Archive/00_電子發票。
      #    這裡原本寫「上傳與下載會失敗」—— 那是還沒掛 /share/Archive 之前的舊筆記。
      #    下載 2026-09-10 端對端驗過（分享連結整條路只走 NAS 也拿得到檔）；
      #    上傳原本會安靜地寫進 /app 的垃圾路徑，同日修掉（見 _invoices_write_root），
      #    但**還沒**在容器上實跑過 —— 要等下一次 /publish 把碼推上去。
      #
      # ⚠ 刻意**沒有**掛的東西 —— 以下功能在這個容器上會降級：
      #   1. 提案／專案資產夾（各專案自己設的 proposal_assets_root）
      #      檔案清單空、下載 404。
      #   （成本收據 2026-09-10 已補上同一套翻譯，receipts_root 也進了 EXPORT_KEYS；
      #    生產那個值同樣落在 /share/Archive 底下，所以這台寫得進去。刻意不學
      #    website-api 掛 `../uploads`：那個目錄由對外站 serve，收據掛上去等於把它變成公開檔。）
      # ⚠ 要補掛新的分享之前**先讀生產 settings 看它實際指到哪**，不要照猜的路徑掛
      #   一堆：掛錯的症狀跟沒掛一模一樣，只是多了一個看起來已經處理過的假象。
      #   （背景見 docs/OFFLINE_MASTER_PLAN.md §7.1 / §7.3）
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # 🔴 必須跟 master settings.json 的 jwt_secret 是同一把（website-api 也共用同一把）：
      # 同仁在 master 登入拿到的 token 要能在這台驗過，反之亦然。不同把的症狀是
      # 「頁面打得開、每一支 API 都 401」。
      JWT_SECRET: ${JWT_SECRET}
      # 設定存的是 master 視角的 UNC（單一真相）；本容器把 \\192.168.1.132\X 翻成
      # /share/X（core.drive_map.nas_local_path）。理由與「為何不設 NAS_UNC_HOST」
      # 同 website-api（compose 會把 YAML 的 \\ 吃成單一 \）。
      NAS_LOCAL_SHARE_ROOT: /share
      OFFICE_CORS_ORIGINS: ${OFFICE_CORS_ORIGINS}
      # 🔴 使用者資料是雙寫的（Postgres 正本 + users.json 鏡射），而鏡射只該存在於
      # 有正本的那台。不關掉的話 Google 首登／註冊會在 NAS 的 code 目錄長出一份
      # 沒有人讀、也不會同步回 master 的帳號檔（裡面有密碼雜湊）。
      # 開關在 core/auth.py 的 _NO_USERS_JSON；讀取不受影響（檔案不在就是空清單）。
      MEDIAGUARD_NO_USERS_JSON: "1"
    networks:
      - postgres_default
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # external — 由既有 originsun_postgres 容器建立，docker compose 不重建
  postgres_default:
    external: true
