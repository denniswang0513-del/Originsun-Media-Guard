<!--
    finance.html — 💰 財務管理 Tab 主殼（階段一：帳務六視圖搬家）
    左側導覽 + 右側內容。階段一內容 = 內嵌既有 crm-invoices（六視圖一行不改），
    左側「帳務」按鈕代理其內部 view bar；之後階段的新子視圖（三表/銀行貸款/儀表板）
    以 data-subview 模式加入（比照官網管理 website.js）。
-->
<div id="finance-root" style="display:flex;min-height:500px;background:#1a1a1a;">

    <!-- 左側導覽 -->
    <nav id="finance-nav" style="width:200px;border-right:1px solid #2a2a2a;padding:16px 0;flex-shrink:0;overflow-y:auto;min-height:0;">
        <div style="padding:0 16px 12px;font-size:11px;color:#666;letter-spacing:0.08em;">財務管理</div>

        <!-- nav 三模式（LEDGER_ENTITY_PLAN §5，顯隱由 finance.js 控制）：
             .fin-nav-full      = 只在 full-parent scope（記帳者/owner）顯示 —— 母公司 CRM 域
             .fin-nav-mine-ok   = full-parent 與「我的帳」（/my-ledger.html，entity=mine）都顯示；合夥人隱藏
             .fin-nav-mine-only = 私帳專屬（執行專案/器材清冊/私帳應收）：帳號要有 finance_mine
                                  （指名制）才顯示 —— finance.js 一行 hideNav 收掉，新私帳子視圖掛這個 class 即可
             無 class          = 三種模式都顯示（儀表板／財務三表） -->
        <div class="fin-nav-mine-ok" style="padding:4px 16px;font-size:10px;color:#555;letter-spacing:0.1em;">🧾 帳務</div>
        <button class="finance-nav-btn fin-nav-full" data-inv-view="invoices">🧾 發票</button>
        <button class="finance-nav-btn fin-nav-mine-ok" data-inv-view="payments">💳 請款</button>
        <button class="finance-nav-btn fin-nav-mine-ok" data-inv-view="cashbook">📒 收支明細</button>
        <button class="finance-nav-btn fin-nav-mine-ok" data-inv-view="payables">📤 應付帳款</button>
        <!-- 私帳應收＝逐案投影（owner 不開發票，發票版應收對私帳恆空）；
             入口由 finance.js 以 finance_mine 指名門把關 -->
        <button class="finance-nav-btn fin-nav-mine-ok fin-nav-mine-only" data-subview="receivable">📥 應收帳款</button>
        <button class="finance-nav-btn fin-nav-mine-ok fin-nav-mine-only" data-subview="household">🏠 家用</button>
        <button class="finance-nav-btn fin-nav-mine-ok fin-nav-mine-only" data-subview="clients">👥 客戶管理</button>
        <button class="finance-nav-btn fin-nav-full" data-inv-view="receivables">📥 應收帳款</button>
        <!-- 零用金：同事墊的錢。就地掛 tabs/petty 的元件（與獨立網址
             /petty-cash.html 同一套），不是連出去 —— 已經登入的人不該被踢去
             另一個登入頁。owner 2026-08-17：CRM 裡要能管理所有的零用金。 -->
        <button class="finance-nav-btn fin-nav-full" data-subview="petty">💵 零用金</button>

        <div style="padding:14px 16px 4px;font-size:10px;color:#555;letter-spacing:0.1em;">📈 分析</div>
        <button class="finance-nav-btn active" data-subview="dashboard">📊 儀表板</button>
        <button class="finance-nav-btn fin-nav-mine-ok" data-subview="projects">📁 執行專案</button>
        <button class="finance-nav-btn fin-nav-mine-ok" data-subview="assets">💎 資產儀表板</button>
        <!-- 證券投資（owner 2026-08-29）：與資產儀表板同一份持股資料，
             這裡是「投了多少／賺賠多少」的視角（儀表板看的是淨值）。 -->
        <button class="finance-nav-btn fin-nav-mine-ok fin-nav-mine-only" data-subview="securities">📈 證券投資</button>
        <button class="finance-nav-btn fin-nav-mine-ok" data-subview="gear">🎥 器材清冊</button>
        <button class="finance-nav-btn" data-subview="statements">📑 財務三表</button>
        <button class="finance-nav-btn fin-nav-full" data-inv-view="cashflow">💧 現金流預測</button>

        <div class="fin-nav-mine-ok" style="padding:14px 16px 4px;font-size:10px;color:#555;letter-spacing:0.1em;">🏦 銀行與設定</div>
        <button class="finance-nav-btn fin-nav-mine-ok" data-subview="banking">🏦 銀行帳戶</button>
        <button class="finance-nav-btn fin-nav-mine-ok" data-subview="settings">⚙️ 科目與設定</button>

        <div style="padding:16px;margin-top:20px;border-top:1px solid #2a2a2a;">
            <button id="finance-refresh" class="crm-btn crm-btn-secondary crm-btn-sm" style="width:100%;">🔄 重新整理</button>
        </div>
    </nav>

    <!-- 右側內容區：帳務內嵌殼（wrapper 便於 display 切換）+ 子視圖容器並存 -->
    <!-- overflow 只擋**橫向**（防 flex 撐破）：縱向要留給頁面決定 —— 主系統整頁
         跟著 body 捲、/my-ledger.html 是固定視窗高的殼所以自己捲（該頁樣式表
         覆寫 overflow-y:auto）。寫成 inline 的 overflow:hidden 會連縱向一起關掉，
         而 inline 樣式外部表覆寫不了 → 內容超過一屏就整段裁掉、哪一層都捲不動
         （2026-08-24 資產儀表板實測）。 -->
    <main id="finance-content" style="flex:1;min-width:0;overflow-x:hidden;padding:0 12px;">
        <div id="finance-invoices-wrap">
            <div id="finance-loading" style="color:#888;padding:40px;text-align:center;">載入中…</div>
        </div>
        <div id="finance-subview" style="display:none;padding:12px 4px 32px;"></div>
    </main>
</div>

<style>
    /* 內部橫向 view bar 由左側導覽代理 — 按鈕保留在 DOM（切換邏輯不動，回退安全），只隱藏 */
    #finance-content .crm-view-switcher { display: none; }
    #finance-nav { scrollbar-width: thin; scrollbar-color: #3a3a3a transparent; }
</style>
