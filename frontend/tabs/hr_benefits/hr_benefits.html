<!--
    hr_benefits.html — 人事管理 › 福委會 Tab 殼（docs/BENEFIT_POOL_PLAN.md）
    內容由 hr_benefits.js render 進 #hb-content。設計鐵則：UI 無 emoji（owner 2026-07-17）。
    樣式刻意抄 hr_leave（同一個群組的兩個 tab 長得不一樣會很怪）。
-->
<div id="hb-root">
    <!-- 🔴 置中放在佔位文字自己身上，不要放在這個永久容器上：容器的 inline
         text-align 在 innerHTML 換成真內容後還在，表格的 td 沒自己指定就會繼承
         它 → 表頭靠左、儲存格置中，兩邊對不齊（2026-08-21 owner 回報）。 -->
    <div id="hb-content"><div class="hb-empty" style="padding:40px;">載入中…</div></div>
</div>

<style>
    /* 🔴 整個 tab 給寬度上限並置中。不設的話在寬螢幕上，彈性那一欄會一路撐到
       1500px 去裝五個字，中間留一大片空白 —— 欄位其實對齊了，看起來還是很亂
       （2026-08-21 owner）。這個上限只框住福委會，不動其他 tab。 */
    #hb-root { max-width: 1240px; margin: 0 auto; }
    /* 置中是逐個元素指定的（見上方註解）—— 表格要靠左，所以不能靠容器繼承 */
    #hb-root h2 { color: #fff; font-size: 18px; margin: 0 0 4px 0; font-weight: 600; text-align: center; }
    #hb-root .hb-sub { color: #777; font-size: 12px; margin-bottom: 16px; text-align: center; }
    #hb-root .hb-card {
        background: #232323; border: 1px solid #333; border-radius: 8px;
        padding: 14px 16px; margin-bottom: 14px;
        overflow-x: auto;          /* 配合 table 的 min-width */
    }
    #hb-root .hb-card h3 { color: #ddd; font-size: 14px; margin: 0 0 10px 0; font-weight: 600; text-align: center; }
    /* 🔴 固定欄寬（配各表的 <colgroup>）。用 auto 的話欄寬會按「內容多寡」
       分：螢幕一寬，「項目」就拿去 876px 裝五個字，「操作」只剩 127px 把
       核准／退回擠成上下兩行，日期也折行（2026-08-21 owner：「很不整齊」）。
       只留「項目／備註／池名」一欄彈性吃掉多餘寬度。 */
    #hb-root table {
        width: 100%; border-collapse: collapse; font-size: 12.5px;
        table-layout: fixed;
        /* 🔴 量過的下限：「登記匯款＋退回」要 142px、「單據＋換＋心得」要 117px。
           不設 min-width 的話，視窗一窄「操作」就被壓到 134px，按鈕又疊成上下兩行
           （就是 owner 說的不整齊）。窄螢幕改成卡片內橫向捲，不擠壓欄位。 */
        min-width: 960px;
    }
    #hb-root th {
        text-align: left; color: #888; font-weight: 500; padding: 6px 8px;
        border-bottom: 1px solid #333; white-space: nowrap;
    }
    #hb-root td {
        padding: 6px 8px; border-bottom: 1px solid #2c2c2c; color: #ccc;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* 項目／備註 定寬，太長就折行（切掉的話看不出是哪一筆）。
       多餘寬度一律留給最後一欄 —— 擺在中間會變成一條空白的河。 */
    #hb-root td.wrap { white-space: normal; overflow-wrap: anywhere; }
    #hb-root td.num, #hb-root th.num { text-align: right; font-variant-numeric: tabular-nums; }
    #hb-root .hb-btn {
        background: #3b82f6; color: #fff; border: none; padding: 6px 12px;
        border-radius: 4px; font-size: 12px; cursor: pointer;
    }
    #hb-root .hb-btn:hover { background: #2563eb; }
    #hb-root .hb-btn.ok { background: #16a34a; }
    #hb-root .hb-btn.ok:hover { background: #15803d; }
    #hb-root .hb-btn.ghost { background: transparent; border: 1px solid #444; color: #ccc; }
    #hb-root .hb-btn.ghost:hover { background: #333; }
    #hb-root .hb-btn.danger { background: transparent; border: 1px solid rgba(239,68,68,.4); color: #f87171; }
    #hb-root .hb-btn.danger:hover { background: rgba(239,68,68,.08); }
    #hb-root .hb-pill {
        display: inline-block; font-size: 11px; border-radius: 999px; padding: 2px 10px;
        border: 1px solid #444; color: #aaa; white-space: nowrap;
    }
    #hb-root .hb-pill.draft { border-color: #444; color: #999; }
    #hb-root .hb-pill.pending { border-color: #a16207; color: #fbbf24; }
    #hb-root .hb-pill.approved { border-color: #1d4ed8; color: #93c5fd; }
    #hb-root .hb-pill.paid { border-color: #166534; color: #4ade80; }
    #hb-root .hb-pill.rejected { border-color: #7f1d1d; color: #f87171; }
    /* 併入個人所得的標記 —— 會計最在意的一欄，要一眼看得到 */
    #hb-root .hb-tax { border-color: #7c3aed; color: #c4b5fd; }
    #hb-root select, #hb-root input, #hb-root textarea {
        background: #1a1a1a; border: 1px solid #333; color: #ddd; border-radius: 4px;
        padding: 6px 8px; font-size: 12.5px;
    }
    #hb-root input[type="number"] { width: 110px; }
    #hb-root .hb-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #hb-root .hb-note { color: #777; font-size: 11.5px; margin-top: 8px; line-height: 1.6; text-align: center; }
    #hb-root .hb-empty { color: #666; padding: 14px 0; text-align: center; font-size: 12.5px; }
    /* 單據／心得標示：有＝亮、沒有＝淡。兩者都是選填，沒有不是錯誤 */
    #hb-root .hb-proof {
        display: inline-block; font-size: 10.5px; color: #5a5a5a;
        padding: 1px 6px; border-radius: 4px; white-space: nowrap;
        text-decoration: none;
    }
    #hb-root .hb-proof.ok { color: #93c5fd; background: #17273d; }
    #hb-root a.hb-proof.ok:hover { background: #1e3a5f; text-decoration: underline; }
    /* 「補」是次要動作 —— 沒有單據/心得不是錯誤，按鈕不該搶眼 */
    #hb-root button.hb-proof {
        border: 1px dashed #3a3a3a; background: transparent; cursor: pointer;
        font-family: inherit;
    }
    #hb-root button.hb-proof:hover { border-color: #555; color: #aaa; }
    #hb-root button.hb-proof.ok { border-style: solid; border-color: #17273d; }
    #hb-root button.hb-proof.ok:hover { background: #1e3a5f; color: #bfdbfe; }
    /* 池的用量條 */
    #hb-root .hb-bar { height: 6px; background: #1a1a1a; border-radius: 3px; overflow: hidden; margin-top: 6px; }
    #hb-root .hb-bar > i { display: block; height: 100%; background: #3b82f6; }
    #hb-root .hb-bar > i.over { background: #ef4444; }
    #hb-root .hb-pools { display: flex; flex-wrap: wrap; gap: 10px; }
    #hb-root .hb-pool {
        background: #1e1e1e; border: 1px solid #333; border-radius: 6px;
        padding: 10px 12px; min-width: 210px; cursor: pointer; text-align: center;
    }
    #hb-root .hb-pool.sel { border-color: #3b82f6; background: #1a2436; }
    #hb-root .hb-pool .n { color: #ddd; font-size: 13px; font-weight: 600; }
    #hb-root .hb-pool .m { color: #888; font-size: 11.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
    #hb-root .hb-pool .m b { color: #eee; font-weight: 600; }
    #hb-root .hb-pool .m b.over { color: #f87171; }
</style>
