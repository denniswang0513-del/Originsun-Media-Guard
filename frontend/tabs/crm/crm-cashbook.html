<!-- Cash Entry Toolbar -->
<div class="crm-toolbar">
  <input id="cash-search" type="search" placeholder="搜尋內容、備註、發票號碼..." class="crm-search-input">
  <!-- 類別選項由 JS 依實際資料生成（寫死的清單跟不上使用中的類別，選了篩不到東西）。
       原本還有一個「全部項目」篩 item 欄 —— 那欄從來沒有資料，永遠篩出空白，已移除。 -->
  <!-- 分類篩選（owner 2026-08-27）：**一排會長的下拉** —— 選了類別就長出項目、
       選了項目就長出子項目，一路到底（家用▸變動支出▸醫療保健▸乳癌治療▸台北馬偕）。
       選項與監聽都由 _syncTaxFilter 生成（深度不定，寫死幾顆就會不夠用）。 -->
  <span id="cash-filter-tax" style="display:flex;gap:6px;"></span>
  <select id="cash-filter-dir" class="crm-select">
    <option value="">收入＋支出</option>
    <option value="in">只看收入</option>
    <option value="out">只看支出</option>
  </select>
  <!-- 日期區間／金額（owner 2026-08-26「可以篩選日期區間、分類、子項目、金額」；
       分類與子項目已收斂到上面那排會長的下拉）-->
  <input id="cash-filter-from" type="date" class="crm-input" title="起日（含）" style="width:132px;">
  <span style="color:#666;">–</span>
  <input id="cash-filter-to" type="date" class="crm-input" title="迄日（含）" style="width:132px;">
  <input id="cash-filter-amin" type="number" class="crm-input" placeholder="金額 ≥" title="金額下限（收入或支出的量級）" style="width:88px;">
  <input id="cash-filter-amax" type="number" class="crm-input" placeholder="金額 ≤" title="金額上限" style="width:88px;">
  <!-- 六日／假日（owner 2026-08-27）：判斷屬公屬私時常要單獨看假日花的錢。
       純前端篩（列都已在手上），不打後端。 -->
  <button id="cash-filter-off" type="button" class="crm-btn crm-btn-secondary crm-btn-sm"
          aria-pressed="false" title="只看落在六日或國定假日的收支">六日／假日</button>
  <div class="crm-toolbar-right">
    <!-- 對帳與匯入 CSV 本來是兩顆 —— 對使用者是同一件事（把外面的帳弄進來），
         合成一個入口，兩者都在展開的面板裡。 -->
    <!-- 批次分類（owner 2026-08-28）：信用卡明細同一家店一個月十幾筆，
         一筆一筆點三格分類要按上千次。 -->
    <!-- 欄位：自己選要顯示哪些欄（owner 2026-09-03）；記在瀏覽器 -->
    <span style="position:relative;">
      <button id="cash-btn-cols" class="crm-btn crm-btn-secondary" title="選擇要顯示哪些欄">欄位</button>
      <div id="cash-cols-pop" style="display:none;"></div>
    </span>
    <button id="cash-btn-batch" class="crm-btn crm-btn-secondary"
            title="點列選取（Shift 選一整段），一次把它們分到同一個分類">批次分類</button>
    <button id="cash-btn-recon" class="crm-btn crm-btn-secondary"
            title="上傳對帳單、分類規則、對帳工作台、核對餘額、匯入 CSV">🔍 對帳／匯入</button>
    <button id="cash-btn-add" class="crm-btn crm-btn-primary">+ 新增</button>
  </div>
</div>

<!-- Body -->
<div class="crm-body">
  <!-- 對帳／匯入面板：就地展開，**不跳到銀行帳戶**（owner 2026-08-22：
       「對帳系統按了之後就直接在收支表這裡對帳」）。整套對帳系統由
       finance/subviews/recon.js 掛進 #cash-recon-mount —— 這裡只出外框，
       一行對帳邏輯都不複製（分類規則有兩份就會靜默錯帳）。 -->
  <div class="crm-list-panel" id="cash-recon-panel" style="display:none;">
    <div class="crm-toolbar">
      <button id="cash-recon-back" class="crm-btn crm-btn-secondary crm-btn-sm">← 回收支明細</button>
      <div class="crm-toolbar-right">
        <button id="cash-btn-import" class="crm-btn crm-btn-secondary">匯入 CSV（收支明細）</button>
      </div>
    </div>
    <div id="cash-recon-mount" style="flex:1;overflow:auto;padding:16px;"></div>
  </div>

  <div class="crm-list-panel" id="cash-list-panel">
    <!-- 帳戶切換列：總表／各銀行，每個都標當下餘額。放這裡而不是塞進工具列的
         下拉 —— 餘額是每天要看的數字，藏在下拉裡等於沒有。 -->
    <div class="cash-acct-tabs" id="cash-acct-tabs"></div>
    <!-- 批次分類列：只在批次模式顯示。分類下拉由 _batchTaxDraw 生成
         （深度不定，寫死幾顆就會不夠用 —— 同篩選器那排）。 -->
    <div id="cash-batch-bar" style="display:none;align-items:center;gap:8px;padding:8px 12px;
         border-bottom:1px solid #2e2e2e;background:#1b1b1b;flex-wrap:wrap;">
      <span id="cash-batch-count" style="color:#9ca3af;font-size:12px;"></span>
      <button id="cash-batch-all" class="crm-btn crm-btn-secondary crm-btn-sm"
              title="選取目前篩選出來的全部（不只畫面上這幾列）">全選目前清單</button>
      <button id="cash-batch-same" class="crm-btn crm-btn-secondary crm-btn-sm"
              title="點一列之後按這個，會把「內容」一模一樣的都選起來">選相同內容</button>
      <button id="cash-batch-none" class="crm-btn crm-btn-secondary crm-btn-sm">清除選取</button>
      <span id="cash-batch-tax" style="display:flex;gap:6px;"></span>
      <button id="cash-batch-apply" class="crm-btn crm-btn-primary crm-btn-sm">套用分類</button>
      <button id="cash-batch-clear" class="crm-btn crm-btn-secondary crm-btn-sm"
              title="把選取的這幾筆的分類清掉">清掉分類</button>
      <span style="flex:1;"></span>
      <button id="cash-batch-exit" class="crm-btn crm-btn-secondary crm-btn-sm">結束批次</button>
    </div>
    <div class="crm-list-header acct-header">
      <!-- 每格帶 cash-c-<key>：「欄位」鈕選要顯示哪些欄（display:none，不抽節點 —— 欄寬是 nth-child） -->
      <span class="cash-c-date" data-sort-key="date">日期 <span class="crm-sort-ind">↕</span></span>
      <span class="cash-c-summary" data-sort-key="summary">內容 <span class="crm-sort-ind">↕</span></span>
      <span class="cash-c-deposit" data-sort-key="deposit">收入 <span class="crm-sort-ind">↕</span></span>
      <span class="cash-col-card cash-c-card" data-sort-key="card">信用卡 <span class="crm-sort-ind">↕</span></span>
      <span class="cash-c-expense" data-sort-key="expense">支出 <span class="crm-sort-ind">↕</span></span>
      <span class="cash-c-book" data-sort-key="book">類別 <span class="crm-sort-ind">↕</span></span>
      <span class="cash-c-item" data-sort-key="item">項目 <span class="crm-sort-ind">↕</span></span>
      <span class="cash-c-sub_item" data-sort-key="sub_item">子項目 <span class="crm-sort-ind">↕</span></span>
      <span class="cash-c-bank_memo" data-sort-key="bank_memo">銀行資訊 <span class="crm-sort-ind">↕</span></span>
      <span class="cash-c-note" data-sort-key="note">附註 <span class="crm-sort-ind">↕</span></span>
      <span class="cash-c-project" data-sort-key="project">專案 <span class="crm-sort-ind">↕</span></span>
      <span class="cash-col-inv cash-c-invoice" data-sort-key="invoice">發票 <span class="crm-sort-ind">↕</span></span>
      <span class="cash-c-payment" data-sort-key="payment">請款單 <span class="crm-sort-ind">↕</span></span>
      <span class="cash-c-account" data-sort-key="account">帳戶 <span class="crm-sort-ind">↕</span></span>
      <span style="flex:0 0 36px;"></span>
    </div>
    <div id="cash-list-body"><div class="crm-empty">載入中...</div></div>
  </div>

  <div class="crm-resize-handle" id="cash-resize-handle" style="display:none;"></div>
  <div class="crm-detail-panel" id="cash-detail-panel" style="display:none;">
    <div class="crm-detail-bar">
      <div id="cash-detail-title" class="crm-detail-bar-title"></div>
      <div class="crm-detail-bar-actions" id="cash-bar-actions">
        <button id="cash-detail-close" class="crm-detail-close" title="關閉">&#x2715;</button>
      </div>
    </div>
    <div class="crm-detail-content" id="cash-detail-content"></div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div id="cash-modal" class="crm-modal-overlay" style="display:none;">
  <div class="crm-modal">
    <div class="crm-modal-header">
      <h3 id="cash-modal-title">新增收支</h3>
      <button onclick="document.getElementById('cash-modal').style.display='none'" class="crm-detail-close">&#x2715;</button>
    </div>
    <div class="crm-modal-body">
      <!-- 1. 收支 -->
      <div class="crm-form-section">收支</div>
      <div class="crm-form-grid">
        <div class="crm-field">
          <label>日期</label>
          <input id="cash-f-entry_date" type="date" class="crm-input">
        </div>
        <div class="crm-field">
          <label>內容 <span class="crm-required">*</span></label>
          <input id="cash-f-summary" type="text" class="crm-input">
        </div>
        <div class="crm-field">
          <label>收入</label>
          <input id="cash-f-deposit" type="number" class="crm-input" min="0">
        </div>
        <div class="crm-field">
          <label>支出</label>
          <input id="cash-f-expense" type="number" class="crm-input" min="0">
        </div>
        <div class="crm-field">
          <label>類別</label>
          <select id="cash-f-category" class="crm-input">
            <!-- 選項由 JS 依 /cash-entries/options 填（正本是
                 finance_category_map）—— 寫死會跟種子脫節 -->
          </select>
        </div>
        <div class="crm-field crm-field-full">
          <label>備註</label>
          <input id="cash-f-note" type="text" class="crm-input">
        </div>
      </div>

      <!-- 2. 關聯資訊 -->
      <div class="crm-form-section">關聯資訊</div>
      <div class="crm-form-grid">
        <div class="crm-field crm-field-full" id="cash-field-project">
          <label>專案</label>
          <select id="cash-f-project_id" class="crm-input"><option value="">— 不關聯 —</option></select>
        </div>
        <div class="crm-field" id="cash-field-invoice">
          <label>發票</label>
          <select id="cash-f-invoice_id" class="crm-input"><option value="">— 不關聯 —</option></select>
        </div>
        <div class="crm-field" id="cash-field-bankfee">
          <label>匯費</label>
          <input id="cash-f-bank_fee" type="number" class="crm-input" min="0" value="0">
        </div>
        <!-- 帳戶（財務模組）— 清單載入成功才顯示（優雅降級） -->
        <div class="crm-field" id="cash-field-bankaccount" style="display:none;">
          <label>帳戶</label>
          <select id="cash-f-bank_account_id" class="crm-input"><option value="">— 未指定 —</option></select>
        </div>
        <!-- 預支關聯（專案雜支時顯示） -->
        <div id="cash-advance-section" class="crm-field crm-field-full" style="display:none;">
          <label style="display:flex;align-items:center;gap:4px;cursor:pointer;margin:0;">
            <input type="checkbox" id="cash-f-advance-check" onchange="window._cashToggleAdvance(this.checked)"> 預支關聯
          </label>
          <div style="font-size:11px;color:#6b7280;margin-top:4px;">填「支出」= 發款，填「收入」= 收款</div>
          <div id="cash-advance-list" style="display:none;margin-top:8px;"></div>
          <input type="hidden" id="cash-f-advance_payment_id" value="">
        </div>
      </div>

      <!-- 3. 補充資訊 -->
      <div class="crm-form-section">補充資訊</div>
      <div class="crm-form-grid">
        <div class="crm-field">
          <label>客戶</label>
          <div id="cash-client-match" style="font-size:13px;color:#6b7280;padding:6px 0;">—</div>
        </div>
      </div>

      <div id="cash-modal-error" class="crm-error" style="display:none;"></div>
    </div>
    <div class="crm-modal-footer">
      <button onclick="document.getElementById('cash-modal').style.display='none'" class="crm-btn crm-btn-secondary">取消</button>
      <button id="cash-btn-save" class="crm-btn crm-btn-primary">儲存</button>
    </div>
  </div>
</div>

<!-- CSV Import Modal -->
<div id="cash-import-modal" class="crm-modal-overlay" style="display:none;">
  <div class="crm-modal" style="max-width:480px;">
    <div class="crm-modal-header">
      <h3>匯入收支 CSV</h3>
      <button onclick="document.getElementById('cash-import-modal').style.display='none'" class="crm-detail-close">&#x2715;</button>
    </div>
    <div class="crm-modal-body">
      <p class="crm-import-hint">支援你現有的收支明細表格式。</p>
      <div class="crm-drop-zone" id="cash-drop-zone">
        <div class="crm-drop-icon">📂</div>
        <div>拖曳 CSV 至此，或</div>
        <label class="crm-btn crm-btn-secondary" style="cursor:pointer;margin-top:8px;">
          選擇檔案<input id="cash-csv-file" type="file" accept=".csv" style="display:none;">
        </label>
        <div id="cash-drop-filename" style="margin-top:8px;color:#9ca3af;font-size:12px;"></div>
      </div>
      <div id="cash-import-result" style="display:none;" class="crm-import-result"></div>
    </div>
    <div class="crm-modal-footer">
      <button onclick="document.getElementById('cash-import-modal').style.display='none'" class="crm-btn crm-btn-secondary">關閉</button>
      <button id="cash-btn-do-import" class="crm-btn crm-btn-primary" disabled>開始匯入</button>
    </div>
  </div>
</div>
