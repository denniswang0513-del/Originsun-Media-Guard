<!--
    timesheets.html — ⏱️ 工時檢核 Tab 殼（N2 階段0：Google Sheet 同步的 burn 檢核）
    內容全部由 timesheets.js render 進 #ts-content（同源打 master /api/v1/timesheets/*）。
-->
<div id="ts-root">
    <div id="ts-content" style="color:#888;padding:40px;text-align:center;">載入中…</div>
</div>

<style>
    #ts-root h2 { color: #fff; font-size: 18px; margin: 0 0 4px 0; font-weight: 600; }
    #ts-root .ts-sub { color: #777; font-size: 12px; margin-bottom: 16px; }
    #ts-root .ts-chip {
        display: inline-block; background: #232323; border: 1px solid #333;
        border-radius: 8px; padding: 8px 14px; margin: 0 8px 8px 0; font-size: 12px; color: #aaa;
    }
    #ts-root .ts-chip b { color: #eee; font-size: 16px; font-weight: 600; margin-right: 4px; }
    #ts-root .ts-card {
        background: #232323; border: 1px solid #333; border-radius: 8px;
        padding: 14px 16px; margin-bottom: 14px;
    }
    #ts-root .ts-card h3 { color: #ddd; font-size: 14px; margin: 0 0 10px 0; font-weight: 600; }
    #ts-root table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    #ts-root th {
        text-align: left; color: #888; font-weight: 500; padding: 6px 8px;
        border-bottom: 1px solid #333; white-space: nowrap;
    }
    #ts-root td { padding: 6px 8px; border-bottom: 1px solid #2c2c2c; color: #ccc; }
    #ts-root td.num, #ts-root th.num { text-align: right; font-variant-numeric: tabular-nums; }
    #ts-root .ts-pct {
        display: inline-block; min-width: 64px; text-align: right; padding: 2px 8px;
        border-radius: 6px; font-weight: 600;
    }
    #ts-root .ts-btn {
        background: #3b82f6; color: #fff; border: none; padding: 6px 12px;
        border-radius: 4px; font-size: 12px; cursor: pointer;
    }
    #ts-root .ts-btn:hover { background: #2563eb; }
    #ts-root .ts-btn.ghost { background: transparent; border: 1px solid #444; color: #ccc; }
    #ts-root .ts-btn.ghost:hover { background: #333; }
    #ts-root .ts-note { color: #777; font-size: 11.5px; margin-top: 8px; line-height: 1.6; }
    #ts-root .ts-link { color: #93c5fd; cursor: pointer; }
    #ts-root .ts-link:hover { text-decoration: underline; }
    #ts-root .ts-badge {
        display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px;
        font-size: 10.5px; background: #2c2c2c; color: #9ca3af; vertical-align: middle;
    }
    #ts-root .ts-badge.warn { background: #78350f; color: #fbbf24; }
    #ts-root code {
        background: #1a1a1a; border: 1px solid #333; border-radius: 4px;
        padding: 1px 6px; font-size: 11.5px; color: #93c5fd; word-break: break-all;
    }
    #ts-root ol { color: #bbb; font-size: 13px; line-height: 2; padding-left: 20px; margin: 8px 0; }

    /* 專案彈窗：點案名就地看執行狀態 */
    #ts-root .ts-modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.62); z-index: 200;
        display: flex; align-items: flex-start; justify-content: center; padding: 36px 20px; overflow: auto; }
    #ts-root .ts-modal { position: relative; background: #1b1b1b; border: 1px solid #3a3a3a; border-radius: 10px;
        width: 100%; max-width: 1180px; padding: 18px 22px 14px; box-shadow: 0 16px 48px rgba(0,0,0,.6); }
    #ts-root .ts-modal-x { position: absolute; top: 8px; right: 10px; background: none; border: none; color: #888;
        font-size: 22px; cursor: pointer; line-height: 1; }
    #ts-root .ts-modal-x:hover { color: #eee; }

    /* 我的一天「新增」：像 Google Sheet 的格子 —— 格線、格子填滿、選到的格子藍框、左邊列號 */
    /* 專案格的下拉浮層（掛在 body 上，不能用 #ts-root 限定）：進行中／已結案 兩段 */
    .ts-proj-pop { position: absolute; z-index: 1000; max-height: 320px; overflow-y: auto; background: #1f1f1f; border: 1px solid #3a3a3a; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.5); font-size: 13px; }
    .ts-proj-pop .ts-pp-h { padding: 6px 10px; color: #9ca3af; font-size: 11px; letter-spacing: .08em; background: #262626; position: sticky; top: 0; }
    .ts-proj-pop .ts-pp-toggle { cursor: pointer; color: #60a5fa; }
    .ts-proj-pop .ts-pp-item { padding: 6px 10px; color: #ddd; cursor: pointer; white-space: nowrap; }
    .ts-proj-pop .ts-pp-item.on, .ts-proj-pop .ts-pp-item:hover { background: #2a3b55; color: #fff; }
    .ts-proj-pop .ts-pp-empty { padding: 6px 10px; color: #666; }
    #ts-root table.ts-sheet { table-layout: fixed; border-collapse: collapse; counter-reset: sheetrow; background: #1b1b1b; }
    #ts-root table.ts-sheet th, #ts-root table.ts-sheet td { border: 1px solid #3a3a3a; padding: 0; height: 32px; }
    #ts-root table.ts-sheet th { background: #262626; color: #bbb; font-weight: 500; font-size: 12px; text-align: center; padding: 6px 4px; }
    /* # | 專案 | 分類 | 做了什麼 | 備註 | 起 | 訖 | 實際 | 計畫 | 狀態 | × */
    #ts-root table.ts-sheet th:nth-child(2) { width: 20%; }
    #ts-root table.ts-sheet th:nth-child(3) { width: 104px; }
    #ts-root table.ts-sheet th:nth-child(5) { width: 18%; }
    #ts-root table.ts-sheet th:nth-child(6), #ts-root table.ts-sheet th:nth-child(7) { width: 96px; }
    #ts-root table.ts-sheet th:nth-child(8), #ts-root table.ts-sheet th:nth-child(9) { width: 72px; }
    #ts-root table.ts-sheet th:nth-child(10) { width: 60px; }
    /* 逐日／時間軸表：內容靠左（owner 2026-09-03） */
    #ts-root table.ts-daylog th, #ts-root table.ts-daylog td { text-align: left; vertical-align: top; }
    #ts-root table.ts-daylog th.num, #ts-root table.ts-daylog td.num { text-align: right; }
    #ts-root table.ts-sheet td.ts-sheet-state { font-size: 11px; color: #777; text-align: center; white-space: nowrap; padding: 0 4px; }
    #ts-root table.ts-sheet tr[data-readonly] td { color: #888; background: #1f1f1f; }
    #ts-root table.ts-sheet td input:disabled, #ts-root table.ts-sheet td select:disabled, #ts-root table.ts-sheet td input[readonly] { color: #888; opacity: 1; }
    #ts-root table.ts-sheet td input, #ts-root table.ts-sheet td select {
        width: 100%; height: 32px; box-sizing: border-box; margin: 0; padding: 4px 8px;
        background: transparent; border: none; border-radius: 0; color: #eee; font-size: 13px; font-family: inherit;
    }
    #ts-root table.ts-sheet td input[type="number"] { text-align: right; }
    #ts-root table.ts-sheet td input[type="time"] { color-scheme: dark; text-align: center; }
    #ts-root table.ts-sheet td select option { background: #1b1b1b; }
    #ts-root table.ts-sheet td:focus-within { outline: 2px solid #3b82f6; outline-offset: -2px; background: #1f2937; }
    #ts-root table.ts-sheet tbody tr:hover td { background: #202020; }
    #ts-root table.ts-sheet .ts-sheet-num { width: 34px; background: #262626; color: #777; text-align: center; font-size: 11px; }
    #ts-root table.ts-sheet tbody tr { counter-increment: sheetrow; }
    #ts-root table.ts-sheet tbody td.ts-sheet-num::before { content: counter(sheetrow); }
    #ts-root table.ts-sheet .ts-sheet-del { width: 30px; text-align: center; border-left: none; background: transparent; border-color: transparent; }
    #ts-root table.ts-sheet .ts-sheet-del button { background: none; border: none; color: #666; cursor: pointer; font-size: 14px; }
    #ts-root table.ts-sheet .ts-sheet-del button:hover { color: #f87171; }
</style>
