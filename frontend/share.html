<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>研究筆記｜Knowledge</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/knowledge-icon-32.png">
<meta name="theme-color" content="#070F22">
<!-- 🔴 這是知識庫**唯一不需要登入**的頁面（docs/KNOWLEDGE_BASE_PLAN.md §9.9）。
     只讀 /api/v1/knowledge/public/<share id>，只畫那一本書的延伸（研究助理找到的網路資料）。
     這裡**不准**出現任何指回系統的連結或按鈕（owner 2026-09-19：「但是點不到我其他的地方」）。
     搜尋引擎也不要收（noindex）—— 分享連結是給他自己傳給特定的人的。 -->
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --ink: #E8EEF8; --sub: #8FA6C6; --line: #1E3557; --accent: #38BDF8;
    --bg: #070F22; --panel: #0E1F3A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif; line-height: 1.7; }
  a { color: var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 72px;
    padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  .mark { display: flex; align-items: center; gap: 9px; color: var(--sub); font-size: 12px;
    letter-spacing: .22em; margin-bottom: 28px; }
  .mark img { width: 22px; height: 22px; border-radius: 5px; }
  h1 { font-size: 22px; line-height: 1.45; margin: 0 0 6px; font-weight: 600; }
  .who { color: var(--sub); font-size: 14px; margin-bottom: 14px; }
  .facts { color: var(--sub); font-size: 13px; }
  .facts span + span::before { content: "・"; margin: 0 6px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 0; }
  .tags i { font-style: normal; font-size: 12px; padding: 2px 10px; border-radius: 999px;
    background: var(--panel); color: var(--sub); }
  .lead { margin: 26px 0 6px; padding-top: 22px; border-top: 1px solid var(--line);
    font-size: 15px; font-weight: 600; }
  .lead + .note { color: var(--sub); font-size: 13px; margin: 0 0 18px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px;
    background: var(--panel); }
  li .t { font-size: 15.5px; line-height: 1.5; }
  li .t a { text-decoration: underline; text-underline-offset: 3px; }
  li .orig { color: var(--sub); font-size: 12.5px; margin-top: 3px; }
  li .src { color: var(--sub); font-size: 12.5px; margin-top: 6px; }
  li .sum { font-size: 14px; margin-top: 9px; }
  li .why { color: var(--sub); font-size: 13.5px; margin-top: 7px; }
  footer { color: var(--sub); font-size: 12px; margin-top: 34px; padding-top: 18px;
    border-top: 1px solid var(--line); line-height: 1.8; }
  .state { color: var(--sub); padding: 60px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <div class="mark"><img src="/img/knowledge-icon-32.png" alt="">KNOWLEDGE</div>
  <div id="host"><div class="state">載入中…</div></div>
</main>
<script>
// 🔴 這一頁不帶 token、不寫任何東西、不連回系統的其他地方。
// 分享 id 放在 hash：不會進伺服器的存取紀錄，也不會被 referer 帶到別的網站去。
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const host = document.getElementById("host");

function row(it) {
  const zh = (it.lang || "").toLowerCase().startsWith("zh");
  const safe = /^https?:\/\//i.test(it.url || "") ? it.url : "";
  const title = esc(it.title_zh || it.title_original || "（無標題）");
  const src = [it.source, it.published].filter(Boolean).map(esc).join("　");
  return `<li>
    <div class="t">${safe ? `<a href="${esc(safe)}" target="_blank" rel="noopener noreferrer nofollow">${title}</a>` : title}</div>
    ${!zh && it.title_original ? `<div class="orig">${esc(it.title_original)}${it.lang ? `（${esc(it.lang)}）` : ""}</div>` : ""}
    ${src ? `<div class="src">出處：${src}</div>` : ""}
    ${it.summary_zh ? `<div class="sum">${esc(it.summary_zh)}</div>` : ""}
    ${it.why_it_matters ? `<div class="why">為什麼值得看：${esc(it.why_it_matters)}</div>` : ""}
  </li>`;
}

function render(d) {
  const info = d.info || {};
  const facts = ["publisher", "published", "translator", "isbn"]
    .map((k) => info[k]).filter(Boolean).map((v) => `<span>${esc(v)}</span>`).join("");
  const n = (d.extend || []).length;
  document.title = `${d.title || "研究筆記"}｜Knowledge`;
  host.innerHTML = `
    <h1>${esc(d.title || "")}</h1>
    ${d.author ? `<div class="who">${esc(d.author)}</div>` : ""}
    ${facts ? `<div class="facts">${facts}</div>` : ""}
    ${info.subtitle ? `<div class="facts" style="margin-top:6px">${esc(info.subtitle)}</div>` : ""}
    ${(d.tags || []).length ? `<div class="tags">${d.tags.map((t) => `<i>${esc(t)}</i>`).join("")}</div>` : ""}
    <div class="lead">讀這本書之後找到的延伸資料（${n}）</div>
    <p class="note">每一則都附原始出處與連結。這些是網路上的公開資料，<b>不是這本書的作者說的</b>。</p>
    ${n ? `<ol>${d.extend.map(row).join("")}</ol>`
    : `<div class="state">這份分享還沒有內容。</div>`}
    <footer>
      以上是針對《${esc(d.title || "")}》整理的延伸資料，書本身的內容不在這裡。
      要看原書請支持原作者與出版社。<br>
      由 Knowledge 知識庫整理${d.shared_at ? `・分享於 ${esc(String(d.shared_at).slice(0, 10))}` : ""}
    </footer>`;
}

(async () => {
  const id = (location.hash || "").replace(/^#/, "").trim();
  if (!/^[0-9a-f]{32}$/.test(id)) {
    host.innerHTML = '<div class="state">這個連結不完整。請跟分享給你的人再要一次。</div>';
    return;
  }
  try {
    const r = await fetch(`/api/v1/knowledge/public/${id}`);
    if (!r.ok) throw new Error(String(r.status));
    render(await r.json());
  } catch (e) {
    host.innerHTML = '<div class="state">這個分享連結不存在或已經關閉。</div>';
  }
})();
window.addEventListener("hashchange", () => location.reload());
</script>
</body>
</html>
