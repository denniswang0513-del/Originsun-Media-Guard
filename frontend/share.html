<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>研究筆記｜Knowledge</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/knowledge-icon-32.png">
<meta name="theme-color" content="#070F22">
<!-- 🔴 這是知識庫**唯一不需要登入**的頁面（docs/KNOWLEDGE_BASE_PLAN.md §9.9）。
     只讀 /api/v1/knowledge/public/<share id>，只畫他**勾選**的那幾段。
     這裡**不准**出現任何指回系統的連結或按鈕（owner 2026-09-19：「但是點不到我其他的地方」）。
     搜尋引擎也不要收（noindex）—— 分享連結是他傳給特定的人的。
     樣式與程式全部內嵌：沒有模組圖，也就不吃 §9.6 那個「新 html ＋ 舊 js」的快取問題。

     版面照他自己的書頁做（owner 2026-09-19：「版面規劃上可以和我的差不多，只是標題變成書名」）：
     跨整頁的表頭 → 左欄分頁 → 右欄內容；窄螢幕分頁變成可橫捲的一列並黏在上緣。
     色票也照 knowledge.html：桌機白底、≤899px 換成 logo 那組午夜藍。 -->
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --red: #c9372c; --ink: #262626; --sub: #737373; --line: #e5e5e5;
    --bg: #fff; --panel: #fff; --soft: #f3f3f3; --soft-2: #fafafa; --on-ink: #fff;
  }
  @media (max-width: 899px) {
    :root {
      --red: #38BDF8; --ink: #E8EEF8; --sub: #8FA6C6; --line: #1E3557;
      --bg: #070F22; --panel: #0E1F3A; --soft: #13294B; --soft-2: #0A1730; --on-ink: #071324;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-size: 14px;
    font-family: "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif; line-height: 1.7; }
  a { color: var(--red); }

  .bar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 9px;
    padding: 13px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
    color: var(--sub); font-size: 11px; letter-spacing: .24em;
    padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }
  .bar img { width: 22px; height: 22px; border-radius: 5px; }
  .bar .tail { margin-left: auto; letter-spacing: 0; font-size: 11.5px; }

  main { max-width: 1240px; margin: 0 auto; padding: 24px 24px 72px;
    padding-left: max(24px, env(safe-area-inset-left)); padding-right: max(24px, env(safe-area-inset-right)); }
  .wrap { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 28px; align-items: start; }
  .wrap > * { min-width: 0; }

  .head { grid-column: 1 / -1; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .head h1 { margin: 0 0 4px; font-size: 21px; font-weight: 600; line-height: 1.45; }
  .head .who { color: var(--sub); font-size: 13.5px; }
  .head .facts { color: var(--sub); font-size: 12.5px; margin-top: 4px; }
  .head .facts span + span::before { content: "・"; margin: 0 6px; }
  .head .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .head .tags i { font-style: normal; font-size: 12px; padding: 2px 10px; border-radius: 999px;
    background: var(--soft); color: var(--sub); }
  .head .dl { margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .head .dl a { display: inline-block; border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 14px; min-height: 38px; font-size: 13px; color: var(--ink); background: var(--panel);
    text-decoration: none; }
  .head .dl a:hover { border-color: var(--red); color: var(--red); }
  .head .dl .w { color: var(--sub); font-size: 12px; margin-left: 10px; }

  nav { position: sticky; top: 62px; display: flex; flex-direction: column; gap: 2px; }
  nav button { text-align: left; background: none; border: 0; border-left: 2px solid transparent;
    padding: 9px 12px; min-height: 40px; font-size: 14px; font-family: inherit; color: var(--sub);
    cursor: pointer; }
  nav button.on { color: var(--ink); border-left-color: var(--red); font-weight: 500; }
  nav button:hover { color: var(--ink); }
  nav button .n { float: right; font-size: 12px; opacity: .7; }

  .pane h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .pane .note { color: var(--sub); font-size: 12.5px; margin: 0 0 16px; line-height: 1.6; }

  ol.items { list-style: none; margin: 0; padding: 0; }
  ol.items li { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
    margin-bottom: 14px; background: var(--panel); }
  ol.items .t { font-size: 15px; line-height: 1.5; }
  ol.items .t a { text-decoration: underline; text-underline-offset: 3px; }
  ol.items .orig { color: var(--sub); font-size: 12.5px; margin-top: 3px; }
  ol.items .src { color: var(--sub); font-size: 12.5px; margin-top: 6px; }
  ol.items .sum { font-size: 13.5px; margin-top: 9px; }
  ol.items .why { color: var(--sub); font-size: 13px; margin-top: 7px; }

  .md h2 { font-size: 16px; margin: 22px 0 6px; }
  .md h3 { font-size: 14.5px; margin: 16px 0 4px; }
  .md ul { padding-left: 20px; margin: 8px 0; }
  .md li { margin: 3px 0; }
  .md p { margin: 8px 0; }
  .md code { background: var(--soft); border-radius: 4px; padding: 0 4px; font-size: 13px; }
  /* 表格：窄螢幕自己橫捲，不要把整頁撐破 */
  .tw { overflow-x: auto; margin: 12px 0; }
  .md table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .md th { background: var(--soft); font-weight: 500; white-space: nowrap; }
  .md figure { margin: 14px 0; }
  .md figcaption { margin-top: 5px; }

  /* 章節：清單 → 單章 */
  ul.chlist { list-style: none; margin: 0; padding: 0; }
  ul.chlist button { display: flex; width: 100%; align-items: baseline; gap: 10px; text-align: left;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 11px 14px;
    margin-bottom: 8px; min-height: 44px; font-size: 14px; font-family: inherit; color: var(--ink); cursor: pointer; }
  ul.chlist button:hover { border-color: var(--red); }
  ul.chlist .t { flex: 1; min-width: 0; }
  ul.chlist .p { flex: none; color: var(--sub); font-size: 12px; }
  .chnav { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .chnav button { background: none; border: 0; color: var(--red); font-size: 13.5px; font-family: inherit;
    cursor: pointer; padding: 6px 0; min-height: 40px; }
  .chnav .now { color: var(--sub); font-size: 13px; }

  figure { margin: 0 0 22px; }
  figure img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; }
  figcaption { color: var(--sub); font-size: 12.5px; margin-top: 6px; line-height: 1.6; }
  figcaption .src { display: block; opacity: .75; margin-top: 2px; }
  .grp { margin-bottom: 22px; }
  .grp h3 { margin: 0 0 12px; font-size: 13px; font-weight: 500; color: var(--sub);
    padding-bottom: 6px; border-bottom: 1px solid var(--line); }

  footer { grid-column: 1 / -1; color: var(--sub); font-size: 12px; margin-top: 34px;
    padding-top: 18px; border-top: 1px solid var(--line); line-height: 1.8; }
  .state { color: var(--sub); padding: 60px 0; text-align: center; }

  @media (max-width: 899px) {
    main { padding: 16px 16px 48px;
      padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
    .wrap { grid-template-columns: minmax(0, 1fr); gap: 14px; }
    /* 分頁變成可橫捲的一列並黏在上緣（同他書頁窄螢幕的做法） */
    nav { position: sticky; top: 49px; z-index: 20; flex-direction: row; gap: 2px;
      overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--bg);
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 2px 0; }
    nav button { white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent;
      min-height: 44px; padding: 9px 13px; }
    nav button.on { border-bottom-color: var(--red); }
    nav button .n { float: none; margin-left: 5px; }
    .head { padding-bottom: 10px; }
    .head h1 { font-size: 18px; }
  }
  @media print {
    .bar, nav, .head .dl { display: none; }
    .wrap { display: block; }
    ol.items li, figure { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="bar"><img src="/img/knowledge-icon-32.png" alt="">KNOWLEDGE<span class="tail" id="bar-tail"></span></div>
<main id="host"><div class="state">載入中…</div></main>
<script>
// 🔴 這一頁不帶 token、不寫任何東西、不連回系統的其他地方。
// 分享 id 放在 hash：不會進伺服器的存取紀錄，也不會被 referer 帶到別的網站去。
// hash 形狀：`#<32 hex>` 或 `#<32 hex>/<分頁>`（分頁可以直接貼給別人）。
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const host = document.getElementById("host");
const has = (d, k) => Object.prototype.hasOwnProperty.call(d, k);

const inline = (s) => s
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

const isSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
const cells = (l) => {
  let t = l.trim();
  if (t.startsWith("|")) t = t.slice(1);
  if (t.endsWith("|")) t = t.slice(0, -1);
  return t.split("|").map((c) => c.trim());
};

/** markdown → HTML（標題／粗體／行內 code／清單／**表格**／**圖片**／段落）。
 *  能力對齊他自己頁面用的 js/shared/md-lite.js —— 章節筆記裡有表格，少了就整片變文字。
 *  先整段 esc，所以只會產出我們自己寫的標籤。 */
function md(text, id, withImages) {
  const lines = esc(text || "").replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0, ul = false;
  const closeUl = () => { if (ul) { out.push("</ul>"); ul = false; } };
  while (i < lines.length) {
    const line = lines[i].trim();
    if (!line) { closeUl(); i += 1; continue; }
    // 整行就是一張圖：`![說明](assets/pNNN-k.jpg)`
    const img = /^!\[([^\]]*)\]\((assets\/[A-Za-z0-9._-]+)\)$/.exec(line);
    if (img) {
      closeUl(); i += 1;
      if (!withImages) continue;      // 沒勾「書裡的圖」就整張不放（那支端點也會擋）
      out.push('<figure><img src="/api/v1/knowledge/public/' + encodeURIComponent(id) + "/"
        + img[2] + '" alt="' + img[1] + '" loading="lazy">'
        + (img[1] ? "<figcaption>" + img[1] + "</figcaption>" : "") + "</figure>");
      continue;
    }
    const h = /^(#{1,4})\s+(.+)$/.exec(line);
    if (h) { closeUl(); const n = Math.min(h[1].length + 1, 4); out.push("<h" + n + ">" + inline(h[2]) + "</h" + n + ">"); i += 1; continue; }
    // 表格：這一列有 |，下一列是 --- 分隔列
    if (line.includes("|") && i + 1 < lines.length && isSep(lines[i + 1])) {
      closeUl();
      const head = cells(line);
      const rows = [];
      i += 2;
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) { rows.push(cells(lines[i])); i += 1; }
      out.push('<div class="tw"><table><thead><tr>'
        + head.map((c) => "<th>" + inline(c) + "</th>").join("")
        + "</tr></thead><tbody>"
        + rows.map((r) => "<tr>" + head.map((_, k) => "<td>" + inline(r[k] || "") + "</td>").join("") + "</tr>").join("")
        + "</tbody></table></div>");
      continue;
    }
    const li = /^[-*]\s+(.+)$/.exec(line);
    if (li) { if (!ul) { out.push("<ul>"); ul = true; } out.push("<li>" + inline(li[1]) + "</li>"); i += 1; continue; }
    closeUl();
    out.push("<p>" + inline(line) + "</p>");
    i += 1;
  }
  closeUl();
  return out.join("");
}

function extendRow(it) {
  const zh = (it.lang || "").toLowerCase().startsWith("zh");
  const safe = /^https?:\/\//i.test(it.url || "") ? it.url : "";
  const title = esc(it.title_zh || it.title_original || "（無標題）");
  const src = [it.source, it.published].filter(Boolean).map(esc).join("　");
  return "<li>"
    + '<div class="t">' + (safe
      ? '<a href="' + esc(safe) + '" target="_blank" rel="noopener noreferrer nofollow">' + title + "</a>"
      : title) + "</div>"
    + (!zh && it.title_original
      ? '<div class="orig">' + esc(it.title_original) + (it.lang ? "（" + esc(it.lang) + "）" : "") + "</div>" : "")
    + (src ? '<div class="src">出處：' + src + "</div>" : "")
    + (it.summary_zh ? '<div class="sum">' + esc(it.summary_zh) + "</div>" : "")
    + (it.why_it_matters ? '<div class="why">為什麼值得看：' + esc(it.why_it_matters) + "</div>" : "")
    + "</li>";
}

function figuresHtml(d, id) {
  const rows = d.gallery || [];
  const who = [d.title ? "《" + d.title + "》" : "", d.author].filter(Boolean).join("　");
  const chs = has(d, "chapters") ? d.chapters : [];
  // 先把位置佔好：沒有 aspect-ratio 的話 lazy 圖在載入前不佔高度，整頁長度會邊捲邊變
  // （2026-09-19 實測 7,106px → 13,935px），iOS 上切分頁還會留下一片空白。
  const ratio = (a) => (Number(a.w) > 0 && Number(a.h) > 0
    ? ' style="aspect-ratio:' + Number(a.w) + "/" + Number(a.h) + '"' : "");
  const one = (a) => "<figure>"
    + '<img src="/api/v1/knowledge/public/' + encodeURIComponent(id) + "/assets/" + encodeURIComponent(a.name)
    + '" alt="' + esc(a.caption || "") + '" loading="lazy"' + ratio(a) + ">"
    + "<figcaption>" + esc(a.caption || "（原書沒有圖說）")
    + '<span class="src">' + esc("出自" + who + "，第 " + a.page + " 頁") + "</span></figcaption>"
    + "</figure>";
  // 有章節就照章分組（同他自己的「圖輯」分頁）
  const used = new Set();
  const groups = [];
  for (const c of chs) {
    const a = Number(c.start_page) || 0;
    const b = Number(c.end_page) || 0;
    if (!a && !b) continue;
    const mine = rows.filter((x) => x.page >= a && x.page <= b);
    mine.forEach((x) => used.add(x.name));
    if (mine.length) groups.push(["第 " + c.n + " 章 " + (c.title || "") + "（p." + a + "–" + b + "）", mine]);
  }
  const rest = rows.filter((x) => !used.has(x.name));
  if (rest.length) groups.push([groups.length ? "其他頁" : "全書", rest]);
  return groups.map(([t, rs]) => '<div class="grp"><h3>' + esc(t) + "</h3>" + rs.map(one).join("") + "</div>").join("");
}

/** 有哪些分頁可以看 —— 只有他勾了而且真的有內容的才出現。 */
function panesOf(d, id) {
  const p = [];
  const pics = has(d, "gallery");      // 沒勾「書裡的圖」就連文章裡的圖也不放
  const add = (key, label, n, note, body) => { if (body) p.push({ key, label, n, note, body }); };
  if (has(d, "extend")) {
    const rows = d.extend || [];
    add("extend", "延伸研究", rows.length,
      "讀這本書之後在網路上找到的資料，每一則都附原始出處與連結。這些是公開資料，不是這本書的作者說的。",
      rows.length ? '<ol class="items">' + rows.map(extendRow).join("") + "</ol>" : "");
  }
  if (has(d, "conclusion") && d.conclusion) {
    add("conclusion", "結論", 0, "讀完這本書之後認同、打算照著做的原則。", '<div class="md">' + md(d.conclusion, id, pics) + "</div>");
  }
  if (has(d, "notes") && d.notes) {
    add("notes", "筆記", 0, "", '<div class="md">' + md(d.notes, id, pics) + "</div>");
  }
  if (has(d, "skill") && d.skill) {
    add("skill", "骨架", 0, "這本書的核心心智模型與決策規則。以下是整理的筆記，不是原文。",
      '<div class="md">' + md(d.skill, id, pics) + (d.cheatsheet ? md(d.cheatsheet, id, pics) : "") + "</div>");
  }
  if (has(d, "chapters") && (d.chapters || []).length) {
    // 一章一章讀（owner 2026-09-19：「章節重點也要可以分章節閱讀」）——
    // 清單 → 單章 → 返回，跟他自己的書頁一樣。
    add("chapters", "章節重點", d.chapters.length, "以下是針對原書內容整理的筆記，不是原文。", "CHAPTERS");
  }
  if (has(d, "gallery") && (d.gallery || []).length) {
    add("gallery", "圖輯", d.gallery.length, "從原書抽出來的圖，括號是頁數。僅供閱讀筆記參考。", figuresHtml(d, id));
  }
  return p;
}

let STATE = null;

/** 章節分頁：沒帶章號就列清單，帶了就只看那一章。 */
function chaptersBody(n) {
  const { data, id } = STATE;
  const chs = data.chapters || [];
  const pics = has(data, "gallery");
  if (!n) {
    return '<ul class="chlist">' + chs.map((c) => '<li><button type="button" data-ch="' + c.n + '">'
      + "<span class=\"t\">第 " + c.n + " 章 " + esc(c.title || "") + "</span>"
      + (c.start_page ? '<span class="p">p.' + c.start_page + "–" + c.end_page + "</span>" : "")
      + "</button></li>").join("") + "</ul>";
  }
  const c = chs.find((x) => String(x.n) === String(n));
  if (!c) return chaptersBody(0);
  return '<div class="chnav"><button type="button" data-ch="0">← 章節清單</button>'
    + '<span class="now">第 ' + c.n + " 章 " + esc(c.title || "") + "</span></div>"
    + '<div class="md">' + md(c.md, id, pics) + "</div>";
}

function show(key, sub) {
  const { panes } = STATE;
  const pane = panes.find((p) => p.key === key) || panes[0];
  if (!pane) return;
  STATE.key = pane.key;
  for (const b of host.querySelectorAll("nav button[data-k]")) b.classList.toggle("on", b.dataset.k === pane.key);
  const box = host.querySelector(".pane");
  const body = pane.body === "CHAPTERS" ? chaptersBody(sub) : pane.body;
  box.innerHTML = (pane.key === "chapters" && sub ? "" : "<h2>" + esc(pane.label) + "</h2>"
    + (pane.note ? '<p class="note">' + esc(pane.note) + "</p>" : "")) + body;
  const want = "#" + STATE.id + "/" + pane.key + (sub ? "/" + sub : "");
  if (location.hash !== want) history.replaceState(null, "", want);
  window.scrollTo(0, 0);
}

/** 可以帶走的檔案。兩顆各自要他勾過才出現（後端那兩支也各自再認一次）。 */
function downloads(d, id) {
  const on = d.parts || [];
  const base = "/api/v1/knowledge/public/" + encodeURIComponent(id);
  const links = [];
  if (on.includes("pdf")) links.push('<a href="' + base + '/pdf" download>下載這份研究（PDF）</a>');
  if (on.includes("source")) links.push('<a href="' + base + '/source" download>下載原書（PDF）</a>');
  if (!links.length) return "";
  return '<div class="dl">' + links.join("")
    + (on.includes("pdf") ? '<span class="w">研究那份要做十幾秒</span>' : "") + "</div>";
}

function render(d, id) {
  const info = has(d, "info") ? (d.info || {}) : {};
  const facts = ["publisher", "published", "translator", "edition", "isbn"]
    .map((k) => info[k]).filter(Boolean).map((v) => "<span>" + esc(v) + "</span>").join("");
  const panes = panesOf(d, id);
  STATE = { id, panes, key: "", data: d };
  document.title = (d.title || "研究筆記") + "｜Knowledge";
  document.getElementById("bar-tail").textContent = d.shared_at ? "分享於 " + String(d.shared_at).slice(0, 10) : "";

  host.innerHTML = '<div class="wrap">'
    + '<div class="head"><h1>' + esc(d.title || "") + "</h1>"
      + (d.author ? '<div class="who">' + esc(d.author) + "</div>" : "")
      + (info.subtitle ? '<div class="facts">' + esc(info.subtitle) + "</div>" : "")
      + (facts ? '<div class="facts">' + facts + "</div>" : "")
      + (has(d, "tags") && (d.tags || []).length
        ? '<div class="tags">' + d.tags.map((t) => "<i>" + esc(t) + "</i>").join("") + "</div>" : "")
      // 下載一份帶走（owner 2026-09-19：「這裡多一個 pdf 下載，讓大家可以下載資料」）。
      // 這一頁不帶 token，所以是普通的連結；後端印的內容跟這一頁一樣，沒勾的不會在裡面。
      + downloads(d, id)
    + "</div>"
    + (panes.length
      ? "<nav>" + panes.map((p) => '<button type="button" data-k="' + p.key + '">' + esc(p.label)
        + (p.n ? '<span class="n">' + p.n + "</span>" : "") + "</button>").join("") + "</nav>"
        + '<section class="pane"></section>'
      : '<section class="pane"><div class="state">這份分享還沒有內容。</div></section>')
    + "<footer>以上是針對《" + esc(d.title || "") + "》整理的資料，書本身的內容不在這裡。"
      + "要看原書請支持原作者與出版社。<br>由 Knowledge 知識庫整理</footer>"
    + "</div>";

  host.addEventListener("click", (ev) => {
    const nb = ev.target.closest("nav button[data-k]");
    if (nb) { show(nb.dataset.k); return; }
    const cb = ev.target.closest("[data-ch]");
    if (cb) show("chapters", cb.dataset.ch === "0" ? "" : cb.dataset.ch);
  });
  const bits = location.hash.split("/");
  const want = (bits[1] || "").trim();
  show(panes.some((p) => p.key === want) ? want : (panes[0] && panes[0].key), (bits[2] || "").trim());
}

(async () => {
  const id = (location.hash || "").replace(/^#/, "").split("/")[0].trim();
  if (!/^[0-9a-f]{32}$/.test(id)) {
    host.innerHTML = '<div class="state">這個連結不完整。請跟分享給你的人再要一次。</div>';
    return;
  }
  try {
    const r = await fetch("/api/v1/knowledge/public/" + id);
    if (!r.ok) throw new Error(String(r.status));
    render(await r.json(), id);
  } catch (e) {
    host.innerHTML = '<div class="state">這個分享連結不存在或已經關閉。</div>';
  }
})();
</script>
</body>
</html>
