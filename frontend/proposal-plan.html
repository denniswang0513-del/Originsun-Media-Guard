<!doctype html>
<html lang="zh-Hant" class="plan-theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>提案企劃｜ORIGINSUN</title>
<!-- 提案企劃「獨立網址」（docs/PROPOSAL_PLANNER.md §7）：帳號登入 → 提案清單 →
     企劃矩陣（plan-matrix.js 元件，html.plan-theme-light 白底覆寫）。內部工具，
     網址可直接分享給同事共編；閘門模組清單見 boot() 的閘門陣列（與 api_proposals._check_auth 同步）。
     只掛 master / foundry（NAS 官網容器沒有 CRM 後端）。比照 media-log-workspace 家族。 -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --red: #c9372c; --ink: #262626; --sub: #737373; --line: #e5e5e5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif; }
  a { color: inherit; text-decoration: none; }
  .eyebrow { font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--sub); }
  .accent { color: var(--red); }

  header {
    position: sticky; top: 0; z-index: 50; display: flex; align-items: center;
    justify-content: space-between; padding: 14px 24px; background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
  }
  header .brand { display: flex; align-items: center; gap: 12px; }
  header .brand img { height: 30px; width: auto; display: block; }
  header .brand-name { font-size: 13px; letter-spacing: 0.25em; font-weight: 300; }
  header .hdr-right { display: flex; align-items: center; gap: 14px; }
  header .hdr-user { font-size: 12px; color: var(--sub); }
  .btn-ghost { background: none; border: 1px solid var(--line); border-radius: 2px;
    padding: 6px 14px; font-size: 12px; color: var(--sub); cursor: pointer; transition: all .15s; }
  .btn-ghost:hover { color: var(--red); border-color: var(--red); }

  main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }

  /* 登入卡（同 media-log-workspace） */
  .center-wrap { max-width: 380px; margin: 8vh auto 0; }
  .login-card { border: 1px solid var(--line); padding: 40px 36px; }
  .login-card h1 { font-size: 22px; font-weight: 300; letter-spacing: 0.1em; margin: 18px 0 6px; }
  .login-card .sub { font-size: 13px; color: var(--sub); margin-bottom: 28px; line-height: 1.7; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; letter-spacing: 0.15em; color: var(--sub);
    text-transform: uppercase; margin-bottom: 6px; }
  .field input { width: 100%; border: 1px solid var(--line); border-radius: 2px; padding: 10px 12px;
    font-size: 14px; color: var(--ink); outline: none; }
  .field input:focus { border-color: var(--red); }
  .btn-primary { display: block; width: 100%; text-align: center; background: var(--ink); color: #fff;
    border: 0; padding: 12px; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase;
    cursor: pointer; transition: background .15s; }
  .btn-primary:hover { background: var(--red); }
  .err { color: var(--red); font-size: 12px; margin-top: 12px; display: none; }
  .login-divider { display: none; align-items: center; gap: 10px; margin: 20px 0; color: var(--sub); font-size: 11px; }
  .login-divider::before, .login-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  #g_id_signin_container { display: none; justify-content: center; }
  .state-msg { text-align: center; color: var(--sub); font-size: 14px; line-height: 1.9; padding: 40px 12px; }

  /* 提案清單 */
  .list-head { display: flex; align-items: baseline; gap: 14px; margin: 8px 0 18px; }
  .list-head h1 { font-size: 20px; font-weight: 300; letter-spacing: 0.1em; margin: 0; }
  .list-head .hint { font-size: 12px; color: var(--sub); }
  .prop-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    border: 1px solid var(--line); border-top: none; cursor: pointer; transition: background .12s; }
  .prop-row:first-of-type { border-top: 1px solid var(--line); }
  .prop-row:hover { background: #fafafa; }
  .prop-row .t { flex: 1; font-size: 14px; }
  .prop-row .c { font-size: 12px; color: var(--sub); min-width: 90px; }
  .prop-row .badge { font-size: 11px; padding: 2px 10px; border-radius: 2px; white-space: nowrap; }
  .prop-row .badge.on { background: #e6f4ea; color: #147a3d; }
  .prop-row .badge.off { background: #f0f0f0; color: var(--sub); }
  .prop-row .st { font-size: 11px; color: var(--sub); min-width: 48px; text-align: right; }

  /* 企劃視圖 */
  .plan-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; }
  .plan-head h1 { font-size: 18px; font-weight: 400; letter-spacing: 0.05em; margin: 0; flex: 1; }
  .plan-head .back { font-size: 12px; color: var(--sub); cursor: pointer; border: 1px solid var(--line);
    border-radius: 2px; padding: 5px 12px; background: none; }
  .plan-head .back:hover { color: var(--red); border-color: var(--red); }

  /* 側邊欄分頁（基本資料／企劃）— 側欄純文字，不放 emoji */
  .plan-body { display: flex; gap: 20px; align-items: flex-start; }
  .plan-side { display: flex; flex-direction: column; gap: 2px; min-width: 112px;
    position: sticky; top: 72px; }
  .side-tab { text-align: left; background: none; cursor: pointer; color: var(--sub);
    border: none; border-left: 2px solid transparent; padding: 9px 14px; font-size: 13px;
    letter-spacing: 0.05em; transition: all .12s; }
  .side-tab:hover { color: var(--ink); }
  .side-tab.active { color: var(--red); border-left-color: var(--red); background: #fafafa; }
  .plan-main { flex: 1; min-width: 0; }
  @media (max-width: 720px) {
    .plan-body { flex-direction: column; }
    .plan-side { position: static; flex-direction: row; min-width: 0; width: 100%;
      border-bottom: 1px solid var(--line); }
    .side-tab { border-left: none; border-bottom: 2px solid transparent; }
    .side-tab.active { border-bottom-color: var(--red); background: none; }
  }

  /* 基本資料（唯讀）卡片 */
  .info-card { border: 1px solid var(--line); padding: 16px 18px; margin-bottom: 14px; }
  .info-card h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; }
  .info-kv { display: flex; gap: 12px; font-size: 13px; padding: 6px 0;
    border-bottom: 1px dashed var(--line); }
  .info-kv:last-child { border-bottom: none; }
  .info-kv .k { min-width: 84px; color: var(--sub); font-size: 12px; }
  .info-kv .v { flex: 1; min-width: 0; word-break: break-word; }
  .info-kv .v a { color: var(--red); text-decoration: underline; }
  .info-tag { display: inline-block; font-size: 11px; padding: 2px 8px; margin: 0 4px 4px 0;
    background: #f0f0f0; border-radius: 2px; color: var(--sub); }
  .info-ref { padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .info-ref:last-child { border-bottom: none; }
  .info-ref a { color: var(--red); text-decoration: underline; }
  .info-ref .note { font-size: 12px; color: var(--sub); margin-top: 3px; line-height: 1.6; }
  .info-hint { font-size: 11.5px; color: var(--sub); line-height: 1.7; }
  /* 可編控件：平時像文字，focus 才顯出邊框（唯讀感→可編感的漸進揭露） */
  .info-in { width: 100%; font-family: inherit; font-size: 13px; color: var(--ink);
    background: transparent; border: 1px solid transparent; border-radius: 2px;
    padding: 4px 6px; outline: none; }
  .info-in:hover { border-color: var(--line); }
  .info-in:focus { border-color: var(--red); background: #fff; }
  .info-in[readonly] { color: var(--sub); }
  .info-in[readonly]:hover { border-color: transparent; }
  select.info-in { cursor: pointer; }
  .info-ta { min-height: 92px; resize: none; overflow-y: hidden; line-height: 1.8; box-sizing: border-box; }
  .info-save { text-align: right; font-size: 11px; color: var(--sub); min-height: 16px;
    padding: 2px 0; position: sticky; bottom: 0; }
  .info-save.err { color: var(--red); }
  /* 參考影片：每支一列（標題 + 開啟 + 移除 / 備註 / 網址） */
  .info-ref .ref-head { display: flex; gap: 8px; align-items: center; }
  .info-ref .ref-head a { font-size: 12px; color: var(--red); white-space: nowrap; text-decoration: none; }
  .info-ref .ref-head a:hover { text-decoration: underline; }
  .ref-del { background: none; border: 1px solid var(--line); border-radius: 2px; cursor: pointer;
    color: var(--sub); font-size: 11px; padding: 3px 8px; white-space: nowrap; }
  .ref-del:hover { color: var(--red); border-color: var(--red); }
  .ref-url { font-size: 11px; color: var(--sub); padding: 0 6px; word-break: break-all; }
  .ref-add { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--line); }
  .ref-add input { flex: 1; min-width: 150px; border: 1px solid var(--line); border-radius: 2px;
    padding: 6px 8px; font-size: 12.5px; color: var(--ink); outline: none; }
  .ref-add input:focus { border-color: var(--red); }
  .ref-addbtn { background: var(--ink); color: #fff; border: 0; border-radius: 2px; cursor: pointer;
    padding: 6px 14px; font-size: 12px; white-space: nowrap; }
  .ref-addbtn:hover { background: var(--red); }
  .ref-msg { font-size: 11.5px; color: var(--sub); margin-top: 6px; min-height: 14px; }
  .ref-msg.err { color: var(--red); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="/img/originsun-logo.webp" alt="源日影像" onerror="this.style.display='none'">
    <span class="brand-name">提案企劃 <span class="accent">PLANNER</span></span>
  </div>
  <div class="hdr-right">
    <span class="hdr-user" id="hdr-user" style="display:none;"></span>
    <button class="btn-ghost" id="btn-logout" style="display:none;" onclick="doLogout()">登出</button>
  </div>
</header>

<main>
  <!-- 登入 -->
  <div id="login-view" style="display:none;">
    <div class="center-wrap">
      <div class="login-card">
        <div class="eyebrow">Proposal Planner</div>
        <h1>提案企劃登入</h1>
        <div class="sub">登入後用方法論矩陣想案子：THEME、三視角 × 四提問、擬腳本四方向。可多人同時編輯。</div>
        <form onsubmit="doPwdLogin(event)">
          <div class="field"><label>帳號 Account</label><input id="in-user" autocomplete="username"></div>
          <div class="field"><label>密碼 Password</label><input id="in-pwd" type="password" autocomplete="current-password"></div>
          <button class="btn-primary" type="submit">登入 Sign in</button>
        </form>
        <div class="login-divider" id="login-divider">或</div>
        <div id="g_id_signin_container"></div>
        <div id="login-err" class="err"></div>
      </div>
    </div>
  </div>

  <!-- 無權限 -->
  <div id="noperm-view" style="display:none;">
    <div class="state-msg">此帳號沒有提案企劃權限。<br>請管理員在「使用者管理」開通 <b>preprod_plan</b>、<b>preprod_proposals</b> 或 <b>crm_projects</b>（專案管理）模組，或用有權限的帳號登入。
      <div style="margin-top:18px;"><button class="btn-ghost" onclick="doLogout()">換帳號登入</button></div>
    </div>
  </div>

  <!-- 清單 -->
  <div id="list-view" style="display:none;">
    <div class="list-head">
      <h1>提案清單</h1>
      <span class="hint">點一筆進企劃矩陣；標「企劃中」的已有內容。提案的新增與基本資料在後台「提案庫」管理。</span>
    </div>
    <div id="list-host"><div class="state-msg">載入中…</div></div>
  </div>

  <!-- 企劃 -->
  <div id="plan-view" style="display:none;">
    <div class="plan-head">
      <button class="back" id="plan-back" onclick="location.href = location.pathname">← 清單</button>
      <h1 id="plan-title"></h1>
      <span id="guest-bar" style="display:none;align-items:center;gap:8px;">
        <label style="font-size:11px;letter-spacing:.1em;color:var(--sub);white-space:nowrap;">你的名字</label>
        <input id="guest-name" placeholder="共編署名（選填）" style="width:140px;border:1px solid var(--line);border-radius:2px;padding:5px 8px;font-size:12px;color:var(--ink);outline:none;">
      </span>
    </div>
    <div class="plan-body">
      <nav class="plan-side" id="plan-side" style="display:none;">
        <button class="side-tab" data-ptab="info">基本資料</button>
        <button class="side-tab active" data-ptab="plan">企劃</button>
      </nav>
      <div class="plan-main">
        <div id="info-host" style="display:none;"></div>
        <div id="plan-host"><div class="state-msg">載入中…</div></div>
      </div>
    </div>
  </div>
</main>

<script>
"use strict";
const TOKEN_KEY = "auth_token";
const $ = (id) => document.getElementById(id);

async function mfetch(path, opts = {}) {
    const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    const tok = localStorage.getItem(TOKEN_KEY);
    if (tok) headers["Authorization"] = "Bearer " + tok;
    return fetch(path, Object.assign({}, opts, { headers }));
}
function escText(s) { const d = document.createElement("div"); d.textContent = String(s ?? ""); return d.innerHTML; }
// 屬性上下文要另外逃逸引號（escText 走 textContent 不處理 "）；連結只放行 http(s)
function escAttr(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function safeUrl(u) { return /^https?:\/\//i.test(String(u ?? "")) ? u : ""; }

// ── 基本資料側欄分頁（可編輯，自動儲存；登入=完整欄位、公開=後端白名單子集） ──
const PTYPES = ["形象", "廣告", "紀錄片", "政府標案", "社群", "其他"];

// opts: { save: async(field, value)=>void, editable: string[] }
function _renderInfo(host, info, opts) {
    const canEdit = (f) => (opts.editable || []).includes(f);
    const link = (url, label) => safeUrl(url) ? `<a href="${escAttr(url)}" target="_blank" rel="noopener">${escText(label)}</a>` : "";
    // 唯讀列：沒值就整列不畫（畫面不留空殼）
    const ro = (k, v) => v ? `<div class="info-kv"><span class="k">${escText(k)}</span><span class="v">${escText(v)}</span></div>` : "";
    // 可編列：有 data-field 的控件由 _wireInfoEditing 接自動儲存
    const row = (k, ctrl) => `<div class="info-kv"><span class="k">${escText(k)}</span><span class="v">${ctrl}</span></div>`;
    const txt = (f, val, ph) => `<input class="info-in" data-field="${f}" value="${escAttr(val || "")}" placeholder="${escAttr(ph || "")}">`;

    // 清單外的既有值（舊資料/CSV 匯入的自由文字）補成選項，否則 select 會靜默吃掉它
    const ptypeOpts = PTYPES.includes(info.ptype) || !info.ptype ? PTYPES : [info.ptype, ...PTYPES];
    const ptypeCtrl = canEdit("ptype")
        ? row("類型", `<select class="info-in" data-field="ptype"><option value="">（未分類）</option>
            ${ptypeOpts.map(t => `<option value="${escAttr(t)}"${info.ptype === t ? " selected" : ""}>${escText(t)}</option>`).join("")}</select>`)
        : ro("類型", info.ptype);
    const dateCtrl = canEdit("pitch_date")
        ? row("提案日", `<input class="info-in" type="date" data-field="pitch_date" value="${escAttr(info.pitch_date || "")}">`)
        : ro("提案日", info.pitch_date);
    const tagsCtrl = canEdit("tags")
        ? row("標籤", txt("tags", (info.tags || []).join(", "), "逗號分隔，例：政府案, 高雄"))
        : ((info.tags || []).length ? row("標籤", (info.tags || []).map(t => `<span class="info-tag">${escText(t)}</span>`).join("")) : "");
    const budgetCtrl = canEdit("budget_range")
        ? row("預算範圍", txt("budget_range", info.budget_range, "例：80-120 萬"))
        : ro("預算範圍", info.budget_range);
    const reasonCard = canEdit("outcome_reason")
        ? `<div class="info-card"><h4>成案／未成案原因（組織學習）</h4>
             <textarea class="info-in info-ta" data-field="outcome_reason" placeholder="轉成案或未成案時必填"></textarea></div>`
        : (info.outcome_reason ? `<div class="info-card"><h4>成案／未成案原因</h4><div class="info-hint">${escText(info.outcome_reason)}</div></div>` : "");

    const canRefs = !!opts.refs;
    const refs = (info.references || []).map(r => canRefs ? `
        <div class="info-ref" data-rid="${escAttr(r.id)}">
            <div class="ref-head">
                <input class="info-in ref-in" data-rfield="title" data-rid="${escAttr(r.id)}"
                       placeholder="標題（例：參考打光）">
                <a href="${escAttr(opts.refPageUrl ? opts.refPageUrl(r.id) : "#")}" target="_blank"
                   rel="noopener" title="打開這支片的研究頁面">研究頁 ↗</a>
                ${link(r.url, "影片 ↗")}
                <button class="ref-del" data-rid="${escAttr(r.id)}" title="從本提案移除">移除</button>
            </div>
            <input class="info-in ref-in" data-rfield="note" data-rid="${escAttr(r.id)}"
                   placeholder="備註：這支要參考什麼？">
            <div class="ref-url">${escText(r.url)}</div>
        </div>` : `
        <div class="info-ref">${link(r.url, r.title || r.url) || escText(r.title || r.url)}
            ${r.note ? `<div class="note">${escText(r.note)}</div>` : ""}
        </div>`).join("");
    const refAdd = canRefs ? `
        <div class="ref-add">
            <input id="ref-new-url" placeholder="https://…（YouTube / Vimeo / 雲端連結）">
            <input id="ref-new-title" placeholder="標題（可空）">
            <button id="ref-add-btn" class="ref-addbtn">＋ 加入</button>
        </div>
        <div class="ref-msg" id="ref-msg"></div>` : "";

    host.innerHTML = `
        <div class="info-card">
            <h4>基本資訊</h4>
            ${ro("狀態", info.status)}
            ${ro("客戶", info.client_name)}
            ${ptypeCtrl}
            ${dateCtrl}
            ${budgetCtrl}
            ${tagsCtrl}
            ${safeUrl(info.deck_url) ? row("提案簡報", link(info.deck_url, "下載簡報")) : ""}
        </div>
        ${reasonCard}
        <div class="info-card">
            <h4>備註</h4>
            <textarea class="info-in info-ta" data-field="notes"
                placeholder="這份提案的補充說明、客戶偏好、內部提醒…（會自動儲存）"${canEdit("notes") ? "" : " readonly"}></textarea>
        </div>
        <div class="info-card">
            <h4>參考影片（${(info.references || []).length}）</h4>
            ${refs || '<div class="info-hint">尚未加參考影片</div>'}
            ${refAdd}
        </div>
        <div class="info-hint">欄位改完會自動儲存。狀態、客戶、標題與簡報請到後台「提案庫」調整（狀態涉及成案自動建專案）。</div>
        <div class="info-save" id="info-save"></div>`;

    // textarea / 參考片欄位值走 DOM property（不進模板字串 — XSS 防線）
    host.querySelector('[data-field="notes"]').value = info.notes || "";
    const rt = host.querySelector('[data-field="outcome_reason"]');
    if (rt) rt.value = info.outcome_reason || "";
    if (canRefs) {
        const byId = {};
        (info.references || []).forEach(r => { byId[r.id] = r; });
        host.querySelectorAll(".ref-in[data-rfield]").forEach(el => {
            el.value = (byId[el.dataset.rid] || {})[el.dataset.rfield] || "";
        });
        _wireRefs(host, info, opts);
    }
    host.querySelectorAll("textarea.info-ta").forEach(ta => {
        _infoGrow(ta);
        ta.addEventListener("input", () => _infoGrow(ta));   // 內容多長格子就多長
    });
    _wireInfoEditing(host, opts);
}

function _infoGrow(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

// 參考影片：加入 / 移除（動列表→重畫整塊）＋標題備註自動儲存（不重畫，免搶焦點）
function _wireRefs(host, info, opts) {
    const msg = $("ref-msg");
    const say = (t, err) => { msg.textContent = t; msg.classList.toggle("err", !!err); };
    const redraw = async () => {
        const fresh = await opts.reload();
        _renderInfo(host, fresh, opts);
    };

    host.querySelector("#ref-add-btn").addEventListener("click", async () => {
        const url = $("ref-new-url").value.trim();
        const title = $("ref-new-title").value.trim();
        if (!/^https?:\/\//i.test(url)) { say("網址要以 http:// 或 https:// 開頭", true); return; }
        say("加入中…");
        try { await opts.refs.add(url, title); await redraw(); }
        catch (e) { say("加入失敗：" + ((e && e.message) || e), true); }
    });
    $("ref-new-url").addEventListener("keydown", (e) => {
        if (e.key === "Enter") host.querySelector("#ref-add-btn").click();
    });
    host.querySelectorAll(".ref-del").forEach(btn => btn.addEventListener("click", async () => {
        if (!confirm("從這份提案移除這支參考影片？（片庫本體保留，其他提案不受影響）")) return;
        try { await opts.refs.remove(btn.dataset.rid); await redraw(); }
        catch (e) { say("移除失敗：" + ((e && e.message) || e), true); }
    }));
}

// 自動儲存：停手 800ms 或離開欄位就送（dirty-check 擋沒改過的），同企劃矩陣手感
function _wireInfoEditing(host, opts) {
    const saveEl = $("info-save");
    const timers = new Map();
    let msgTimer = null;
    const parse = (el) => el.dataset.field === "tags"
        ? el.value.split(/[,，]/).map(s => s.trim()).filter(Boolean)
        : el.value;

    // sender(value) 真正打 API；其餘（debounce / dirty-check / 訊息）兩種欄位共用
    const wire = (el, sender) => {
        if (el.readOnly || el.disabled) return;
        el._saved = el.value;
        const save = async () => {
            if (el.value === el._saved) return;
            const want = el.value;
            try {
                await sender(el);
                el._saved = want;
                saveEl.textContent = "已儲存 ✓"; saveEl.classList.remove("err");
                clearTimeout(msgTimer);
                msgTimer = setTimeout(() => { saveEl.textContent = ""; }, 1500);
            } catch (e) {
                saveEl.textContent = "儲存失敗：" + ((e && e.message) || e); saveEl.classList.add("err");
            }
        };
        const queue = () => { clearTimeout(timers.get(el)); timers.set(el, setTimeout(save, 800)); };
        el.addEventListener("input", queue);
        el.addEventListener("change", () => { clearTimeout(timers.get(el)); save(); });   // date/select
        el.addEventListener("blur", () => { clearTimeout(timers.get(el)); save(); });
    };

    host.querySelectorAll(".info-in[data-field]").forEach(el =>
        wire(el, (e) => opts.save(e.dataset.field, parse(e))));
    if (opts.refs) {
        host.querySelectorAll(".ref-in[data-rfield]").forEach(el =>
            wire(el, (e) => opts.refs.patch(e.dataset.rid, e.dataset.rfield, e.value)));
    }
}

function _showSideTabs() {
    const side = $("plan-side");
    side.style.display = "";
    side.querySelectorAll(".side-tab").forEach(btn => btn.addEventListener("click", () => {
        side.querySelectorAll(".side-tab").forEach(b => b.classList.toggle("active", b === btn));
        const showInfo = btn.dataset.ptab === "info";
        $("info-host").style.display = showInfo ? "" : "none";
        // 企劃 host 只藏不拆 — plan-matrix 的共編輪詢靠 isConnected 自停，display:none 不中斷
        $("plan-host").style.display = showInfo ? "none" : "";
    }));
}

function _show(view) {
    for (const v of ["login-view", "noperm-view", "list-view", "plan-view"]) $(v).style.display = (v === view ? "block" : "none");
    $("btn-logout").style.display = (view === "login-view") ? "none" : "";
}
function showLogin(msg) {
    _show("login-view"); $("hdr-user").style.display = "none";
    if (msg) { const e = $("login-err"); e.textContent = msg; e.style.display = "block"; }
    initGoogle();
}
function doLogout() { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem("auth_user"); location.href = location.pathname; }
function onLoginOk(d) { localStorage.setItem(TOKEN_KEY, d.token); $("login-err").style.display = "none"; boot(); }

async function doPwdLogin(ev) {
    ev.preventDefault();
    try {
        const r = await fetch("/api/v1/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: $("in-user").value.trim(), password: $("in-pwd").value }) });
        const d = await r.json();
        if (!r.ok) { showLogin(d.detail || "登入失敗"); return; }
        onLoginOk(d);
    } catch (_) { showLogin("連線失敗，請稍後再試"); }
}

let _gisInited = false;
async function initGoogle() {
    if (_gisInited) return;
    try {
        const r = await fetch("/api/v1/auth/google/config");
        if (!r.ok) return;
        const cfg = await r.json();
        if (!cfg.enabled || !cfg.client_id) return;
        for (let i = 0; i < 40 && (typeof google === "undefined" || !google.accounts); i++)
            await new Promise(res => setTimeout(res, 150));
        if (typeof google === "undefined" || !google.accounts) return;
        google.accounts.id.initialize({
            client_id: cfg.client_id, auto_select: false, cancel_on_tap_outside: true,
            callback: async (resp) => {
                try {
                    const r2 = await fetch("/api/v1/auth/google/login", { method: "POST",
                        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ credential: resp.credential }) });
                    const d = await r2.json();
                    if (!r2.ok) { showLogin(d.detail || "Google 登入失敗"); return; }
                    onLoginOk(d);
                } catch (_) { showLogin("連線失敗，請稍後再試"); }
            },
        });
        google.accounts.id.renderButton($("g_id_signin_container"),
            { theme: "outline", size: "large", width: 320, text: "signin_with", shape: "rectangular", logo_alignment: "left" });
        $("g_id_signin_container").style.display = "flex";
        $("login-divider").style.display = "flex";
        _gisInited = true;
    } catch (e) { console.warn("[GIS] init failed", e); }
}

// ── 清單 ─────────────────────────────────────────────────
async function _loadList() {
    _show("list-view");
    const host = $("list-host");
    try {
        const r = await mfetch("/api/v1/proposals");
        if (!r.ok) throw new Error("HTTP " + r.status);
        const props = (await r.json()).proposals || [];
        if (!props.length) { host.innerHTML = '<div class="state-msg">還沒有提案。先到後台「📑 提案庫」建一筆。</div>'; return; }
        host.innerHTML = props.map(p => `
            <div class="prop-row" data-pid="${escText(p.id)}">
                <span class="t">${escText(p.title)}</span>
                <span class="c">${escText(p.client_name || "")}</span>
                <span class="badge ${p.has_plan ? "on" : "off"}">${p.has_plan ? "企劃中" : "未開始"}</span>
                <span class="st">${escText(p.status || "")}</span>
            </div>`).join("");
        host.querySelectorAll(".prop-row").forEach(row => row.addEventListener("click", () => {
            location.href = location.pathname + "?pid=" + encodeURIComponent(row.dataset.pid);
        }));
    } catch (e) {
        host.innerHTML = '<div class="state-msg" style="color:var(--red);">清單載入失敗：' + escText((e && e.message) || e) + "</div>";
    }
}

// ── 企劃（登入模式） ─────────────────────────────────────
async function _loadPlan(pid) {
    _show("plan-view");
    const host = $("plan-host");
    try {
        const r = await mfetch("/api/v1/proposals/" + encodeURIComponent(pid));
        if (!r.ok) throw new Error(r.status === 404 ? "找不到此提案" : "HTTP " + r.status);
        const prop = (await r.json()).proposal;
        $("plan-title").textContent = prop.title;
        document.title = prop.title + "｜提案企劃｜ORIGINSUN";
        // 登入模式：完整欄位可編（狀態/客戶除外 — 見畫面提示），走既有部分更新 PUT
        const P = "/api/v1/proposals/" + encodeURIComponent(pid);
        const ok = async (r) => {
            if (!r.ok) throw new Error(((await r.json().catch(() => ({}))).detail) || ("HTTP " + r.status));
            return r.json().catch(() => ({}));
        };
        _renderInfo($("info-host"), prop, {
            editable: ["ptype", "pitch_date", "budget_range", "tags", "notes", "outcome_reason"],
            save: async (field, value) => ok(await mfetch(P, { method: "PUT", body: JSON.stringify({ [field]: value }) })),
            reload: async () => (await ok(await mfetch(P))).proposal,
            refPageUrl: (rid) => "/reference.html?id=" + encodeURIComponent(rid),
            refs: {
                add: async (url, title) => {
                    const d = await ok(await mfetch("/api/v1/proposals/references",
                        { method: "POST", body: JSON.stringify({ url, title }) }));
                    return ok(await mfetch(P + "/refs",
                        { method: "POST", body: JSON.stringify({ reference_id: d.reference.id }) }));
                },
                patch: async (rid, field, value) => ok(await mfetch(
                    "/api/v1/proposals/references/" + encodeURIComponent(rid),
                    { method: "PUT", body: JSON.stringify({ [field]: value }) })),
                remove: async (rid) => ok(await mfetch(P + "/refs/" + encodeURIComponent(rid), { method: "DELETE" })),
            },
        });
        _showSideTabs();
        host.innerHTML = "";
        const { renderPlan } = await import("/tabs/proposals/plan-matrix.js");
        renderPlan(host, { proposalId: prop.id, plan: prop.plan || null, canShare: true });
    } catch (e) {
        host.innerHTML = '<div class="state-msg" style="color:var(--red);">企劃載入失敗：' + escText((e && e.message) || e) + "</div>";
    }
}

// ── 企劃（公開共編模式，?t=<token>，免登入） ─────────────
async function _loadSharedPlan(shareTok) {
    _show("plan-view");
    $("btn-logout").style.display = "none";
    $("plan-back").style.display = "none";           // 公開訪客沒有清單可回
    const bar = $("guest-bar");
    bar.style.display = "inline-flex";
    const nameInput = $("guest-name");
    nameInput.value = localStorage.getItem("plan_guest_name") || "";
    nameInput.addEventListener("change", () => localStorage.setItem("plan_guest_name", nameInput.value.trim()));
    const host = $("plan-host");
    const base = "/api/v1/proposals/shared/" + encodeURIComponent(shareTok);
    try {
        const r = await fetch(base);
        if (r.status === 401) { host.innerHTML = '<div class="state-msg">這條共編連結已停用或失效。<br>請向企劃負責人索取新連結。</div>'; return; }
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        $("plan-title").textContent = d.title;
        document.title = d.title + "｜提案企劃（共編）｜ORIGINSUN";
        if (d.info) {   // 舊後端沒有 info → 不顯示側欄（純企劃，行為同從前）
            // 公開共編：只放行描述性欄位（後端 _PUBLIC_INFO_FIELDS 才是真守門）
            const J = { "Content-Type": "application/json" };
            const ok = async (r) => {
                if (!r.ok) throw new Error(((await r.json().catch(() => ({}))).detail) || ("HTTP " + r.status));
                return r.json().catch(() => ({}));
            };
            _renderInfo($("info-host"), d.info, {
                editable: ["ptype", "pitch_date", "tags", "notes"],
                save: async (field, value) => ok(await fetch(base + "/info",
                    { method: "PATCH", headers: J, body: JSON.stringify({ field, value }) })),
                reload: async () => (await ok(await fetch(base))).info,
                // 公開共編：研究頁也走 token（?t=&id=），對方不用登入
                refPageUrl: (rid) => "/reference.html?t=" + encodeURIComponent(shareTok) +
                                     "&id=" + encodeURIComponent(rid),
                refs: {
                    add: async (url, title) => ok(await fetch(base + "/refs",
                        { method: "POST", headers: J, body: JSON.stringify({ url, title }) })),
                    patch: async (rid, field, value) => ok(await fetch(
                        base + "/refs/" + encodeURIComponent(rid),
                        { method: "PATCH", headers: J, body: JSON.stringify({ [field]: value }) })),
                    remove: async (rid) => ok(await fetch(base + "/refs/" + encodeURIComponent(rid),
                        { method: "DELETE" })),
                },
            });
            _showSideTabs();
        }
        host.innerHTML = "";
        const { renderPlan } = await import("/tabs/proposals/plan-matrix.js");
        renderPlan(host, {
            proposalId: "shared", plan: d.plan, canShare: false,
            getGuestName: () => nameInput.value.trim(),
            endpoints: { cell: base + "/cell", meta: base + "/meta" },
            refetch: async () => (await (await fetch(base)).json()).plan,
        });
    } catch (e) {
        host.innerHTML = '<div class="state-msg" style="color:var(--red);">載入失敗：' + escText((e && e.message) || e) + "</div>";
    }
}

async function boot() {
    const shareTok = new URLSearchParams(location.search).get("t");
    if (shareTok) { _loadSharedPlan(shareTok); return; }   // 公開模式：完全不走登入
    if (!localStorage.getItem(TOKEN_KEY)) { showLogin(""); return; }
    let me;
    try {
        const r = await mfetch("/api/v1/auth/me");
        if (r.status === 401) { localStorage.removeItem(TOKEN_KEY); showLogin(""); return; }
        if (!r.ok) { showLogin("載入失敗（" + r.status + "）"); return; }
        me = await r.json();
    } catch (_) { showLogin("連線失敗，請稍後再試"); return; }
    const mods = me.modules || [];
    const isAdmin = (me.access_level || 0) >= 3 || me.role_name === "admin";
    $("hdr-user").textContent = me.username || "";
    $("hdr-user").style.display = "";
    // 模組清單要與 noperm-view 文案一起改（crm_projects 於 2026-08-03 放行 — 提案×專案整合）
    if (!isAdmin && !["preprod_proposals", "preprod_plan", "crm_projects"].some(m => mods.includes(m))) { _show("noperm-view"); return; }
    const pid = new URLSearchParams(location.search).get("pid");
    if (pid) { _loadPlan(pid); } else { _loadList(); }
}

boot();
</script>
