<!doctype html>
<html lang="zh-Hant" class="plan-theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>提案企劃｜ORIGINSUN</title>
<!-- 提案企劃「獨立網址」（docs/PROPOSAL_PLANNER.md §7）：帳號登入 → 提案清單 →
     企劃矩陣（plan-matrix.js 元件，html.plan-theme-light 白底覆寫）。內部工具，
     網址可直接分享給同事共編；閘門模組清單見 boot() 的閘門陣列（與 api_proposals._check_auth 同步）。
     只掛 master / foundry（NAS 官網容器沒有 CRM 後端）。比照 media-log-workspace 家族。 -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --red: #c9372c; --ink: #262626; --sub: #737373; --line: #e5e5e5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif; }
  a { color: inherit; text-decoration: none; }
  .eyebrow { font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--sub); }
  .accent { color: var(--red); }

  header {
    position: sticky; top: 0; z-index: 50; display: flex; align-items: center;
    justify-content: space-between; padding: 14px 24px; background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
  }
  header .brand { display: flex; align-items: center; gap: 12px; }
  header .brand img { height: 30px; width: auto; display: block; }
  header .brand-name { font-size: 13px; letter-spacing: 0.25em; font-weight: 300; }
  header .hdr-right { display: flex; align-items: center; gap: 14px; }
  header .hdr-user { font-size: 12px; color: var(--sub); }
  .btn-ghost { background: none; border: 1px solid var(--line); border-radius: 2px;
    padding: 6px 14px; font-size: 12px; color: var(--sub); cursor: pointer; transition: all .15s; }
  .btn-ghost:hover { color: var(--red); border-color: var(--red); }

  main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }

  /* 登入卡（同 media-log-workspace） */
  .center-wrap { max-width: 380px; margin: 8vh auto 0; }
  .login-card { border: 1px solid var(--line); padding: 40px 36px; }
  .login-card h1 { font-size: 22px; font-weight: 300; letter-spacing: 0.1em; margin: 18px 0 6px; }
  .login-card .sub { font-size: 13px; color: var(--sub); margin-bottom: 28px; line-height: 1.7; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; letter-spacing: 0.15em; color: var(--sub);
    text-transform: uppercase; margin-bottom: 6px; }
  .field input { width: 100%; border: 1px solid var(--line); border-radius: 2px; padding: 10px 12px;
    font-size: 14px; color: var(--ink); outline: none; }
  .field input:focus { border-color: var(--red); }
  .btn-primary { display: block; width: 100%; text-align: center; background: var(--ink); color: #fff;
    border: 0; padding: 12px; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase;
    cursor: pointer; transition: background .15s; }
  .btn-primary:hover { background: var(--red); }
  .err { color: var(--red); font-size: 12px; margin-top: 12px; display: none; }
  .login-divider { display: none; align-items: center; gap: 10px; margin: 20px 0; color: var(--sub); font-size: 11px; }
  .login-divider::before, .login-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  #g_id_signin_container { display: none; justify-content: center; }
  .state-msg { text-align: center; color: var(--sub); font-size: 14px; line-height: 1.9; padding: 40px 12px; }

  /* 提案清單 */
  .list-head { display: flex; align-items: baseline; gap: 14px; margin: 8px 0 18px; }
  .list-head h1 { font-size: 20px; font-weight: 300; letter-spacing: 0.1em; margin: 0; }
  .list-head .hint { font-size: 12px; color: var(--sub); }
  /* 外框在 .prop-item 上：列本身是 <a>，而「專案」鈕是它的兄弟（button 放進
     a 裡是無效 HTML）。兩者並排，框住的是整組。 */
  .prop-item { display: flex; align-items: stretch;
    border: 1px solid var(--line); border-top: none; }
  .prop-item:first-of-type { border-top: 1px solid var(--line); }
  /* 列是 <a>（點一列＝導航），所以要把連結的預設樣式收掉。
     🔴 用 grid 不用 flex：flex 之下標題會吃掉所有剩餘空間，於是每一列右半部
     的起點取決於左邊填了多少 —— 客戶欄長的那列，badge 就被推到別的位置，
     整張清單看起來是歪的。min-width 只擋下限、擋不住撐開。
     固定欄寬之後空欄照樣佔位，逐欄對齊。 */
  .prop-row { flex: 1; min-width: 0;
    display: grid; align-items: center; gap: 14px; padding: 14px 16px;
    grid-template-columns:
        minmax(0, 1fr)   /* 標題 */
        minmax(0, 150px) /* 客戶 */
        70px             /* 類型 */
        86px             /* 提案日 */
        86px             /* 預算 */
        44px             /* 參考片數 */
        64px             /* 企劃中 badge */
        44px             /* 狀態 */
        118px;           /* 進度：階段 chip + 五格條（§14.4 階段四B） */
    cursor: pointer; transition: background .12s; color: inherit; text-decoration: none; }
  /* 進度那格的內容可能比欄寬長（階段名 + 五格）→ 不讓它把 grid 撐開 */
  .prop-row .flow { min-width: 0; overflow: hidden; }
  .prop-row:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
  .prop-row:hover { background: #fafafa; }
  /* 平時像文字，hover 才顯出可按 —— 它同時是「目前接在哪」的顯示 */
  .prop-proj { flex: none; max-width: 150px; background: none; cursor: pointer;
    border: 1px solid transparent; border-radius: 3px; color: var(--sub);
    font: inherit; font-size: 12px; padding: 4px 8px; margin: 8px 8px 8px 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prop-proj:hover { border-color: var(--red); color: var(--red); }
  .prop-proj.none { opacity: .55; }
  /* 列尾刪除：平時很淡，hover 到那一列才明顯 —— 它跟「點一列＝進企劃」共存，
     太顯眼就會變成誤觸來源 */
  .prop-del { flex: none; background: none; border: none; cursor: pointer;
    color: #c4c4c4; font-size: 13px; padding: 0 12px; opacity: 0;
    transition: opacity .12s, color .12s; }
  .prop-item:hover .prop-del, .prop-del:focus-visible { opacity: 1; }
  .prop-del:hover { color: var(--red); }
  /* 欄寬由 grid 決定 —— 這些只管字級與截斷，不要再放 min-width/flex，
     那正是原本歪掉的來源 */
  .prop-row > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prop-row .t { font-size: 14px; }
  .prop-row .c { font-size: 12px; color: var(--sub); }
  .prop-row .badge { font-size: 11px; padding: 2px 10px; border-radius: 2px; white-space: nowrap; }
  .prop-row .badge.on { background: #e6f4ea; color: #147a3d; }
  .prop-row .badge.off { background: #f0f0f0; color: var(--sub); }
  .prop-row .st { font-size: 11px; color: var(--sub); }
  .prop-row .meta { font-size: 11.5px; color: var(--sub); }
  .prop-row .refs { font-size: 11.5px; color: var(--sub); text-align: right; }
  .prop-row .badge { justify-self: start; }

  /* 清單工具列（與後台提案庫同一組篩選，版面各自畫） */
  .list-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 14px; }
  .list-tools input, .list-tools select, .list-tools button {
      font: inherit; font-size: 12.5px; color: var(--ink); background: none;
      border: 1px solid var(--line); border-radius: 2px; padding: 6px 9px; outline: none; }
  .list-tools input:focus, .list-tools select:focus { border-color: var(--red); }
  .list-tools button { cursor: pointer; }
  .list-tools button:hover { color: var(--red); border-color: var(--red); }
  .list-tools .grow { flex: 1; }
  .chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 12px;
          border: 1px solid var(--line); border-radius: 2px; cursor: default; }
  .chip .n { font-size: 15px; font-weight: 300; }
  .chip .l { font-size: 11px; color: var(--sub); letter-spacing: .05em; }
  .chip.rate .n { color: var(--red); }

  /* 企劃視圖 */
  .plan-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; }
  .plan-head h1 { font-size: 18px; font-weight: 400; letter-spacing: 0.05em; margin: 0; flex: 1; }
  .plan-head .back { font-size: 12px; color: var(--sub); cursor: pointer; border: 1px solid var(--line);
    border-radius: 2px; padding: 5px 12px; background: none; }
  .plan-head .back:hover { color: var(--red); border-color: var(--red); }
  /* 標頭的管理動作（只有員工看得到；訪客那條不建出來） */
  .plan-acts { display: none; align-items: center; gap: 8px; }
  .plan-acts select, .plan-acts button { font: inherit; font-size: 12px; color: var(--ink);
      background: none; border: 1px solid var(--line); border-radius: 2px;
      padding: 5px 9px; cursor: pointer; outline: none; }
  .plan-acts select:focus { border-color: var(--red); }
  .plan-acts button:hover { color: var(--red); border-color: var(--red); }
  .plan-acts button.danger:hover { color: #fff; background: var(--red); border-color: var(--red); }

  /* 側邊欄分頁（基本資料／企劃）— 側欄純文字，不放 emoji */
  .plan-body { display: flex; gap: 20px; align-items: flex-start; }
  .plan-side { display: flex; flex-direction: column; gap: 2px; min-width: 112px;
    position: sticky; top: 72px; }
  /* 專案模式的提案切換器（側欄頂端）。刻意長得不像分頁 —— 它切的是「哪一份
     提案」，不是「看哪一頁」，混在分頁列裡會被當成第九個分頁點。 */
  #prop-switch { padding: 0 12px 10px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
  .ps-label { font-size: 10px; letter-spacing: .2em; color: var(--sub); margin-bottom: 4px; }
  #prop-switch-sel { width: 100%; font: inherit; font-size: 12px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 2px; padding: 5px 6px; outline: none; }
  #prop-switch-sel:focus { border-color: var(--red); }
  /* 沒有提案時的側欄 CTA（不隨分頁切換消失） */
  #no-prop-cta { padding: 12px; margin-top: 6px; border-top: 1px solid var(--line); }
  #no-prop-cta button { width: 100%; font: inherit; font-size: 12px; cursor: pointer;
    color: var(--red); background: none; border: 1px solid var(--red);
    border-radius: 2px; padding: 7px 8px; }
  #no-prop-cta button:disabled { opacity: .5; cursor: default; }
  /* 專案模式標頭：專案名為主、階段 chip 在旁 */
  .proj-stage { font-size: 11px; letter-spacing: .1em; color: var(--sub);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .side-tab { text-align: left; background: none; cursor: pointer; color: var(--sub);
    border: none; border-left: 2px solid transparent; padding: 9px 14px; font-size: 13px;
    letter-spacing: 0.05em; transition: all .12s; }
  .side-tab:hover { color: var(--ink); }
  .side-tab.active { color: var(--red); border-left-color: var(--red); background: #fafafa; }
  .plan-main { flex: 1; min-width: 0; }
  @media (max-width: 720px) {
    .plan-body { flex-direction: column; }
    .plan-side { position: static; flex-direction: row; min-width: 0; width: 100%;
      border-bottom: 1px solid var(--line); }
    .side-tab { border-left: none; border-bottom: 2px solid transparent; }
    .side-tab.active { border-bottom-color: var(--red); background: none; }
  }

  /* 基本資料（唯讀）卡片 */
  .info-card { border: 1px solid var(--line); padding: 16px 18px; margin-bottom: 14px; }
  .info-card h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; }
  .info-kv { display: flex; gap: 12px; font-size: 13px; padding: 6px 0;
    border-bottom: 1px dashed var(--line); }
  .info-kv:last-child { border-bottom: none; }
  .info-kv .k { min-width: 84px; color: var(--sub); font-size: 12px; }
  .info-kv .v { flex: 1; min-width: 0; word-break: break-word; }
  .info-kv .v a { color: var(--red); text-decoration: underline; }
  .info-tag { display: inline-block; font-size: 11px; padding: 2px 8px; margin: 0 4px 4px 0;
    background: #f0f0f0; border-radius: 2px; color: var(--sub); }
  .info-ref { padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px;
               display: flex; gap: 10px; align-items: flex-start; }
  .info-ref > .ref-body { flex: 1; min-width: 0; }   /* min-width:0 才讓長網址正常截斷 */
  /* 縮圖：固定 16:9 的小卡。抓不到圖時顯示佔位方塊，**不要**留空 ——
     一排有圖一排沒圖會讓清單看起來像壞掉。 */
  .ref-thumb { flex: none; width: 96px; aspect-ratio: 16/9; border-radius: 3px;
               overflow: hidden; background: #ececec; display: block; }
  .ref-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ref-thumb.ph { display: flex; align-items: center; justify-content: center;
                  color: #b4b4b4; font-size: 18px; }
  @media (max-width: 600px) { .ref-thumb { width: 72px; } }
  .info-ref:last-child { border-bottom: none; }
  .info-ref a { color: var(--red); text-decoration: underline; }
  .info-ref .note { font-size: 12px; color: var(--sub); margin-top: 3px; line-height: 1.6; }
  .info-hint { font-size: 11.5px; color: var(--sub); line-height: 1.7; }
  /* 提案簡報那一格：檔名可能很長（NAS 上的中文命名），不給斷點會把整欄撐開 */
  .deck-name { font-size: 12.5px; color: var(--ink); word-break: break-all; }
  /* 可編控件：平時像文字，focus 才顯出邊框（唯讀感→可編感的漸進揭露） */
  .info-in { width: 100%; font-family: inherit; font-size: 13px; color: var(--ink);
    background: transparent; border: 1px solid transparent; border-radius: 2px;
    padding: 4px 6px; outline: none; }
  .info-in:hover { border-color: var(--line); }
  .info-in:focus { border-color: var(--red); background: #fff; }
  .info-in[readonly] { color: var(--sub); }
  .info-in[readonly]:hover { border-color: transparent; }
  select.info-in { cursor: pointer; }
  .info-ta { min-height: 92px; resize: none; overflow-y: hidden; line-height: 1.8; box-sizing: border-box; }
  .info-save { text-align: right; font-size: 11px; color: var(--sub); min-height: 16px;
    padding: 2px 0; position: sticky; bottom: 0; }
  .info-save.err { color: var(--red); }
  /* 參考影片：每支一列（標題 + 開啟 + 移除 / 備註 / 網址） */
  .info-ref .ref-head { display: flex; gap: 8px; align-items: center; }
  .info-ref .ref-head a { font-size: 12px; color: var(--red); white-space: nowrap; text-decoration: none; }
  .info-ref .ref-head a:hover { text-decoration: underline; }
  .ref-del { background: none; border: 1px solid var(--line); border-radius: 2px; cursor: pointer;
    color: var(--sub); font-size: 11px; padding: 3px 8px; white-space: nowrap; }
  .ref-del:hover { color: var(--red); border-color: var(--red); }
  .ref-url { font-size: 11px; color: var(--sub); padding: 0 6px; word-break: break-all; }
  .ref-add { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--line); }
  .ref-add input { flex: 1; min-width: 150px; border: 1px solid var(--line); border-radius: 2px;
    padding: 6px 8px; font-size: 12.5px; color: var(--ink); outline: none; }
  .ref-add input:focus { border-color: var(--red); }
  .ref-addbtn { background: var(--ink); color: #fff; border: 0; border-radius: 2px; cursor: pointer;
    padding: 6px 14px; font-size: 12px; white-space: nowrap; }
  .ref-addbtn:hover { background: var(--red); }
  .ref-msg { font-size: 11.5px; color: var(--sub); margin-top: 6px; min-height: 14px; }
  .ref-msg.err { color: var(--red); }

  /* ── 手機（≤720px）─────────────────────────────────────
     🔴 這一段最重要的一條是清單列。桌機版的 .c/.st/.meta/.refs 各有固定
     min-width，加總 > 390 螢幕扣掉 padding 後的內容寬 → 整頁被撐出橫向捲動
     （實測 scrollWidth 649）。而版面視窗一被撐大，`position:fixed` 的對話框
     就以 649 置中 → 「資產資料夾」與「新提案」兩個對話框整個偏出畫面右側。
     **同一個根因的兩個症狀**，所以修的是列不是對話框。
     不要改用 overflow-x:hidden 遮起來 —— 那只會讓下次再溢出時沒人發現。 */
  @media (max-width: 720px) {
    header { padding: 12px 14px; }
    main { padding: 18px 14px 48px; }

    /* 標題與說明各佔一行（原本並排會把「提案清單」擠成兩行） */
    .list-head { flex-direction: column; align-items: flex-start; gap: 4px; }

    /* 手機沒有「對齊成表格」這回事：收回 flex 換行，標題一行、其餘跟著排 */
    .prop-row { display: flex; flex-wrap: wrap; gap: 6px 10px; padding: 12px 14px; }
    .prop-row > span { overflow: visible; white-space: normal; }
    .prop-row .t { flex: 1 0 100%; }
    .prop-proj { max-width: 96px; margin: 6px 6px 6px 0; }
    /* 手機沒有 hover —— 淡淡地一直顯示，不然按不到 */
    .prop-del { opacity: .45; padding: 0 10px; }
    .prop-row .c, .prop-row .meta, .prop-row .refs, .prop-row .st { text-align: left; }
    /* 空欄位在換行版面裡只會製造莫名的空隙。桌機靠固定欄寬對齊，
       那邊**不能**跟著藏（藏了整排欄位就對不齊了）。 */
    .prop-row span:empty { display: none; }

    /* 「← 清單 + 標題」一行、管理動作另起一行（原本五件事擠一列，
       標題會被壓成三段） */
    .plan-head { flex-wrap: wrap; gap: 8px 10px; }
    .plan-head h1 { flex: 1 1 auto; min-width: 0; font-size: 17px; }
    .plan-acts, #guest-bar { flex: 1 0 100%; }
    .list-tools #f-q { flex: 1 1 200px; }

    /* ── 手機的通用覆蓋層（只講一般規則，不出現任何元件的 class）──
       1. 表單控件 16px：iOS Safari 對 font-size <16px 的欄位一 focus 就把
          整頁放大 —— 企劃矩陣每點一格畫面就跳一次，那是這頁最傷手感的一項。
       2. 點擊高度 44px（Apple HIG / WCAG 2.5.5）。勾選框另外給尺寸，
          對它套 min-height 只會變成一顆長方形巨無霸。

       🔴 為什麼 font-size 要 !important：元件樣式是 ensureStyle 動態注入的
       （後插進 head），而且選擇器長得像 `.plc .plc-cell textarea`（0-2-1）——
       頁面層的 `textarea` 永遠贏不了。這一塊是**刻意的覆蓋層**，只在
       ≤720px 生效，桌機與後台 SPA 完全碰不到。min-height 則沒有人跟它搶，
       不必 !important。

       斷點刻意用 max-width 而不是 pointer:coarse —— 觸控筆電在桌機寬度下
       應該維持桌機的密度。 */
    input, select, textarea { font-size: 16px !important; }
    button, select, textarea,
    input:not([type="checkbox"]):not([type="radio"]) { min-height: 44px; }
    /* 勾選框給 24×24（WCAG 2.5.8 的最低目標尺寸）。手指要按的空間由**列**
       提供 —— 列的最小高度是元件自己的事，各元件在自己的 ≤720px 區塊裡給。 */
    input[type="checkbox"], input[type="radio"] { width: 24px; height: 24px; }
  }
</style>
</head>
<body>
<header>
  <!-- 登入模式下整塊 brand 可點 → 回提案清單（owner 2026-08-09）。
       訪客（?t=）拿不到清單，所以那條路徑不掛連結，見 _wireBrandHome。 -->
  <div class="brand" id="brand-home">
    <img src="/img/originsun-logo.webp" alt="源日影像" onerror="this.style.display='none'">
    <span class="brand-name">提案企劃 <span class="accent">PLANNER</span></span>
  </div>
  <div class="hdr-right">

<script>
"use strict";
const TOKEN_KEY = "auth_token";
// 提案的列舉（類型/狀態）與小工具。零依賴的常數模組 —— 客戶那條路只為了畫
// 一個「類型」下拉，不該把整條 fetcher 鏈拉下來。動作層（會打端點的那些）
// 只有登入模式才載，見 _loadPlan。
// 存整個 namespace（不是挑幾個常數出來）：使用點散在四個函式裡，一個 `PC.`
// 比四個模組層變數省事，前綴也提醒讀者它是晚一步來的。
// 由需要的入口自己起跑，不是頂層 —— 清單頁與登入畫面都用不到。
let PC = null;
const _propConst = async () => (PC ||= await import("/tabs/proposals/prop-const.js"));
// 清單模組：由 boot() 在確定要進清單時才起跑（見那裡）。
// 🔴 不要放在頂層 —— 頂層語句每次載入都跑，客戶的 ?t= 頁、登入畫面、
// 以及 ?pid= 直接進企劃的路徑都會白下載它整棵相依。
let _listMod = null;
let _planMods = null;   // [prop-actions, plan-matrix]；boot() 走 ?pid= 時預載

/** 提早起跑的動態 import：失敗先接住，避免沒人 await 時變成 unhandled rejection。
 *  真正的錯誤在呼叫端 await 它的時候才丟。 */
function importRetryish(path) {
    const p = import(path);
    p.catch(() => {});
    return p;
}

/** 錯誤訊息（Error 或裸值都吃）。 */
const emsg = (e) => (e && e.message) || e;

/** Response → JSON，非 2xx 就丟。這頁自己的端點有 204（沒 body），所以不能
 *  直接用 prop-fetch 的 tfetch（它無條件 r.json()），而且訪客那條刻意不帶 token。 */
const ok = async (r) => {
    if (!r.ok) throw new Error(((await r.json().catch(() => ({}))).detail) || ("HTTP " + r.status));
    return r.json().catch(() => ({}));
};
const $ = (id) => document.getElementById(id);

// 只有授權標頭。（檔案上傳已全部搬去共用層：簡報走 prop-actions、資產夾走
// uploadItems —— 這支現在只送 JSON。）
function _authHeader() {
    const tok = localStorage.getItem(TOKEN_KEY);
    return tok ? { "Authorization": "Bearer " + tok } : {};
}
async function mfetch(path, opts = {}) {
    const headers = Object.assign({ "Content-Type": "application/json" },
                                  _authHeader(), opts.headers || {});
    return fetch(path, Object.assign({}, opts, { headers }));
}
function escText(s) { const d = document.createElement("div"); d.textContent = String(s ?? ""); return d.innerHTML; }
// 屬性上下文要另外逃逸引號（escText 走 textContent 不處理 "）；連結只放行 http(s)
function escAttr(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
// http(s) 或**站內**相對路徑放行；`//evil.com`（protocol-relative）擋掉。
// 站內路徑要放行的原因：提案簡報的連結是 /uploads/… 或 /api/…/deck，
// 只認 http(s) 的話公開頁的「下載簡報」永遠不顯示。
function safeUrl(u) {
    const s = String(u ?? "");
    return (/^https?:\/\//i.test(s) || /^\/[^/]/.test(s)) ? s : "";
}

// ── 基本資料側欄分頁（可編輯，自動儲存；登入=完整欄位、公開=後端白名單子集） ──

// opts: { save: async(field, value)=>void, editable: string[] }
/** 參考片的小縮圖。`thumb_url` 由後端在片庫收片時就抓好存著（YouTube 直接組
 *  網址、Vimeo 走一次 oEmbed），前端只負責畫 —— 不在這裡重抓，那會讓每次開頁
 *  都對外打好幾支請求，而且客戶那條路是免登入頁。
 *  抓不到圖就畫佔位方塊，讓每一列高度一致。點縮圖＝開原片。 */
function refThumb(r) {
    const inner = r.thumb_url
        ? `<img src="${escAttr(r.thumb_url)}" alt="" loading="lazy"
                 onerror="this.parentElement.classList.add('ph');this.remove();">`
        : "▶";
    const cls = "ref-thumb" + (r.thumb_url ? "" : " ph");
    return r.url
        ? `<a class="${cls}" href="${escAttr(r.url)}" target="_blank" rel="noopener"
              title="開啟原片">${inner}</a>`
        : `<span class="${cls}">${inner}</span>`;
}

// ── 「提案簡報」那一格 ────────────────────────────────────
// 三種狀態（後台提案庫詳情是同一套說法 — 兩個介面分岔過一次）：
//   有 deck                      → 檔名 + 下載 + 更換
//   沒 deck 但「提案資料」有勾選 → 已勾選的檔名 + 一顆「設為提案簡報」
//   都沒有                        → 尚未上傳 + 上傳
//
// 🔴 勾選**不會**自動變成簡報。勾選是內部策展（此刻以這份為準），簡報是
// 要拿去給客戶的那一份 —— 中間那一步必須有人按下去。
//
// 候選從 `deck.pinned()` 拿（資料夾分頁掛好才有；在那之前回空陣列，
// 那時本來也還沒有人勾得了東西）。資料夾**不當候選**：簡報是一個檔。
function _deckCellHtml(info, deck) {
    const base = (p) => String(p || "").split(/[\\/]/).pop();
    const up = deck.upload
        ? `<button id="deck-up" class="ref-addbtn" style="margin-left:8px;"
             >${info.deck_url ? "更換" : "上傳"}</button>
           <input id="deck-file" type="file"${
               deck.exts ? ` accept="${escAttr(deck.exts)}"` : ""} hidden>`
        : "";
    if (info.deck_url) {
        // 登入模式的 deck_url 是 NAS 絕對路徑 → 只顯示檔名（路徑不外露、也沒人要看）。
        // 公開模式拿到的是後端組好的可直連 URL，那條沒有檔名可講 → 只出下載連結。
        const dl = deck.download
            ? '<a href="#" id="deck-dl">下載簡報</a>'
            : (safeUrl(info.deck_url)
                ? `<a href="${escAttr(info.deck_url)}" target="_blank" rel="noopener">下載簡報</a>` : "");
        const name = deck.download
            ? `<span class="deck-name" title="${escAttr(base(info.deck_url))}">${
                escText(base(info.deck_url))}</span> ` : "";
        return name + dl + up;
    }
    const picks = (deck.pinned ? deck.pinned() : []).filter(p => p && !p.is_dir);
    if (picks.length && deck.setFromAsset) {
        const one = picks.length === 1;
        const ctrl = one
            ? `<span class="deck-name">${escText(base(picks[0].rel))}</span>
               <input type="hidden" id="deck-pick" value="${escAttr(picks[0].rel)}">`
            : `<select id="deck-pick" class="info-in" style="width:auto;">${picks.map(p =>
                `<option value="${escAttr(p.rel)}">${escText(base(p.rel))}</option>`).join("")}</select>`;
        return `<span class="info-hint">提案資料已勾選：</span>${ctrl}
            <button id="deck-set" class="ref-addbtn" style="margin-left:8px;"
                title="把這一份設成給客戶看的提案簡報">設為提案簡報</button>${up}`;
    }
    return `<span class="info-hint">尚未上傳</span>${up}`;
}

/** 這一格的三顆動作（下載 / 上傳 / 設為簡報）。host 可以是整個側欄或只有那一格。 */
function _wireDeckCell(host, info, deck) {
    // 簡報落在 NAS 資產夾（非 web root）→ 由呼叫端提供帶權限的下載動作
    host.querySelector("#deck-dl")?.addEventListener("click", (e) => {
        e.preventDefault();
        deck.download();        // openDeck 自己 alert 失敗原因
    });
    const deckFile = host.querySelector("#deck-file");
    host.querySelector("#deck-up")?.addEventListener("click", () => deckFile.click());
    deckFile?.addEventListener("change", () => deck.upload(deckFile.files[0]));
    const setBtn = host.querySelector("#deck-set");
    setBtn?.addEventListener("click", async () => {
        const rel = host.querySelector("#deck-pick")?.value || "";
        if (!rel) return;
        setBtn.disabled = true;
        // 成功會走 refresh（整塊重畫）→ 不必自己還原按鈕；失敗才要放回去
        try { await deck.setFromAsset(rel); }
        catch (e) { alert("設定失敗：" + emsg(e)); setBtn.disabled = false; }
    });
}

/** 只換「提案簡報」那一格。勾選變一下就整塊重畫的話，正在打字的備註/標籤
 *  會被搶走焦點（自動儲存的欄位最不能這樣對待）。 */
function _repaintDeckCell(info, deck) {
    const cell = $("deck-cell");
    if (!cell) return;
    cell.innerHTML = _deckCellHtml(info, deck);
    _wireDeckCell(cell, info, deck);
}

function _renderInfo(host, info, opts) {
    const canEdit = (f) => (opts.editable || []).includes(f);
    const link = (url, label) => safeUrl(url) ? `<a href="${escAttr(url)}" target="_blank" rel="noopener">${escText(label)}</a>` : "";
    // 唯讀列：沒值就整列不畫（畫面不留空殼）
    const ro = (k, v) => v ? `<div class="info-kv"><span class="k">${escText(k)}</span><span class="v">${escText(v)}</span></div>` : "";
    // 可編列：有 data-field 的控件由 _wireInfoEditing 接自動儲存
    const row = (k, ctrl) => `<div class="info-kv"><span class="k">${escText(k)}</span><span class="v">${ctrl}</span></div>`;
    const txt = (f, val, ph) => `<input class="info-in" data-field="${f}" value="${escAttr(val || "")}" placeholder="${escAttr(ph || "")}">`;

    // 清單外的既有值（舊資料/CSV 匯入的自由文字）補成選項，否則 select 會靜默吃掉它
    const ptypeOpts = PC.withCurrent(PC.PTYPES, info.ptype);
    const ptypeCtrl = canEdit("ptype")
        ? row("類型", `<select class="info-in" data-field="ptype"><option value="">（未分類）</option>
            ${ptypeOpts.map(t => `<option value="${escAttr(t)}"${info.ptype === t ? " selected" : ""}>${escText(t)}</option>`).join("")}</select>`)
        : ro("類型", info.ptype);
    const dateCtrl = canEdit("pitch_date")
        ? row("提案日", `<input class="info-in" type="date" data-field="pitch_date" value="${escAttr(info.pitch_date || "")}">`)
        : ro("提案日", info.pitch_date);
    const tagsCtrl = canEdit("tags")
        ? row("標籤", txt("tags", (info.tags || []).join(", "), "逗號分隔，例：政府案, 高雄"))
        : ((info.tags || []).length ? row("標籤", (info.tags || []).map(t => `<span class="info-tag">${escText(t)}</span>`).join("")) : "");
    const budgetCtrl = canEdit("budget_range")
        ? row("預算範圍", txt("budget_range", info.budget_range, "例：80-120 萬"))
        : ro("預算範圍", info.budget_range);
    // 登入頁走 deck.download 帶權限下載；公開頁的 deck_url 後端已給成可直連 URL
    const deck = opts.deck || {};
    const deckCtrl = (info.deck_url || deck.upload)
        ? row("提案簡報", `<span id="deck-cell">${_deckCellHtml(info, deck)}</span>`) : "";

    const reasonCard = canEdit("outcome_reason")
        ? `<div class="info-card"><h4>成案／未成案原因（組織學習）</h4>
             <textarea class="info-in info-ta" data-field="outcome_reason" placeholder="轉成案或未成案時必填"></textarea></div>`
        : (info.outcome_reason ? `<div class="info-card"><h4>成案／未成案原因</h4><div class="info-hint">${escText(info.outcome_reason)}</div></div>` : "");

    host.innerHTML = `
        <div class="info-card">
            <h4>基本資訊</h4>
            ${ro("狀態", info.status)}
            ${ro("客戶", info.client_name)}
            ${ptypeCtrl}
            ${dateCtrl}
            ${budgetCtrl}
            ${tagsCtrl}
            ${deckCtrl}
        </div>
        ${reasonCard}
        ${opts.survey ? `<div class="info-card">
            <h4>現況盤點</h4>
            <div id="survey-host"></div>
        </div>` : ""}
        <div class="info-card">
            <h4>備註</h4>
            <textarea class="info-in info-ta" data-field="notes"
                placeholder="這份提案的補充說明、客戶偏好、內部提醒…（會自動儲存）"${canEdit("notes") ? "" : " readonly"}></textarea>
        </div>
        <div class="info-hint">${escText(opts.hint || "欄位改完會自動儲存。")}</div>
        <div class="info-save" id="info-save"></div>`;

    // textarea 值走 DOM property（不進模板字串 — XSS 防線）
    host.querySelector('[data-field="notes"]').value = info.notes || "";
    const rt = host.querySelector('[data-field="outcome_reason"]');
    if (rt) rt.value = info.outcome_reason || "";
    host.querySelectorAll("textarea.info-ta").forEach(ta => {
        _infoGrow(ta);
        ta.addEventListener("input", () => _infoGrow(ta));   // 內容多長格子就多長
    });
    _wireDeckCell(host, info, deck);
    _mountSurvey(host, info, opts);
    _wireInfoEditing(host, opts);
}

/** 參考影片 —— 自成一個側欄分頁（2026-08-14 owner：從基本資料底部搬出來）。
 *
 * 與 _renderInfo 拆開而不是共用一個 host：兩者的重畫時機不同（加/移除參考片
 * 只該重畫這一塊，不該把使用者正在打的備註 textarea 一起洗掉）。
 * 唯讀分支（訪客沒有 opts.refs）照畫清單，只是沒有加入/移除控件。
 */
function _renderRefs(host, info, opts) {
    const link = (url, label) => safeUrl(url) ? `<a href="${escAttr(url)}" target="_blank" rel="noopener">${escText(label)}</a>` : "";
    const canRefs = !!opts.refs;
    const refs = (info.references || []).map(r => canRefs ? `
        <div class="info-ref" data-rid="${escAttr(r.id)}">
            ${refThumb(r)}
            <div class="ref-body">
            <div class="ref-head">
                <input class="info-in ref-in" data-rfield="title" data-rid="${escAttr(r.id)}"
                       placeholder="標題（例：參考打光）">
                <a href="${escAttr(opts.refPageUrl ? opts.refPageUrl(r.id) : "#")}" target="_blank"
                   rel="noopener" title="打開這支片的研究頁面">研究頁 ↗</a>
                ${link(r.url, "影片 ↗")}
                <button class="ref-del" data-rid="${escAttr(r.id)}" title="從本提案移除">移除</button>
            </div>
            <input class="info-in ref-in" data-rfield="note" data-rid="${escAttr(r.id)}"
                   placeholder="備註：這支要參考什麼？">
            <div class="ref-url">${escText(r.url)}</div>
            </div>
        </div>` : `
        <div class="info-ref">
            ${refThumb(r)}
            <div class="ref-body">${link(r.url, r.title || r.url) || escText(r.title || r.url)}
                ${r.note ? `<div class="note">${escText(r.note)}</div>` : ""}
            </div>
        </div>`).join("");
    const refAdd = canRefs ? `
        <div class="ref-add">
            <input id="ref-new-url" placeholder="https://…（YouTube / Vimeo / 雲端連結）">
            <input id="ref-new-title" placeholder="標題（可空）">
            <button id="ref-add-btn" class="ref-addbtn">＋ 加入</button>
        </div>
        ${/* 從共用片庫挑一支已經研究過的（跟後台提案庫同一個名錄） */
          opts.refs.library ? `<div class="ref-add">
            <select id="ref-pick"><option value="">從片庫挑一支已收錄的…</option></select>
            <button id="ref-link-btn" class="ref-addbtn">掛上</button>
        </div>` : ""}
        <div class="ref-msg" id="ref-msg"></div>` : "";

    host.innerHTML = `
        <div class="info-card">
            <h4>參考影片（${(info.references || []).length}）</h4>
            ${refs || '<div class="info-hint">尚未加參考影片</div>'}
            ${refAdd}
        </div>`;

    if (!canRefs) return;
    // 參考片欄位值走 DOM property（不進模板字串 — XSS 防線）
    const byId = {};
    (info.references || []).forEach(r => { byId[r.id] = r; });
    host.querySelectorAll(".ref-in[data-rfield]").forEach(el => {
        el.value = (byId[el.dataset.rid] || {})[el.dataset.rfield] || "";
    });
    _wireRefs(host, info, opts);
    // 標題/備註的自動儲存也要接 —— 這些欄位跟著搬過來了，留在 _renderInfo
    // 那邊接的話會找不到任何 .ref-in（改了字靜默不存）。
    _wireInfoEditing(host, opts);
}

/** 片庫挑選：選項晚一步填（要打一次 API），拿不到（或全都掛過了）就把整列
 *  收掉 —— 不留一個選不出東西的死控件。 */
function _wireRefPicker(host, info, opts, redraw, say) {
    const sel = host.querySelector("#ref-pick");
    if (!sel) return;
    // 選項**點開才抓**：整個片庫是一支不小的請求，而「從片庫挑一支」是低頻動作
    // ——渲染時就抓會跟企劃矩陣搶連線槽。順帶讓看到的片庫是點開當下的，不是
    // 開頁當下的（別人剛入庫的片，開著不動也挑得到）。
    let filled = false;
    const fill = async () => {
        if (filled) return;
        filled = true;
        const lib = PC.pickableRefs(info.references, await opts.refs.library());
        if (!sel.isConnected) return;
        if (!lib.length) { sel.closest(".ref-add")?.remove(); return; }
        for (const r of lib) {
            const o = document.createElement("option");
            o.value = r.id;
            o.textContent = r.title || r.url;   // 片名不進模板字串
            sel.appendChild(o);
        }
    };
    sel.addEventListener("mousedown", () => fill().catch(e => say("片庫載入失敗：" + emsg(e), true)));
    sel.addEventListener("focus", () => fill().catch(() => {}));
    host.querySelector("#ref-link-btn").addEventListener("click", async () => {
        if (!sel.value) return;
        say("掛上中…");
        try { await opts.refs.link(sel.value); await redraw(); }
        catch (e) { say("掛上失敗：" + emsg(e), true); }
    });
}

function _infoGrow(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

// 現況盤點表 — 與後台提案詳情共用元件；opts.survey 給端點。
// 客戶看不到哪些欄目由後端決定（public 路徑直接不回預算那列），這裡照畫。
async function _mountSurvey(host, info, opts) {
    const mount = host.querySelector("#survey-host");
    if (!mount) return;                    // 沒給 opts.survey 時模板就不會畫這一塊
    try {
        const { importRetry } = await import("/js/shared/utils.js");
        // opts.survey 本身就是 {save, addRow?, removeRow?, hint?} —— 直接攤開，
        // 不要在這裡重述一次 renderSurveyTable 的預設值（會各自漂移）
        const { renderSurveyTable } = await importRetry("/tabs/proposals/survey-table.js");
        if (!mount.isConnected) return;
        renderSurveyTable(mount, { rows: info.survey || [], ...opts.survey });
    } catch (e) {
        mount.innerHTML = '<div class="info-hint">盤點表載入失敗：' + escText(emsg(e)) + "</div>";

// 參考影片：加入 / 移除（動列表→重畫整塊）＋標題備註自動儲存（不重畫，免搶焦點）
function _wireRefs(host, info, opts) {
    const msg = $("ref-msg");
    const say = (t, err) => { msg.textContent = t; msg.classList.toggle("err", !!err); };
    // 寫回 info 本身而不是拿 fresh 另外畫 —— 這頁只該有一份「目前的提案」。
    // 兩份的話：加一支參考片（畫面出現）→ 按編輯存檔 → 用的是舊的 references，
    // 剛加的那支從畫面消失。
    const redraw = async () => {
        Object.assign(info, await opts.reload());
        _renderRefs(host, info, opts);     // 只重畫這一塊 —— 基本資料那邊使用者
    };                                      // 可能正在打字，不該被洗掉

    host.querySelector("#ref-add-btn").addEventListener("click", async () => {
        const url = $("ref-new-url").value.trim();
        const title = $("ref-new-title").value.trim();
        if (!/^https?:\/\//i.test(url)) { say("網址要以 http:// 或 https:// 開頭", true); return; }
        say("加入中…");
        try { await opts.refs.add(url, title); await redraw(); }
        catch (e) { say("加入失敗：" + emsg(e), true); }
    });
    $("ref-new-url").addEventListener("keydown", (e) => {
        if (e.key === "Enter") host.querySelector("#ref-add-btn").click();
    });
    host.querySelectorAll(".ref-del").forEach(btn => btn.addEventListener("click", async () => {
        if (!confirm("從這份提案移除這支參考影片？（片庫本體保留，其他提案不受影響）")) return;
        try { await opts.refs.remove(btn.dataset.rid); await redraw(); }
        catch (e) { say("移除失敗：" + emsg(e), true); }
    }));
    // 從共用片庫挑一支（有給 library 才長出來）—— 與加/移除共用同一套重畫與訊息
    _wireRefPicker(host, info, opts, redraw, say);   // 同步：選項點開才抓
}

// 自動儲存：停手 800ms 或離開欄位就送（dirty-check 擋沒改過的），同企劃矩陣手感。
// 兩種欄位共用：基本資料的 .info-in[data-field]（在 info-host）與參考影片的
// .ref-in[data-rfield]（2026-08-14 搬到 refs-host）—— 所以 host 由呼叫端給，
// 不能寫死成 info-host。「已儲存 ✓」共用側欄底部那一格。
function _wireInfoEditing(host, opts) {
    const saveEl = $("info-save");
    const timers = new Map();
    let msgTimer = null;
    const parse = (el) => el.dataset.field === "tags"
        ? el.value.split(/[,，]/).map(s => s.trim()).filter(Boolean)
        : el.value;

    // sender(value) 真正打 API；其餘（debounce / dirty-check / 訊息）兩種欄位共用
    const wire = (el, sender) => {
        if (el.readOnly || el.disabled) return;
        el._saved = el.value;
        const save = async () => {
            if (el.value === el._saved) return;
            const want = el.value;
            try {
                await sender(el);
                el._saved = want;
                saveEl.textContent = "已儲存 ✓"; saveEl.classList.remove("err");
                clearTimeout(msgTimer);
                msgTimer = setTimeout(() => { saveEl.textContent = ""; }, 1500);
            } catch (e) {
                saveEl.textContent = "儲存失敗：" + emsg(e); saveEl.classList.add("err");
            }
        };
        const queue = () => { clearTimeout(timers.get(el)); timers.set(el, setTimeout(save, 800)); };
        el.addEventListener("input", queue);
        el.addEventListener("change", () => { clearTimeout(timers.get(el)); save(); });   // date/select
        el.addEventListener("blur", () => { clearTimeout(timers.get(el)); save(); });
    };

    host.querySelectorAll(".info-in[data-field]").forEach(el =>
        wire(el, (e) => opts.save(e.dataset.field, parse(e))));
    if (opts.refs) {
        host.querySelectorAll(".ref-in[data-rfield]").forEach(el =>
            wire(el, (e) => opts.refs.patch(e.dataset.rid, e.dataset.rfield, e.value)));
    }
}


/** 切到某個分頁（點擊與「開頁時預設哪一頁」共用同一條路 —— 分開寫的話
 *  預設頁會漏掉 _mountLazy，畫面停在空白容器上）。 */
function _activateTab(name) {
    const side = $("plan-side");
    side.querySelectorAll(".side-tab").forEach(b => {
        const on = (b.dataset.ptab === name);
        b.classList.toggle("active", on);
        // 容器 id 就是 `{data-ptab}-host` —— 慣例寫在 markup 裡，不另外維護一張表。
        // 都是「只藏不拆」：plan-matrix 的共編輪詢靠 isConnected 自停，拆 DOM 會中斷它
        $(b.dataset.ptab + "-host").style.display = on ? "" : "none";
    });
    if (name === "folder") _mountFolder();
    else _mountLazy(name);
}

function _showSideTabs() {
    const side = $("plan-side");
    side.style.display = "";
    side.querySelectorAll(".side-tab").forEach(btn =>
        btn.addEventListener("click", () => _activateTab(btn.dataset.ptab)));
}

// ── 懶載入分頁（企劃書／報價單 —— 只有員工登入才有：企劃書是內部產出、
// 報價單金額敏感，客戶那條連分頁鈕都不建出來）────────────────
// 一張表一個真相：容器沿用 `{ptab}-host` 慣例，錯誤處理與重試只寫一份。
// 一次性槽（_pending[name]）同 _pendingFolder 的形狀：掛好了設回 null，
// 沒掛成留著讓人切回來重試。folder 不進這張表 —— 它是雙槽 + 平行 import
// 的特規（見 _mountFolder），硬塞通用形狀只會兩邊都難讀。
const _LAZY_TABS = {
    brief: { mod: "/tabs/proposals/brief-view.js", fn: "renderBriefs", label: "企劃書" },
    quote: { mod: "/tabs/proposals/quote-view.js", fn: "renderQuotes", label: "報價單" },
    meeting: { mod: "/tabs/proposals/meeting-view.js", fn: "renderMeetings", label: "會議記錄" },
    flow: { mod: "/tabs/proposals/flow-view.js", fn: "renderFlow", label: "進度" },
};
const _pending = {};

function _setupLazyTab(name, opts) {
    _pending[name] = opts;
    $("tab-" + name).style.display = "";
}

async function _mountLazy(name) {
    const t = _LAZY_TABS[name];
    if (!t || !_pending[name]) return;
    try {
        const { importRetry } = await import("/js/shared/utils.js");
        const mod = await importRetry(t.mod);
        await mod[t.fn]($(name + "-host"), _pending[name]);
        _pending[name] = null;             // 掛好了；之後切回來保留狀態
    } catch (e) {
        $(name + "-host").innerHTML =      // 設定留著，切回來能重試
            `<div class="state-msg" style="color:var(--red);">${t.label}分頁載入失敗：`
            + escText(emsg(e)) + "</div>";
    }
}

// ── 資料夾分頁 ────────────────────────────────────────────
// 範圍由**端點**決定，不是前端旗標：
//   登入 → 整個資產夾（CRM 端點）／訪客 → 只有「對外分享」子夾（token 端點）
// 兩者共用 folder-view.js 的渲染。
// 檔案列與卡片列是**兩個各自獨立的一次性槽**：掛好了就把自己那格設回 null，
// 沒掛成就留著讓使用者切回來重試。「槽是不是 null」就是「掛了沒」——
// 不用另一顆布林去跟它同步（第一輪拿掉 _pinState 是同一條理由）。
// 分兩格而不是一包 opts：pins 絕對不能流進 folder-view，靠邊界手動剝掉遲早會漏。
//
// ⚠️ 兩個都是模組層變數，靠「換提案＝整頁重載」歸零。哪天「← 清單」改成前端
// 切換，它們要跟著提案的生命週期重置，否則第二個提案會靜默不掛。
let _pendingFolder = null;   // folder-view 的設定
let _pendingPins = null;     // pins-store 那顆（訪客沒有）

function _setupFolderTab(folder, pins) {
    _pendingFolder = folder;
    _pendingPins = pins || null;
    $("tab-folder").style.display = "";
}

/** 重點提案卡片列（訪客沒有，客戶不能策展也不能授權）。
 *  nav = folder-view 的把手：勾起來的**資料夾**點下去要走進去，不是下載
 *  （對資料夾打下載端點是死路）。 */
async function _mountPins(pins, nav, onFile) {
    const { renderPins } = await import("/tabs/proposals/pins-panel.js");
    const host = $("pins-host");
    pins.watch(() => renderPins(host, {      // watch = 訂閱 + 立刻畫一次
        state: pins.get(),
        setPublic: pins.setPublic,
        onOpen: (p) => (p.is_dir ? nav.go(p.rel) : onFile(p)),
    }));
}

async function _mountFolder() {
    if (!_pendingFolder && !_pendingPins) return;
    // 兩個模組同時起跑：序列等待會讓檔案列等卡片列的模組載完，而檔案列一
    // render 就要去掃 NAS，那才是使用者在等的東西。
    // 🔴 pins 那顆要先接住 rejection —— folder-view 掛掉時下面根本不會去 await
    // 它，沒人接的 rejected promise 就是一條 unhandled rejection。
    const fvMod = import("/tabs/proposals/folder-view.js");
    if (_pendingPins) import("/tabs/proposals/pins-panel.js").catch(() => {});

    const folder = _pendingFolder;
    let nav = null;
    if (folder) {
        try {
            const { renderFolderView } = await fvMod;
            nav = renderFolderView($("folder-fv"),
                                   Object.assign({ rootLabel: "資料夾" }, folder));
            _pendingFolder = null;             // 掛好了；之後切回來保留瀏覽位置
        } catch (e) {
            $("folder-fv").innerHTML =         // 設定留著，切回來能重試
                '<div class="state-msg" style="color:var(--red);">資料夾元件載入失敗：'
                + escText(emsg(e)) + "</div>";
        }
    }
    // 卡片列是附屬品（它壞掉不該讓人連檔案都瀏覽不了），而且要用 folder-view
    // 的把手，所以等檔案列掛好才掛。失敗就把槽放回去 —— 切回來會再試一次。
    if (_pendingPins && nav) {
        const pins = _pendingPins;
        _pendingPins = null;
        try { await _mountPins(pins, nav, folder.onFile); }
        catch (e) { _pendingPins = pins; console.warn("[pins] 卡片列載入失敗", e); }
    }
}

function _show(view) {
    for (const v of ["login-view", "noperm-view", "list-view", "plan-view"]) $(v).style.display = (v === view ? "block" : "none");
    $("btn-logout").style.display = (view === "login-view") ? "none" : "";
}
function showLogin(msg) {
    _show("login-view"); $("hdr-user").style.display = "none";
    if (msg) { const e = $("login-err"); e.textContent = msg; e.style.display = "block"; }
    initGoogle();
}
function doLogout() { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem("auth_user"); location.href = location.pathname; }
function onLoginOk(d) { localStorage.setItem(TOKEN_KEY, d.token); $("login-err").style.display = "none"; boot(); }

async function doPwdLogin(ev) {
    ev.preventDefault();
    try {
        const r = await fetch("/api/v1/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: $("in-user").value.trim(), password: $("in-pwd").value }) });
        const d = await r.json();
        if (!r.ok) { showLogin(d.detail || "登入失敗"); return; }
        onLoginOk(d);
    } catch (_) { showLogin("連線失敗，請稍後再試"); }
}

let _gisInited = false;
async function initGoogle() {
    if (_gisInited) return;
    try {
        const r = await fetch("/api/v1/auth/google/config");
        if (!r.ok) return;
        const cfg = await r.json();
        if (!cfg.enabled || !cfg.client_id) return;
        for (let i = 0; i < 40 && (typeof google === "undefined" || !google.accounts); i++)
            await new Promise(res => setTimeout(res, 150));
        if (typeof google === "undefined" || !google.accounts) return;
        google.accounts.id.initialize({
            client_id: cfg.client_id, auto_select: false, cancel_on_tap_outside: true,
            callback: async (resp) => {
                try {
                    const r2 = await fetch("/api/v1/auth/google/login", { method: "POST",
                        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ credential: resp.credential }) });
                    const d = await r2.json();
                    if (!r2.ok) { showLogin(d.detail || "Google 登入失敗"); return; }
                    onLoginOk(d);
                } catch (_) { showLogin("連線失敗，請稍後再試"); }
            },
        });
        google.accounts.id.renderButton($("g_id_signin_container"),
            { theme: "outline", size: "large", width: 320, text: "signin_with", shape: "rectangular", logo_alignment: "left" });
        $("g_id_signin_container").style.display = "flex";
        $("login-divider").style.display = "flex";
        _gisInited = true;
    } catch (e) { console.warn("[GIS] init failed", e); }
}

// ── 清單 ─────────────────────────────────────────────────
// 查詢/排序/統計走 prop-list.js（與後台提案庫同一份）—— 版面各自畫，但
// 「篩什麼、怎麼排、成案率怎麼算」不會兩邊漂。
// 模組層只留「DOM 裡看不到的東西」：模組 handle、伺服器資料，以及那批資料
// 的出處（_rowsFiltered）。篩選與排序的當前值就是控件的 value，再存一份
// 只會有兩個真相。
let PL = null;                         // prop-list 模組
let _readFilters = null;               // wireFilters 回的讀取器
let _rows = [];                        // 目前這批（排序重畫不重打 API）
let _rowsFiltered = false;             // 這批是不是篩過的（決定空狀態要說什麼）

/** 清單載入/查詢失敗的訊息（兩個 catch 共用一份字串）。 */
const _listErr = (e) => '<div class="state-msg" style="color:var(--red);">清單載入失敗：'
    + escText(emsg(e)) + "</div>";

async function _loadList() {
    _show("list-view");
    try {
        // 常數與清單邏輯同時起跑（工具列的下拉要 STATUSES / PTYPES / SORT_COLUMNS）
        // 自足：不倚賴 boot() 有沒有先起跑（那是兩個地方讀同一個 query 的隱形耦合）
        _listMod ||= importRetryish("/tabs/proposals/prop-list.js");
        const [pc, pl] = await Promise.all([_propConst(), _listMod]);
        // 接線成功了才認 PL —— 中途丟例外的話，重試要能從頭再來一次
        _wireListTools(pc, pl);
        PL = pl;
        $("list-tools").style.display = "flex";
        // 統計只在進清單時抓一次 —— 後端 /stats 不吃 filters，每次篩選重打
        // 是拿一模一樣的數字做一次全表掃描
        PL.paintStats($("chip-total"), $("chip-rate"));
        await _refreshList();
    } catch (e) {
        $("list-host").innerHTML = _listErr(e);
    }
}

function _wireListTools(pc, PL) {
    const opt = (v, label) => `<option value="${escAttr(v)}">${escText(label ?? v)}</option>`;
    $("f-status").insertAdjacentHTML("beforeend", pc.STATUSES.map(v => opt(v)).join(""));
    $("f-ptype").insertAdjacentHTML("beforeend", pc.PTYPES.map(v => opt(v)).join(""));
    // 可排序的欄位跟後台的表頭同一份清單
    $("f-sort").insertAdjacentHTML("beforeend",
        PL.SORT_COLUMNS.map(c => opt(c.key, c.label)).join(""));
    _readFilters = PL.wireFilters(
        { q: $("f-q"), status: $("f-status"), ptype: $("f-ptype"), year: $("f-year") },
        () => _refreshList());
    // 排序是純前端（後端不排）→ 只重畫，不重打 API。方向存在按鈕的 dataset 上，
    // 不另外存一份 —— 箭頭與方向是同一件事。
    // 沒選排序欄時方向鈕按了不會有反應（sortRows 直接 early-return）→ 停用它，
    // 不要讓人以為壞了
    const syncDirBtn = () => { $("f-dir").disabled = !$("f-sort").value; };
    syncDirBtn();
    $("f-sort").addEventListener("change", () => { syncDirBtn(); _paintList(); });
    $("f-dir").addEventListener("click", () => {
        const asc = $("f-dir").dataset.dir !== "desc";
        $("f-dir").dataset.dir = asc ? "desc" : "asc";
        $("f-dir").textContent = asc ? "↓" : "↑";
        _paintList();
    });
    $("btn-folders").addEventListener("click", async () => {
        try {
            // 平行下載：序列的話 prop-dialog 要等 proposal-folders 連同它整棵
            // 靜態相依解析完才開始抓，而這是按下按鈕之後才發生的等待
            const [{ openFolderBrowser }, { openDialog }] = await Promise.all([
                import("/tabs/proposals/proposal-folders.js"),
                import("/tabs/proposals/prop-dialog.js"),
            ]);
            // 元件只畫內容、外殼由這裡給 —— 後台給的是深色 overlay，這裡給官網風對話框
            openFolderBrowser((inner) => openDialog({
                title: "提案資產資料夾", width: 900, body: inner,
            }).el);
        } catch (e) { alert("資產資料夾載入失敗：" + emsg(e)); }
    });
    $("btn-tpls").addEventListener("click", async () => {
        try {
            // 同 btn-folders：平行下載，元件只畫內容、外殼由這裡給官網風對話框
            const [{ openTemplateLibrary }, { openDialog }] = await Promise.all([
                import("/tabs/proposals/brief-templates.js"),
                import("/tabs/proposals/prop-dialog.js"),
            ]);
            openTemplateLibrary((inner) => openDialog({
                title: "企劃範本庫", width: 900, body: inner,
            }).el);
        } catch (e) { alert("範本庫載入失敗：" + emsg(e)); }
    });
    $("btn-new").addEventListener("click", async () => {
        const { openProposalEditor } = await import("/tabs/proposals/prop-editor.js");
        // 建好直接進那筆的企劃 —— 新增提案的下一步一定是開始企劃
        openProposalEditor({ onSaved: (p) => {
            location.href = location.pathname + "?pid=" + encodeURIComponent(p.id);
        } });
    });
}

async function _refreshList() {
    try {
        const filters = _readFilters();
        _rows = await PL.fetchProposals(filters);
        // 記「這批的出處」而不是重讀控件 —— 打字到 debounce 觸發之間，控件已經
        // 有值但 _rows 還是舊的那批，重讀會說出不符實情的空狀態
        _rowsFiltered = PL.hasFilters(filters);
        if (!_rowsFiltered) PL.fillYearSelect($("f-year"), _rows);
        _paintList();
        _paintFlow();          // 附加資訊，不 await（同後台提案庫）
    } catch (e) {
        $("list-host").innerHTML = _listErr(e);
    }
}

function _paintList() {
    const host = $("list-host");
    if (!_rows.length) {
        host.innerHTML = _rowsFiltered
            ? '<div class="state-msg">沒有符合條件的提案。</div>'
            : '<div class="state-msg">還沒有提案 — 按「＋ 新提案」建立第一筆。</div>';
        return;
    }
    // 列是 `<a href>` 不是 div+click：點一列的語意就是導航。中鍵/Ctrl 開新分頁、
    // 右鍵複製連結、Tab 可達、螢幕閱讀器讀得出是連結 —— 而且不用綁 N 個監聽。
    // 「專案」鈕是 <a> 的**兄弟**不是子孫：button 放進 a 裡是無效 HTML，
    // 鍵盤與朗讀器的行為也會壞掉。外面包一層 .prop-item 讓兩者並排。
    const dir = $("f-dir").dataset.dir === "desc" ? "desc" : "asc";
    host.innerHTML = PL.sortProposals(_rows, $("f-sort").value, dir).map(p => `
        <div class="prop-item">
        <a class="prop-row" href="?pid=${encodeURIComponent(p.id)}">
            <span class="t">${escText(p.title)}</span>
            <span class="c">${escText(p.client_name || "")}</span>
            <span class="meta">${escText(p.ptype || "")}</span>
            <span class="meta">${escText(p.pitch_date || "")}</span>
            <span class="meta">${escText(p.budget_range || "")}</span>
            <span class="refs">${p.refs_count ? "🎞 " + p.refs_count : ""}</span>
            <span class="badge ${p.has_plan ? "on" : "off"}">${p.has_plan ? "發想中" : "未開始"}</span>
            <span class="st">${escText(p.status || "")}</span>
            <span class="flow" data-flow="${escAttr(p.project_id || "")}"></span>
        </a>
        <button class="prop-proj${p.project_id ? "" : " none"}" data-proj="${escAttr(p.id)}"
                title="${escAttr(p.project_id
                    ? "目前：" + (p.project_name || p.project_id) + "　（點一下換綁或解除）"
                    : "把這個提案掛到某個既有專案")}"
        >${escText(PC.projectLabel(p))}</button>
        <button class="prop-del" data-del="${escAttr(p.id)}"
                title="刪除這個提案（參考片掛載會解除，片庫保留）">✕</button>
        </div>`).join("");
    host.querySelectorAll("[data-proj]").forEach(el => {
        el.addEventListener("click", async () => {
            const p = _rows.find(x => x.id === el.dataset.proj);
            if (!p) return;
            const { openProjectLinker } = await import("/tabs/proposals/prop-actions.js");
            openProjectLinker(p, { onSaved: () => _refreshList() });
        });
    });
    // 刪除的規則（確認文案、要不要真的送）走共用的 removeProposal —— 後台
    // 提案庫用的是同一支，兩邊不會一邊問一邊不問
    host.querySelectorAll("[data-del]").forEach(el => {
        el.addEventListener("click", async () => {
            const p = _rows.find(x => x.id === el.dataset.del);
            if (!p) return;
            try {
                const PA = await import("/tabs/proposals/prop-actions.js");
                if (await PA.removeProposal(p)) _refreshList();
            } catch (e) { alert("刪除失敗：" + emsg(e)); }
        });
    });
    PL.fillFlowCells($("list-host"));   // 列的樣板留空格
}

// ── 進度欄（§14.4 階段四B）──────────────────────────────
/**
 * 🔴 摘要到了要**整份重畫**，不能只補格子：「進度」是可排序欄，而它的值在
 * 這一刻才存在。只補格子的話，選了進度排序的人看到的順序永遠是後端順序。
 */
async function _paintFlow() {
    if (await PL.loadFlowSummary(_rows.map(p => p.project_id))) _paintList();
}

/**
 * 標頭的管理動作（登入模式限定）：狀態管線 / 編輯 / 刪除。
 *
 * 規則本體在 prop-actions.js —— 後台提案庫用的是同一支，所以「成案要不要建
 * 專案」「未成案原因必填」不會兩邊分岔。
 *
 * **狀態變更**整頁重載：成案會建立或推進 CRM 專案（project_id 可能從無到有），
 * 側欄與資料夾分頁的掛載都要重跑，那才是會出錯的地方。
 * **編輯與簡報上傳**走 refresh 局部重畫（重抓一次提案再畫側欄）。
 */
function _wireHeaderActions(prop, PA, refresh) {
    $("plan-acts").style.display = "flex";
    const sel = $("plan-status");
    sel.innerHTML = PC.withCurrent(PC.STATUSES, prop.status).map(x =>
        `<option value="${escAttr(x)}"${x === prop.status ? " selected" : ""}>${escText(x)}</option>`).join("");
    sel.addEventListener("change", async () => {
        try {
            const r = await PA.changeStatus(prop, sel.value);
            if (!r.ok) { sel.value = prop.status; return; }   // 取消或沒過守門
            if (r.message) alert(r.message);
            location.reload();
        } catch (e) {
            alert("狀態更新失敗：" + emsg(e));
            sel.value = prop.status;
        }
    });
    $("plan-edit").addEventListener("click", async () => {
        const { openProposalEditor } = await import("/tabs/proposals/prop-editor.js");
        // 🔴 開表單前先重抓：側欄那六個欄位是自動儲存的，本地的 prop 可能已經
        // 過期。拿過期的值填進表單，按儲存就是把伺服器上的新值蓋回舊的。
        try { await refresh(); } catch (_) { /* 抓不到就用手上這份 */ }
        openProposalEditor({ proposal: prop, onSaved: refresh });
    });
    $("plan-del").addEventListener("click", async () => {
        try {
            if (await PA.removeProposal(prop)) location.href = location.pathname;
        } catch (e) { alert("刪除失敗：" + emsg(e)); }
    });
}

// ── 專案模式（?id=<專案id>）─────────────────────────────
//
// 這一頁本來就在管專案（進度五軌、資料夾、報價、會議都掛在專案上），只有
// 入口還在講提案。專案模式把主鍵換過來：以專案開頁，提案變成它底下的東西。
//
// 🔴 **一個專案可以有 N 筆提案**（同一案提三個 concept；`wins_proposal` 的
// 「恰好一筆才自動標成案」就是為此），也可以**一筆都沒有**（直接在 CRM 建的
// 專案）。所以這裡不能假設「專案 ↔ 提案」是一對一。
//
// 提案範疇的分頁（創意發想/企劃書/報價單/會議記錄/基本資料/參考影片）跟著
// 側欄頂端的切換器走；專案範疇的（進度）與切換器無關。

let _PROJ = null;    // { id, name, status } —— 專案模式才有；提案模式是 null

/** 專案標頭：專案名 + 階段 chip。
 *  🔴 **不顯示任何金額** —— `GET /crm/projects/{id}` 會回 contract_amount /
 *  amount_receivable / profit_target_pct，而這頁的閘門收得比 CRM 寬
 *  （preprod_plan 的企劃人員進得來）。標頭只放名字與階段。 */
function _paintProjectHead(project) {
    $("plan-title").textContent = project.name || "（未命名專案）";
    document.title = (project.name || "專案") + "｜專案｜ORIGINSUN";
    const chip = $("proj-stage");
    chip.textContent = project.status || "";
    chip.style.display = project.status ? "" : "none";
    $("plan-back").textContent = "← 專案清單";
}

/** 提案切換器：只在有兩筆以上時出現。切換＝換網址重載（`?id=…&p=…`）——
 *  提案範疇的六個分頁各有各的掛載狀態與自動儲存基準，就地換提案要一個一個
 *  拆重掛，而那正是「換了提案卻看到上一份的字」的來源。 */
function _wirePropSwitch(proposals, currentId) {
    if (proposals.length < 2) return;
    const box = $("prop-switch");
    const sel = $("prop-switch-sel");
    sel.innerHTML = "";
    proposals.forEach(p => {
        const o = document.createElement("option");
        o.value = p.id;
        o.textContent = (p.title || "（未命名）") + (p.status ? `　${p.status}` : "");
        o.selected = (p.id === currentId);
        sel.appendChild(o);
    });
    box.style.display = "";
    sel.addEventListener("change", () => {
        const u = new URLSearchParams(location.search);
        u.set("p", sel.value);
        location.search = u.toString();
    });
}

/** 這個專案還沒有提案 —— 進度照常給，其餘分頁換成一顆「建立提案」。
 *  走既有的 `POST /proposals` 帶 project_id（掛到既有專案那條路），
 *  不另開端點。 */
function _renderNoProposal(project) {
    _showSideTabs();
    // 提案範疇的分頁全部不亮（唯讀不是靠隱藏元素，是靠沒建出來 —— 這裡連
    // 按鈕都不顯示，因為點了確實沒有東西可看）
    ["info", "plan", "refs"].forEach(t => {
        const b = $("plan-side").querySelector(`[data-ptab="${t}"]`);
        if (b) b.style.display = "none";
    });
    // 標頭那排（提案狀態下拉／編輯／刪除）動的都是提案，沒有提案就沒有意義
    $("plan-acts").style.display = "none";
    $("tab-flow").style.display = "";
    _setupLazyTab("flow", { projectId: project.id, here: "preprod_proposals" });
    // 🔴 CTA 掛在**側欄**不是 plan-host：那個容器屬於「創意發想」分頁，而
    // 下面就要把畫面切到進度 —— 放那裡會被一起藏起來（按鈕在、但看不見）。
    // 側欄的東西不隨分頁切換消失，而「這個專案還沒有提案」本來就是導覽層級
    // 的事實，不是某一頁的內容。
    const cta = document.createElement("div");
    cta.id = "no-prop-cta";
    cta.innerHTML = '<div class="ps-label">還沒有提案</div>'
        + '<button id="mk-prop">建立提案</button>';
    $("plan-side").appendChild(cta);
    $("mk-prop").addEventListener("click", async (e) => {
        e.target.disabled = true;
        try {
            const d = await ok(await mfetch("/api/v1/proposals", {
                method: "POST",
                body: JSON.stringify({ title: project.name || "新提案",
                                       project_id: project.id }),
            }));
            const u = new URLSearchParams(location.search);
            u.set("p", d.proposal.id);
            location.search = u.toString();
        } catch (err) { alert("建立失敗：" + emsg(err)); e.target.disabled = false; }
    });
    _activateTab("flow");
}

async function _loadProject(projectId) {
    _show("plan-view");
    try {
        // 專案本體與它的提案清單同時起跑 —— 串起來 await 會讓首屏多等一個 RTT
        const [pr, lr] = await Promise.all([
            mfetch("/api/v1/crm/projects/" + encodeURIComponent(projectId)),
            mfetch("/api/v1/proposals?project_id=" + encodeURIComponent(projectId)),
        ]);
        if (!pr.ok) throw new Error(pr.status === 404 ? "找不到此專案" : "HTTP " + pr.status);
        // ⚠️ 這支回的是**專案物件本身**，沒有 {project:…} 外層（與提案端的
        //   {proposal:…} 不同）—— 照抄鄰居的形狀會拿到 undefined
        const project = await pr.json();
        _PROJ = { id: project.id, name: project.name, status: project.status };
        _paintProjectHead(project);
        const proposals = lr.ok ? ((await lr.json()).proposals || []) : [];
        if (!proposals.length) { _renderNoProposal(project); return; }
        // 指定哪一份（?p=），否則用清單第一筆（後端已按 updated_at desc 排）
        const want = new URLSearchParams(location.search).get("p");
        const cur = proposals.find(p => p.id === want) || proposals[0];
        _wirePropSwitch(proposals, cur.id);
        await _loadPlan(cur.id);
    } catch (e) {
        $("plan-host").innerHTML = '<div class="state-msg" style="color:var(--red);">'
            + "專案載入失敗：" + escText(emsg(e)) + "</div>";
    }
}

/** 標頭文字：專案模式維持專案名（提案名在側欄切換器上），提案模式用提案名。 */
function _paintPlanTitle(prop) {
    if (_PROJ) return;
    $("plan-title").textContent = prop.title;
    document.title = prop.title + "｜提案企劃｜ORIGINSUN";
}

// ── 企劃（登入模式） ─────────────────────────────────────
async function _loadPlan(pid) {
    _show("plan-view");
    const host = $("plan-host");
    try {
        // 三件事同時起跑：提案本體（API）、常數、動作層（後兩者是模組下載）。
        // 串起來 await 的話首屏要多等兩個 RTT，而使用者在等的是標題與企劃矩陣。
        // 動作層只有登入模式需要（會打端點）—— 訪客那條不載。
        // boot() 走 ?pid= 時就預載好了（與 auth/me 平行）；直接呼叫進來的話
        // 這裡補起跑。企劃矩陣是使用者真正在等的東西，而且它自己還要再拉
        // plan-templates 與 js/shared/utils.js —— 那第二跳不能排在側欄渲染之後。
        const constP = _propConst();
        const [paP, matrixP] = _planMods || [
            import("/tabs/proposals/prop-actions.js"),
            importRetryish("/tabs/proposals/plan-matrix.js"),
        ];
        const r = await mfetch("/api/v1/proposals/" + encodeURIComponent(pid));
        if (!r.ok) throw new Error(r.status === 404 ? "找不到此提案" : "HTTP " + r.status);
        const prop = (await r.json()).proposal;
        await constP;
        const PA = await paP;
        // 專案模式的標頭是專案名（已由 _paintProjectHead 畫好）—— 別被提案標題
        // 蓋掉。提案的名字在側欄的切換器上。
        _paintPlanTitle(prop);
        // 🔴 一律重抓，不要拿 PUT 的回應直接 Object.assign：
        //   PUT 回的 _prop_dict 少 client_name/references/plan/survey（client_name
        //   還固定是空字串），蓋上去會讓側欄的「客戶」整列消失；
        //   而且側欄的自動儲存欄位沒寫回 prop，拿舊 prop 去開編輯表單再整包 PUT，
        //   會把使用者剛打的備註/標籤蓋回開頁時的值（真的會刪掉字）。
        // 編輯是低頻動作，一支 GET 換掉「前端猜伺服器改了什麼」的整套推理。
        const refresh = async () => {
            Object.assign(prop, await infoOpts.reload());
            _paintPlanTitle(prop);
            _renderInfo($("info-host"), prop, infoOpts);
            _renderRefs($("refs-host"), prop, infoOpts);
        };
        // 登入模式：完整欄位可編，走既有部分更新 PUT
        const P = "/api/v1/proposals/" + encodeURIComponent(pid);
        const infoOpts = {
            editable: ["ptype", "pitch_date", "budget_range", "tags", "notes", "outcome_reason"],
            hint: "欄位改完會自動儲存。標題、客戶與狀態在上方標頭調整"
                + "（成案會建立或推進 CRM 專案）。",
            deck: {
                exts: PC.DECK_EXTS,
                download: async () => {
                    const { openDeck } = await import("/tabs/proposals/prop-fetch.js");
                    return openDeck(prop.id, prop.deck_url);
                },
                upload: async (f) => {
                    try { if (await PA.uploadDeck(prop, f)) await refresh(); }
                    catch (e) { alert("上傳失敗：" + emsg(e)); }
                    finally { const el = $("deck-file"); if (el) el.value = ""; }
                },
                // 把「提案資料」裡已經勾選的某一份升成簡報。deck.pinned（候選
                // 從哪來）由資料夾分頁掛好後補上 —— 在那之前這一格就是「尚未上傳」。
                setFromAsset: async (rel) => {
                    await ok(await mfetch(P + "/deck/from-asset",
                        { method: "POST", body: JSON.stringify({ rel }) }));
                    await refresh();
                },
            },
            save: async (field, value) => ok(await mfetch(P, { method: "PUT", body: JSON.stringify({ [field]: value }) })),
            reload: async () => (await ok(await mfetch(P))).proposal,
            survey: {
                save: async (key, field, value) => ok(await mfetch(P + "/survey",
                    { method: "PATCH", body: JSON.stringify({ key, field, value }) })),
                addRow: async (label) => (await ok(await mfetch(P + "/survey/rows",
                    { method: "POST", body: JSON.stringify({ label }) }))).survey,
                removeRow: async (key) => (await ok(await mfetch(
                    P + "/survey/rows/" + encodeURIComponent(key), { method: "DELETE" }))).survey,
                hint: "欄位改完會自動儲存。客戶那邊看不到「預算」這一列。",
            },
            refPageUrl: (rid) => "/reference.html?id=" + encodeURIComponent(rid),
            refs: {
                // 貼網址 / 從片庫挑，兩條都走共用動作層（跟後台同一支端點組合）
                // 三個動作同形：只動這張卡 → 交給 _wireRefs 的局部重畫，不整頁重載
                add: (url, title) => PA.addRefByUrl(prop.id, url, title),
                library: PA.libraryRefs,
                link: (rid) => PA.linkRef(prop.id, rid),
                patch: async (rid, field, value) => ok(await mfetch(
                    "/api/v1/proposals/references/" + encodeURIComponent(rid),
                    { method: "PUT", body: JSON.stringify({ [field]: value }) })),
                remove: (rid) => PA.unlinkRef(prop.id, rid),
            },
        };
        _renderInfo($("info-host"), prop, infoOpts);
        _renderRefs($("refs-host"), prop, infoOpts);
        _wireHeaderActions(prop, PA, refresh);
        _showSideTabs();
        host.innerHTML = "";
        const { renderPlan } = await matrixP;
        renderPlan(host, { proposalId: prop.id, plan: prop.plan || null, canShare: true });

        // 資料夾分頁的接線放在企劃矩陣**之後**，而且不 await：它只是註冊設定與
        // 亮出分頁鈕，晚幾毫秒無所謂；擺在前面的話那次 module import 會把使用者
        // 真正在等的矩陣往後推一個 RTT（走隧道時很有感）。
        // 用 .catch 而不是 try —— 它跑在矩陣畫好之後，掉進外層 catch 會把已經
        // 畫好的矩陣換成「企劃載入失敗」。訪客那條的資料夾探測也是這個形狀。
        // hooks：側欄的「提案簡報」那一格要跟著資料夾分頁走 —— 候選（勾選了
        // 哪些）與現值（★ 標在哪一份）都住在那邊。兩件事都只重畫那一格。
        if (prop.project_id) _wireFolderTab(prop, {
            onPins: (pins) => {
                infoOpts.deck.pinned = () => pins.get().pinned || [];
                pins.watch(() => _repaintDeckCell(prop, infoOpts.deck));
            },
            onDeck: () => _repaintDeckCell(prop, infoOpts.deck),
        }).catch(e => console.warn("[folder] 資料夾分頁接線失敗", e));
        // 企劃書：矩陣要當生成的輸入，所以 plan 一起帶進去
        _setupLazyTab("brief", { proposalId: prop.id, plan: prop.plan || null,
                                 toast: (m) => alert(m) });
        // 報價單：金額敏感 —— 只在這條登入路徑接線，訪客的 _loadSharedPlan 沒有
        _setupLazyTab("quote", { proposalId: prop.id });
        // 會議記錄：內部素材（會記到內部判斷與報價底線），同樣不給訪客
        _setupLazyTab("meeting", { proposalId: prop.id });
        // 進度：專案的五軌工作流。沒有殼專案時**照掛** —— 那一頁不再只是一句
        // 「還沒有關聯專案」，而是把它放進管線的那顆按鈕（§14.4 邊界態）；
        // 而這裡正是會發現「這個案子沒進管線」的地方。訪客沒有這條路
        // （內部進度、人名、金額訊號都不出公開頁，見 §14.3；訪客走
        // _loadSharedPlan）。
        // here：這頁本身就是提案工作區 —— 指回提案庫的燈不畫連結（見 renderFlow）
        _setupLazyTab("flow", {
            projectId: prop.project_id || "", proposalId: prop.id,
            here: "preprod_proposals",
            // 進度分頁動了後端 → 這頁的鏡像要跟上：自癒建殼會改「專案」那格，
            // 推進階段會連動這筆提案的狀態（進「製作」＝標成案），而狀態下拉
            // 就在標頭上。refresh() 兩者都涵蓋。
            // （資料夾分頁要等重整才會出現：它的接線在上面那一段，
            //   而那是開頁時一次性的。）
            onChanged: () => refresh(),
        });
        // 專案模式：進度是全局視圖，開頁就該看到它 —— 先看到某一份提案的
        // 創意發想，等於又把主角換回提案。分頁鈕也移到最前面，順序＝重要性。
        if (_PROJ) {
            const side = $("plan-side");
            side.insertBefore($("tab-flow"), side.querySelector('[data-ptab="info"]'));
            _activateTab("flow");
        }
    } catch (e) {
        host.innerHTML = '<div class="state-msg" style="color:var(--red);">創意發想載入失敗：' + escText(emsg(e)) + "</div>";
    }
}

/**
 * 登入模式的資料夾分頁接線：看得到**整份**資產夾（含報價、內部版腳本那些），
 * 而且就地建得了夾、傳得了檔（owner 2026-08-08 選 B —— 企劃頁不該是「看得到
 * 卻做不了」的死路）。訪客那條走 token 端點，範圍小得多，接線在 _loadSharedPlan。
 */
async function _wireFolderTab(prop, hooks = {}) {
    const projectId = prop.project_id;
    const AP = "/api/v1/crm/projects/" + encodeURIComponent(projectId) + "/proposal-assets";
    // 端點掛在專案層、勾選與簡報卻是這一筆提案的 —— 一律帶 pid，否則後端只能
    // 退回「最近更新的那筆」，多提案專案會標到別筆（見後端 pins_row）
    const q = (rel) => "?rel=" + encodeURIComponent(rel || "")
        + "&pid=" + encodeURIComponent(prop.id);
    // 這筆提案的「家」：專案資產夾底下自己的子夾。一個專案可以並行多筆提案，
    // 共用一個夾的話幾個 concept 的腳本與簡報會混在一起（NAS 上本來就是手工
    // 開子夾在分的）。空 = 合體前建的既有提案，家就是專案夾根 —— 不動它。
    // 有值就先確保磁碟上那個夾真的在（建立提案時只取名、沒碰 NAS）。冪等。
    let sub = prop.folder_subpath || "";
    if (sub) {
        try {
            sub = (await ok(await mfetch("/api/v1/proposals/" + encodeURIComponent(prop.id)
                                         + "/folder", { method: "POST" }))).folder_subpath || sub;
        } catch (e) {
            console.warn("[folder] 子夾建立失敗，退回專案夾根", e);
            sub = "";
        }
    }
    // 重點提案的狀態與三支端點都在 store 裡（CRM 專案分頁用的是同一顆），
    // 生命週期＝這一個提案，所以建在這裡而不是模組層。
    const [{ makePinsStore }, u, tplMod] = await Promise.all([
        import("/tabs/proposals/pins-store.js"),
        import("/js/shared/utils.js"),      // 點一次檔案就 import 一次是熱路徑
        import("/tabs/proposals/brief-templates.js"),   // 檔案列的「設為範本」
    ]);
    const pins = makePinsStore({
        base: AP,
        pid: prop.id,
        request: async (url, init) => ok(await mfetch(url, init)),
    });
    hooks.onPins?.(pins);
    // 目前哪一份是簡報（★ 要亮在哪一列）。每一層的回應都帶 deck_rel ——
    // 設定成功時端點也回一份，所以不必為了換一顆星重掃一趟 NAS。
    let deckRel = "";
    // 側欄的「提案簡報」那一格要知道有沒有勾選的候選，而勾選狀態要等資料夾
    // 分頁**被點開**才會有（folder-view 是 lazy 掛的）。所以沒有 deck 的提案
    // 先掃一次最外層把 store 餵飽 —— 這一趟同時當 folder-view 的 `initial`，
    // 使用者真的切過去時不會再掃一次。已經有 deck 的不掃：那一格已經有答案了。
    let first = null;
    if (!prop.deck_url) {
        try {
            first = await ok(await mfetch(AP + q(sub)));
            pins.sync(first);
            deckRel = first.deck_rel || "";
        } catch (e) { console.warn("[folder] 資產夾預掃失敗（分頁點開時會再試）", e); }
    }
    _setupFolderTab({
        // 從自己的家開始。rootLabel 刻意**不**改成子夾名 —— 麵包屑的最左邊
        // 代表「專案夾」，改掉的話會變成「子夾名 / 子夾名」，而且就沒有東西
        // 可以點回上一層了（同一個案子的素材要走得過去）。
        startRel: sub,
        initial: first,        // 預掃過就別再掃一次（沒掃成是 null，folder-view 自己去載）
        load: async (rel) => {
            const d = await ok(await mfetch(AP + q(rel)));
            deckRel = d.deck_rel ?? deckRel;   // pinned 那半 folder-view 自己餵回 store
            return d;
        },
        // CRM 端點要帶 Bearer，<a href> 送不了 → 走共用的授權下載
        onFile: (f) => u.authDownload(AP + "/file?rel=" + encodeURIComponent(f.rel), f.filename),
        write: {
            mkdir: async (name, rel) => ok(await mfetch(AP + "/mkdir" + q(rel),
                { method: "POST", body: JSON.stringify({ name }) })),
            // opts = {onProgress, signal}（folder-view 給的，它負責畫進度條）
            // 走 uploadWithProgress 不走 fetch —— fetch 沒有上傳進度事件
            // uploadItems 會照連線的 body 上限自動分批（走隧道時 100MB）；
            // 「沒存成就不重畫」與「哪些被略過」都在 folder-view 裡
            upload: (items, rel, opts) => u.uploadItems(
                AP + "/upload" + q(rel), items,
                Object.assign({ headers: _authHeader() }, opts)),
        },
        // 勾選＝策展（此刻以這份為準），不搬檔案、不等於給客戶看。
        // store 本身就滿足 folder-view 要的 {isPinned, toggle, sync}，不需要轉接層。
        pin: pins,
        // 每列兩個動作 —— folder-view 不知道 ★ 與 📚 是什麼意思，動作自帶 run
        // （同 CRM 專案分頁那份）。狀態走 cls（'on' = 亮起來），不寫 inline 顏色。
        rowActions: [
            // ★ 設為提案簡報：客戶看到的那一份就是它，所以**要人按**（勾選不會
            // 自動變簡報）。側欄那一格靠 onDeck 跟著換，不整塊重畫。
            { at: "lead", html: () => "★",
              cls: (f) => (f.rel === deckRel ? "on" : ""),
              title: (f) => (f.rel === deckRel ? "目前的提案簡報" : "設為提案簡報"),
              errPrefix: "設定提案簡報失敗",
              run: async (f) => {
                  const r = await ok(await mfetch(
                      "/api/v1/proposals/" + encodeURIComponent(prop.id) + "/deck/from-asset",
                      { method: "POST", body: JSON.stringify({ rel: f.rel }) }));
                  deckRel = r.deck_rel || f.rel;
                  prop.deck_url = r.deck_url || prop.deck_url;
                  hooks.onDeck?.();                // 側欄那一格立刻換成「有簡報」
                  // 端點順手把它勾成提案資料（deck ⊆ 勾選是後端的單一真相）→
                  // 重載這一層，勾選框與卡片列才會跟著亮。多一趟掃描換
                  // 「畫面＝伺服器」，而按★是低頻動作。
                  const dir = f.rel.includes("/") ? f.rel.slice(0, f.rel.lastIndexOf("/")) : "";
                  const level = await ok(await mfetch(AP + q(dir)));
                  pins.sync(level);                // apply() 不會餵 store，這裡自己餵
                  deckRel = level.deck_rel ?? deckRel;
                  return level;                    // 整層換上（folder-view 的約定）
              } },
            // 抽不出文字的格式不長這顆 —— 讓人按下去才知道不行是浪費一次往返
            { at: "trail", html: (f) => (tplMod.isTemplateFile(f.filename) ? "📚" : ""),
              title: "設為企劃範本（複製一份到 _範本，原檔不動）",
              errPrefix: "設為範本失敗",
              run: async (f) => {
                  if (!tplMod.isTemplateFile(f.filename)) return;
                  if (await tplMod.templateFromAsset(projectId, f)) alert("已加入企劃範本庫");
              } },
        ],
    }, pins);
}

// ── 企劃（公開共編模式，?t=<token>，免登入） ─────────────
async function _loadSharedPlan(shareTok) {
    // 常數在 fetch 之前起跑 —— 客戶走的是免登入的慢隧道，序列化最不划算
    const constP = _propConst();
    _show("plan-view");
    $("btn-logout").style.display = "none";
    $("plan-back").style.display = "none";           // 公開訪客沒有清單可回
    const bar = $("guest-bar");
    bar.style.display = "inline-flex";
    const nameInput = $("guest-name");
    nameInput.value = localStorage.getItem("plan_guest_name") || "";
    nameInput.addEventListener("change", () => localStorage.setItem("plan_guest_name", nameInput.value.trim()));
    const host = $("plan-host");
    const base = "/api/v1/proposals/shared/" + encodeURIComponent(shareTok);
    try {
        const r = await fetch(base);
        if (r.status === 401) { host.innerHTML = '<div class="state-msg">這條共編連結已停用或失效。<br>請向企劃負責人索取新連結。</div>'; return; }
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        $("plan-title").textContent = d.title;
        document.title = d.title + "｜提案企劃（共編）｜ORIGINSUN";
        if (d.info) {   // 舊後端沒有 info → 不顯示側欄（純企劃，行為同從前）
            // 公開共編：只放行描述性欄位（後端 _PUBLIC_INFO_FIELDS 才是真守門）
            const J = { "Content-Type": "application/json" };
            await constP;                      // PTYPES（畫類型下拉要用）
            const sharedOpts = {
                editable: ["ptype", "pitch_date", "tags", "notes"],
                save: async (field, value) => ok(await fetch(base + "/info",
                    { method: "PATCH", headers: J, body: JSON.stringify({ field, value }) })),
                reload: async () => (await ok(await fetch(base))).info,
                // 訪客也能一起填盤點表（加/刪欄目只有員工能做 —— 不給公開連結長結構）
                survey: {
                    save: async (key, field, value) => ok(await fetch(base + "/survey",
                        { method: "PATCH", headers: J, body: JSON.stringify({ key, field, value }) })),
                    hint: "填完會自動儲存，製作團隊那邊即時看得到。",
                },
                // 公開共編：研究頁也走 token（?t=&id=），對方不用登入
                refPageUrl: (rid) => "/reference.html?t=" + encodeURIComponent(shareTok) +
                                     "&id=" + encodeURIComponent(rid),
                refs: {
                    add: async (url, title) => ok(await fetch(base + "/refs",
                        { method: "POST", headers: J, body: JSON.stringify({ url, title }) })),
                    patch: async (rid, field, value) => ok(await fetch(
                        base + "/refs/" + encodeURIComponent(rid),
                        { method: "PATCH", headers: J, body: JSON.stringify({ [field]: value }) })),
                    remove: async (rid) => ok(await fetch(base + "/refs/" + encodeURIComponent(rid),
                        { method: "DELETE" })),
                },
            };
            _renderInfo($("info-host"), d.info, sharedOpts);
            _renderRefs($("refs-host"), d.info, sharedOpts);
            _showSideTabs();
            // 訪客模式：只看得到「對外分享」子夾（範圍由 token 端點的 root 決定，
            // 前端拿不到、也改不了）。沒開這個夾 → enabled:false → 不顯示分頁。
            //
            // 探測**不 await** —— 它會打到 NAS，SMB 慢的時候等於讓客戶盯著
            // 「載入中…」，而企劃內容其實早就到了。有東西再把分頁亮出來。
            const fbase = base + "/folder";
            const dl = await import("/js/shared/utils.js");
            fetch(fbase).then(r => r.json()).then(first => {
                if (!first || !first.enabled) return;
                // 不傳 pin/pins —— 策展與授權都只有員工能做，客戶那頁連按鈕都
                // 不該建出來（唯讀不是靠隱藏元素，是靠沒建出來）
                _setupFolderTab({
                    emptyHint: "這個提案還沒有分享任何檔案。",   // 客戶唯讀，沒有「拖進來」可講
                    initial: first,   // 探測回來的就是最外層 —— 別再掃一次
                    load: async (rel) => ok(await fetch(fbase + "?rel=" + encodeURIComponent(rel))),
                    onFile: (f) => dl.plainDownload(
                        fbase + "/file?rel=" + encodeURIComponent(f.rel), f.filename),
                });
            }).catch(() => { /* 探測失敗 → 不顯示分頁，不影響企劃本體 */ });
        }
        host.innerHTML = "";
        // 企劃還沒開始（公開頁可以先開放、企劃後補）→ 訪客看提示，
        // 不能給 renderPlan 的「開始企劃」按鈕 — 那些會打登入端點
        if (!d.plan || !d.plan.template_id) {
            host.innerHTML = '<div class="state-msg">創意發想尚未開始 — 可先看「基本資料」與「資料夾」分頁。</div>';
            return;
        }
        const { renderPlan } = await import("/tabs/proposals/plan-matrix.js");
        renderPlan(host, {
            proposalId: "shared", plan: d.plan, canShare: false,
            getGuestName: () => nameInput.value.trim(),
            endpoints: { cell: base + "/cell", meta: base + "/meta" },
            refetch: async () => (await (await fetch(base)).json()).plan,
        });
    } catch (e) {
        host.innerHTML = '<div class="state-msg" style="color:var(--red);">載入失敗：' + escText(emsg(e)) + "</div>";
    }
}

/** 登入模式下，logo 與「提案企劃 PLANNER」點了回提案清單。
 *  訪客（?t=）看不到清單，那條路徑刻意不掛 —— 點了跳到登入頁只會讓客戶困惑。 */
function _wireBrandHome() {
    const el = $("brand-home");
    if (!el || el.dataset.wired) return;   // 登入成功會再跑一次 boot()
    el.dataset.wired = "1";
    el.style.cursor = "pointer";
    el.title = "回提案清單";
    el.addEventListener("click", () => { location.href = location.pathname; });
}

async function boot() {
    // 只 parse 一次：下面「要預載哪些模組」與最後「進清單還是進企劃」必須是同一個
    // 判斷，分開讀兩次就有機會走岔
    const q = new URLSearchParams(location.search);
    const shareTok = q.get("t");
    const pid = q.get("pid");
    // ?id=<專案id> ＝ 專案模式（主鍵是專案，提案是它底下的東西）。
    // ?pid=<提案id> 仍然有效：既有的深連結（CRM 的「開啟企劃」、我的工作台）
    // 不該因為這次改動就死掉。
    const projId = q.get("id");
    if (shareTok) { _loadSharedPlan(shareTok); return; }   // 公開模式：完全不走登入
    _wireBrandHome();
    if (!localStorage.getItem(TOKEN_KEY)) { showLogin(""); return; }
    // 該走哪條就預載哪條，而且趕在 auth/me 之前 —— 模組下載與身分驗證平行，
    // 省掉「等身分回來才開始下載」那一趟（?pid= 是深連結，最常走）
    if (pid || projId) {
        _propConst();
        _planMods = [import("/tabs/proposals/prop-actions.js"),
                     importRetryish("/tabs/proposals/plan-matrix.js")];
    } else {
        _listMod = importRetryish("/tabs/proposals/prop-list.js");
    }
    let me;
    try {
        const r = await mfetch("/api/v1/auth/me");
        if (r.status === 401) { localStorage.removeItem(TOKEN_KEY); showLogin(""); return; }
        if (!r.ok) { showLogin("載入失敗（" + r.status + "）"); return; }
        me = await r.json();
    } catch (_) { showLogin("連線失敗，請稍後再試"); return; }
    const mods = me.modules || [];
    const isAdmin = (me.access_level || 0) >= 3 || me.role_name === "admin";
    $("hdr-user").textContent = me.username || "";
    $("hdr-user").style.display = "";
    // 模組清單要與 noperm-view 文案一起改（crm_projects 於 2026-08-03 放行 — 提案×專案整合）
    if (!isAdmin && !["preprod_proposals", "preprod_plan", "crm_projects"].some(m => mods.includes(m))) { _show("noperm-view"); return; }
    if (projId) { _loadProject(projId); }
    else if (pid) { _loadPlan(pid); }
    else { _loadList(); }
}

boot();
</script>
