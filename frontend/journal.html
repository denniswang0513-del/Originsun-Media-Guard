<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>上週回顧｜ORIGINSUN</title>
<!-- 每週回顧（員工自助頁家族：my.html / media-log.html 同語彙）：
     白底/旭日紅/大字距/髮絲邊框。三檢視：回顧（我的回顧＋大家的回顧）/學習庫/依人回溯
     —— 2026-07-24 起 pill 暫隱藏只顯示回顧（見 .pill-row 註解）；內部分頁 tabs/journal
     （管理/HR 用）仍顯示三檢視，刻意不同步。
     2026-09-05（docs/JOURNAL_WORKLOG_PLAN.md §13–§14）：預設開上一週；自動區「上週做了什麼」（worklog，唯讀，可勾「帶入」）；
     四問每條可掛案子、「挑戰」「其他」可標需要協助／想討論；主管回覆灰底；打字 1.5 秒自動存草稿、「送出」才進大家的回顧；
     大家的回顧只列 submitted、預設全部展開，沒送出的人標「草稿」「還沒寫」；有 timesheets 模組的人每條下有回覆框。
     共用核心 /js/shared/journal-core.js（四問標籤、週期運算、API、條目／回覆渲染）；本頁只做版面。
     後端契約：/api/v1/journal/*（Bearer token；週=週一起算；可編輯窗由後端 editable 旗標決定）。 -->
<style>
:root { --red: #c9372c; --ink: #262626; --sub: #737373; --line: #e5e5e5; --blue: #1d4ed8; --ok: #15803d; --warn: #b45309; --soft: #fafafa; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #fff; color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
.eyebrow { font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--sub); }
.accent { color: var(--red); }

/* ── Header（仿官網：fixed 白底 blur + 髮絲下框）── */
header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(229,229,229,0.6);
}
.header-inner {
    max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 64px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-name { font-size: 13px; letter-spacing: 0.25em; font-weight: 300; color: var(--ink); }
.btn-ghost {
    background: none; border: 1px solid var(--line); border-radius: 2px; padding: 6px 14px;
    font-size: 11px; letter-spacing: 0.2em; color: var(--sub); cursor: pointer; transition: all .15s;
}
.btn-ghost:hover { color: var(--red); border-color: var(--red); }

main { max-width: 1100px; margin: 0 auto; padding: 104px 20px 80px; }

/* ── Embed 模式（內嵌 /my.html 工作台 iframe；iframe 自動偵測、?embed=0 可逃）
   照 showcase-edit.html 同一套：隱藏自身 chrome + postMessage 回傳高度 ── */
/* min-height:0 是必要的 — body 若保留 min-height:100vh，父層放大 iframe →
   子頁視窗變高 → body 更高 → 回報更大高度，會無限長高（實測衝到 11890px） */
html.embed-mode body { background: transparent; min-height: 0; }
html.embed-mode header,
html.embed-mode footer,
html.embed-mode .hero { display: none; }
html.embed-mode main { max-width: none; padding: 0; }
/* embed 內一律用 px：vh 是以「iframe 自身視窗高」解析，而那個高度由父層依回報值設定
   → 又一條父子互相放大的回饋路徑（收斂但會多繞好幾圈） */
html.embed-mode .state-block { padding: 36px 0; }
html.embed-mode .gate-wrap { margin: 0 auto; }

/* ── 載入 / 連線失敗狀態 ── */
.state-block { padding: 12vh 0; text-align: center; }
.state-block .msg { font-size: 15px; color: var(--sub); margin-top: 16px; line-height: 1.8; }

/* ── 登入提示卡 ── */
.gate-wrap { max-width: 400px; margin: 8vh auto 0; }
.gate-card { border: 1px solid var(--line); padding: 40px 36px; }
.gate-card h1 { font-size: 22px; font-weight: 300; letter-spacing: 0.1em; margin: 18px 0 6px; }
.gate-card .sub { font-size: 13px; color: var(--sub); margin-bottom: 28px; line-height: 1.7; }
.btn-primary {
    display: block; text-align: center; background: var(--ink); color: #fff;
    border: none; border-radius: 2px; padding: 12px; font-size: 12px;
    letter-spacing: 0.3em; text-transform: uppercase; cursor: pointer; transition: background .15s;
}
.btn-primary:hover { background: var(--red); }

/* ── 標題區 ── */
.hero { margin-bottom: 26px; }
.hero h1 { font-size: 28px; font-weight: 300; letter-spacing: 0.05em; margin-top: 10px; }
.hero .sub { font-size: 13px; color: var(--sub); margin-top: 8px; line-height: 1.8; }

/* ── 檢視 pill（同 media-log：選中黑底白字）── */
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
.pill-btn {
    background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 16px;
    font-size: 12px; color: var(--sub); cursor: pointer; transition: all .15s; letter-spacing: 0.05em;
}
.pill-btn:hover { border-color: var(--ink); color: var(--ink); }
.pill-btn.on { background: var(--ink); border-color: var(--ink); color: #fff; }

/* ── 週導覽 ── */
.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.wk-title { display: flex; align-items: center; gap: 12px; font-size: 15px; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
.wk-btn {
    background: #fff; border: 1px solid var(--line); border-radius: 8px; min-height: 34px; padding: 0 12px;
    font-size: 13px; color: var(--ink); cursor: pointer; transition: all .15s; white-space: nowrap;
}
.wk-btn:hover { border-color: var(--ink); }
.wk-btn.small { min-height: 26px; padding: 0 8px; font-size: 12px; border-radius: 6px; }

/* ── 兩欄：左＝我的回顧、右＝大家的回顧 ── */
.block2 { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; align-items: start; }
@media (max-width: 1000px) { .block2 { grid-template-columns: 1fr; } }

/* ── 卡片 ── */
.card { border: 1px solid var(--line); padding: 16px 18px 14px; margin-bottom: 18px; min-width: 0; background: #fff; }
.card-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 8px;
}
.card-head .count { font-size: 12px; color: var(--sub); }
.empty { padding: 22px 0; font-size: 13px; color: #a3a3a3; text-align: center; }
.empty.pad-sm { padding: 12px 0; }   /* 人卡內的（空白）用較小留白 */
.jstate { font-size: 12px; color: var(--sub); }
.jstate.draft b { color: var(--warn); font-weight: 600; }
.jstate.submitted { color: var(--ok); }

/* ── 自動區（上週做了什麼）── */
.wl { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 6px 0; background: var(--soft); font-size: 13px; }
.wl-pj { font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.wl-days { color: var(--sub); font-size: 12px; font-weight: 400; }
.wl ul { margin: 4px 0 0; padding-left: 18px; } .wl li { margin: 2px 0; line-height: 1.6; }
.wl-day { color: var(--sub); font-size: 12px; margin-right: 6px; }
.wl-pick { font-size: 11px; color: var(--sub); margin-left: 6px; white-space: nowrap; cursor: pointer; }
.wl-pick input { accent-color: var(--red); vertical-align: -1px; }
.pill-stage, .pill-proj, .pill-flag { display: inline-block; padding: 0 7px; border-radius: 999px; border: 1px solid currentColor; font-size: 11px; line-height: 17px; white-space: nowrap; vertical-align: 1px; }
.pill-stage { color: var(--blue); background: #eff6ff; border-color: #bfdbfe; }
.pill-proj { color: var(--sub); border-color: var(--line); background: #fff; }
.pill-flag.help { color: var(--red); border-color: #fecaca; background: #fef2f2; }
.pill-flag.discuss { color: var(--warn); border-color: #fed7aa; background: #fff7ed; }

/* ── 我的回顧（四問 textarea＋每條的掛案／旗標）── */
.blk h4 { font-size: 14px; color: var(--ink); font-weight: 600; margin: 14px 0 6px; display: flex; justify-content: space-between; align-items: baseline; }
.blk h4 small { color: var(--sub); font-weight: 400; font-size: 12px; }
.blk textarea {
    width: 100%; min-height: 74px; border: 1px dashed var(--line); border-radius: 8px;
    padding: 9px 12px; font-size: 13px; font-family: inherit; color: var(--ink); background: #fff;
    line-height: 1.7; resize: vertical; outline: none; transition: border-color .15s;
}
.blk textarea:focus { border-color: var(--ink); border-style: solid; }
.blk textarea:disabled { background: #fafafa; color: #8a8a8a; }
.blk ul { list-style: none; }
.blk li { position: relative; padding: 2px 0 2px 14px; font-size: 13px; line-height: 1.7; overflow-wrap: break-word; }
.blk li::before { content: "\2022"; position: absolute; left: 1px; color: #c9c9c9; }
.meta-list { margin-top: 4px; }
.em { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 4px 0; border-bottom: 1px solid #f5f5f5; font-size: 12px; }
.em-t { flex: 1 1 160px; min-width: 0; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.em input.em-proj, .em select.em-flag { border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font-size: 11px; font-family: inherit; color: var(--sub); background: #fff; }
.em input.em-proj { width: 180px; } .em select.em-flag { width: 96px; }
.em .reply { flex-basis: 100%; }
/* 貼圖縮圖（journal-core renderRich 產出；點開新分頁看原圖） */
.paste-img {
    display: block; max-width: 100%; max-height: 180px; margin: 4px 0;
    border: 1px solid var(--line); border-radius: 2px; cursor: zoom-in;
}
/* 編輯中即時預覽：textarea 下方的貼圖縮圖列（pasteThumbs 產出） */
.paste-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.paste-preview:empty { display: none; }
.paste-preview .paste-thumb {
    display: block; height: 84px; width: auto; max-width: 100%;
    border: 1px solid var(--line); border-radius: 2px; cursor: zoom-in;
}
.save-row { display: flex; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.btn-save {
    background: var(--ink); color: #fff; border: 1px solid var(--ink); border-radius: 8px;
    min-height: 34px; padding: 0 14px; font-size: 13px; cursor: pointer; transition: background .15s;
}
.btn-save:hover { background: #000; }
.btn-save:disabled { opacity: 0.5; cursor: default; }
.save-msg { font-size: 12px; color: var(--sub); opacity: 1; transition: opacity .6s; }
.save-msg.err { color: var(--red); }
.hint { font-size: 12px; color: #a3a3a3; }

/* ── 主管回覆（灰底）與回覆框 ── */
.reply { margin: 4px 0 2px; background: #f5f5f5; border-left: 3px solid #d4d4d4; padding: 5px 10px; font-size: 12.5px; line-height: 1.6; }
.reply b { font-weight: 600; margin-right: 6px; } .reply-t { color: var(--sub); font-size: 11px; margin-left: 6px; }

/* ── 標題列：姓名 ＋ 頭像列 ＋ 愛心；浮層列「誰按了什麼」── */
.person summary .sp { flex: 1; }
.heart-wrap { position: relative; display: inline-flex; align-items: center; gap: 6px; }
.avs { display: inline-flex; align-items: center; cursor: pointer; }
.av { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 600; letter-spacing: 0; border: 2px solid #fff; margin-left: -6px; line-height: 1; }
.avs .av:first-child { margin-left: 0; }
.av.more { background: #d4d4d4; color: #444; }
.heart-pop { display: none; position: absolute; right: 0; top: 30px; z-index: 20; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 8px 10px; min-width: 180px; font-size: 13px; }
.heart-wrap:hover .heart-pop, .heart-wrap.open .heart-pop { display: block; }
.heart-wrap:hover .heart-pop:empty { display: none; }
.hp-kind { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
.hp-kind + .hp-kind { border-top: 1px solid #f0f0f0; }
.hp-g { font-size: 16px; }
.hp-who { display: inline-flex; align-items: center; gap: 5px; }
.hp-who .av { margin-left: 0; width: 20px; height: 20px; border: 0; }
.sent { font-size: 11px; color: #a3a3a3; text-align: right; margin-top: 8px; }
/* ── 標題列的愛心（低調；長按選單）── */
.heart { border: 0; background: none; color: #c4c4c4; font-size: 14px; line-height: 1; padding: 2px 6px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.heart:hover { color: var(--red); background: #fef2f2; }
.heart.has { color: var(--red); } .heart.on { background: #fef2f2; }
.heart .n { font-size: 11px; color: var(--sub); font-variant-numeric: tabular-nums; }
.heart:disabled { cursor: default; }
.heart-menu { display: inline-flex; gap: 2px; border: 1px solid var(--line); border-radius: 999px; background: #fff; padding: 2px 4px; box-shadow: 0 6px 18px rgba(0,0,0,.12); margin-left: 4px; }
.heart-menu button { border: 0; background: none; font-size: 16px; padding: 2px 6px; border-radius: 999px; cursor: pointer; }
.heart-menu button:hover { background: #f5f5f5; }
.vrow2 { display: inline-flex; gap: 10px; align-items: center; }

/* ── 心情列（讚／愛心／笑）── */
.react { display: flex; gap: 6px; margin: 4px 0 2px; }
.react-btn { border: 1px solid var(--line); background: #fff; border-radius: 999px; min-height: 24px; padding: 0 8px; font-size: 12px; color: var(--sub); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.react-btn:hover { border-color: var(--ink); color: var(--ink); }
.react-btn.on { background: #fef2f2; border-color: #fecaca; color: var(--red); }
.react-btn:disabled { cursor: default; }
.react-btn .n { font-variant-numeric: tabular-nums; }

/* ── 大家的回顧（每人一列 details，預設全開）── */
.person { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; }
.person summary { list-style: none; cursor: pointer; padding: 10px 12px; display: flex; gap: 8px; align-items: center; font-size: 13px; }
.person summary .sub-x { flex: 1; min-width: 0; color: var(--sub); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person summary .count { flex: none; }
.person summary::-webkit-details-marker { display: none; }
.person summary b { font-weight: 600; }
.person summary .pill-st { color: var(--sub); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; font-size: 11px; line-height: 17px; }
.person[open] summary { background: var(--soft); border-bottom: 1px solid #f0f0f0; }
.person .body { padding: 2px 12px 10px; font-size: 13px; }
.person .body .blk h4 { margin: 10px 0 4px; font-size: 12px; color: var(--sub); font-weight: 600; }
.tools-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

/* ── 團隊週誌牆（學習庫／依人回溯的人卡仍用）── */
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding-top: 10px; }
.p-card { border: 1px solid var(--line); border-radius: 2px; padding: 16px 18px 14px; min-width: 0; }
.p-name { font-size: 13px; font-weight: 500; letter-spacing: 0.08em; border-bottom: 1px solid #f5f5f5; padding-bottom: 8px; }
.p-card .blk h4 { margin-top: 12px; }

/* ── 學習庫 ── */
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 6px; }
.filter-bar input, .filter-bar select {
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
    font-size: 13px; font-family: inherit; color: var(--ink); background: #fff;
    outline: none; transition: border-color .15s;
}
.filter-bar input { flex: 1; min-width: 180px; }
.filter-bar input:focus, .filter-bar select:focus { border-color: var(--red); }
.learn-item { padding: 13px 0; border-bottom: 1px solid #f5f5f5; }
.learn-item:last-of-type { border-bottom: none; }
.learn-item .lc { font-size: 13px; line-height: 1.7; overflow-wrap: break-word; }
.learn-item .lm { font-size: 11px; color: var(--sub); margin-top: 4px; letter-spacing: 0.05em; }
.more-row { text-align: center; padding-top: 14px; }

/* ── 依人回溯 ── */
.timeline-card { border: 1px solid var(--line); border-radius: 2px; padding: 16px 18px 14px; margin-top: 12px; }
.timeline-card .p-name { font-variant-numeric: tabular-nums; }

footer { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; }
footer .eyebrow { font-size: 10px; }

@media (max-width: 640px) {
    main { padding-top: 92px; }
    .brand-name { display: none; }
    .wall { grid-template-columns: 1fr; }
    .btn-save { width: 100%; }
    .weeknav { justify-content: center; }
    .wk-title { width: 100%; justify-content: center; order: -1; }
    .filter-bar select { width: 100%; }
    .em input.em-proj { width: 100%; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="brand" href="/my.html" title="回個人工作台">
      <img src="/img/originsun-logo.webp" alt="源日影像" style="height:34px;width:auto;display:block;">
      <span class="brand-name">上週回顧 <span class="accent">REVIEW</span></span>
    </a>
    <a class="btn-ghost" href="/my.html">個人工作台</a>
  </div>
</header>

<main>
  <!-- 載入中 -->
  <div id="loading-view" class="state-block">
    <div class="eyebrow">Loading</div>
    <div class="msg">載入中…</div>
  </div>

  <!-- 未登入 / 無權限 -->
  <div id="auth-view" class="gate-wrap" style="display:none;">
    <div class="gate-card">
      <div class="eyebrow">Sign in <span class="accent">Required</span></div>
      <h1>請先登入個人工作台</h1>
      <div class="sub">每週回顧需要登入後使用。請先在個人工作台完成登入，再回到本頁即可。</div>
      <a class="btn-primary" href="/my.html">前往個人工作台</a>
    </div>
  </div>

  <!-- 伺服器暫時無法連線 -->
  <div id="error-view" class="state-block" style="display:none;">
    <div class="eyebrow">Connection <span class="accent">Error</span></div>
    <div class="msg" id="error-msg">伺服器暫時無法連線，請稍後再試</div>
  </div>

  <!-- 主內容 -->
  <div id="app-view" style="display:none;">
    <div class="hero">
      <div class="eyebrow">Weekly Review <span class="accent">上週回顧</span></div>
      <h1>每週一，寫上週回顧</h1>
      <!-- 文字由 journal-core SUBTITLE 覆寫（BLOCKS 導出）— 這裡只是 JS 前的佔位 -->
      <div class="sub" id="hero-sub">每週四問。一行一條，週一起算。</div>
    </div>

    <!-- owner 2026-07-24：三檢視切換先隱藏（只留回顧）。學習庫/依人回溯的程式碼
         保留，要恢復把 style="display:none" 拿掉即可 -->
    <div class="pill-row" style="display:none;">
      <button class="pill-btn on" type="button" data-view="week">回顧</button>
      <button class="pill-btn" type="button" data-view="learn">學習庫</button>
      <button class="pill-btn" type="button" data-view="person">依人回溯</button>
    </div>

    <div id="view"></div>
  </div>
</main>

<footer><div class="eyebrow">© Originsun Studio · Internal</div></footer>

<script type="module">
import { BLOCKS, FLAGS, FLAGGABLE, HINT_EDIT_WINDOW, MSG_EDIT_WINDOW, SUBTITLE, api, debounce, ensurePasteBase,
         entriesOf, entryBlock, entryTable, esc, isAuthFail, itemsToLines, linesToItems, pasteThumbs, personCard,
         heartHtml, REACTIONS, reactionBar, renderRich, repliesFor, replyHtml, shiftWeek, thisWeekStart, tokenGrants, weekRange, worklogHtml } from '/js/shared/journal-core.js';
import { initPasteImage } from '/js/shared/paste-image.js';
import { attachProjectPop } from '/js/shared/project-pop.js';

initPasteImage();   // 四問 textarea 可直接貼圖（截圖 → 上傳圖床 → 插 token）

const $ = (id) => document.getElementById(id);

const _embedParam = new URLSearchParams(location.search).get('embed');

// 把內容高度回傳給父視窗（/my.html 工作台），讓外框自動長高、免內部捲軸。
// ⚠ 另一份同樣的 embed 協定在 showcase-edit.html（宿主 tabs/proposals/delivery-view.js）——
//    鐵則：量「內容元素」不要量 body/documentElement（會被 iframe 視窗高度撐著→無限長高），
//    且 embed 內不可用 vh。改任一份記得看另一份。
let _lastH = -1;
function postHeight() {
    if (!EMBED) return;
    try {
        const m = document.querySelector('main');
        const h = m ? Math.ceil(m.getBoundingClientRect().height) + 8 : 0;
        if (h <= 0 || h === _lastH) return;      // 去重：RO 每次觸發都發訊會造成跨框訊息風暴
        _lastH = h;
        window.parent?.postMessage({ type: 'journal-embed-height', height: h }, '*');
    } catch (_) {}
}

if (EMBED) {
    document.documentElement.classList.add('embed-mode');
    // 在偵測當下就掛（不是等 boot 成功）— 載入中/未登入/連線錯誤三種畫面也要能回報高度
    const _m = document.querySelector('main');
    if (window.ResizeObserver && _m) new ResizeObserver(postHeight).observe(_m);
}

async function loadWeek() {

    const [mr, wr] = await Promise.all([api.mine(weekStart), api.week(weekStart)]);

    return lines.map((line, i) => {

        return `<div class="em"><span class="em-t" title="${esc(line)}">${esc(line.replace(/!\[[^\]]*\]\(paste:[^)]*\)/g, '[圖]'))}</span>

function teamCardHtml() {

function renderWeek(m, week) {
    mine = m; weekData = week;
    savedAt = ''; dirty = false;
    meta = {};
    for (const [k] of BLOCKS) meta[k] = entriesOf(mine, k).map(e => ({ project_id: e.project_id || '', project_name: e.project_name || projName(e.project_id) || '', flag: e.flag || '' }));

            <div class="save-row">

                    ? `<button class="btn-save" type="button" id="btn-submit">${mine.status === 'submitted' ? '再送出' : '送出'}</button><span class="save-msg" id="save-msg"></span><span class="hint">打字就自動存草稿（只有自己看得到）；按送出才進大家的回顧與學習庫。</span>`

    $('wk-prev').onclick = () => { weekStart = shiftWeek(weekStart, -1); loadWeek(); };

// ── 草稿自動存（1.5 秒 debounce PUT，status=draft）→ 送出 ──
function draftBody() {
    const body = { status: 'draft' };
    for (const [k] of BLOCKS) {
        const lines = linesToItems($('ta-' + k)?.value ?? itemsToLines(mine[k]));
        body[k] = lines.map((c, i) => ({ content: c, project_id: (meta[k]?.[i] || {}).project_id || '', flag: (meta[k]?.[i] || {}).flag || '' }));
    }
    return body;
}
async function saveDraft() {
    if (!mine || !mine.editable) return false;
    const r = await api.saveMine(weekStart, draftBody());
    if (!r.ok) {
        const d = r.json ? await r.json().catch(() => ({})) : {};
        flash(r.status === 403 ? MSG_EDIT_WINDOW : r.status === 401 ? '登入已過期，請重新登入' : r.status === 0 ? NET_ERR : (d.detail || `儲存失敗（${r.status}）`), true);
        return false;
    }
    const d = await r.json();
    // 只更新條目 id／狀態（回覆對得上），不重畫 textarea（正在打字）
    mine = { ...mine, ...d, editable: mine.editable };
    if (mine.status !== 'submitted') mine.status = 'draft';
    savedAt = nowHHMM(); dirty = false;
    refreshState();
    return true;
}
const scheduleDraft = debounce(() => { saveDraft(); }, 1500);
function markDirty() { dirty = true; refreshState(); scheduleDraft(); }

function flash(text, isErr) {
    const m = $('save-msg');
    if (!m) return;
    m.textContent = text;
    m.classList.toggle('err', !!isErr);
    m.style.opacity = '1';
    if (!isErr) setTimeout(() => { m.style.opacity = '0'; }, 2200);   // 幾秒後淡出（CSS transition）
}

async function submitMine() {
    const btn = $('btn-submit');
    btn.disabled = true;
    try {
        if (!(await saveDraft())) return;
        const r = await api.submitMine(weekStart);
        if (!r.ok) {
            const d = r.json ? await r.json().catch(() => ({})) : {};
            flash(r.status === 403 ? MSG_EDIT_WINDOW : r.status === 0 ? NET_ERR : (d.detail || `送出失敗（${r.status}）`), true);
            return;
        }
        const d = await r.json();
        mine.status = 'submitted'; mine.submitted_at = d.submitted_at || new Date().toISOString();
        dirty = false;
        refreshState();
        flash('已送出');
        await refreshTeam();
    } finally { btn.disabled = false; }
}
async function refreshTeam() {
    const wr = await api.week(weekStart);
    if (!wr.ok) return;
    weekData = await wr.json();
    const card = $('team-card');
    if (card) { card.innerHTML = teamCardHtml(); wireTeam(); }
}

// 委派：掛案子（浮層選到 / 手打）、旗標、帶入、回覆 —— #view 不會被換掉，掛一次就好
attachProjectPop($('view'), { options: () => api.projectOptions(), value: (p) => p.name || p.label || '' });
$('view').addEventListener('change', (ev) => {
    const proj = ev.target.closest('input.em-proj');
    if (proj) {
        const m = meta[proj.dataset.k]?.[Number(proj.dataset.i)];
        if (m) {
            const t = proj.value.trim();
            const hit = (proj.dataset.pid && t === proj.dataset.pname) ? { id: proj.dataset.pid, name: t } : (projOpts || []).find(p => p.id && (p.name === t || p.label === t));
            m.project_id = hit ? hit.id : ''; m.project_name = hit ? hit.name : t;
            markDirty();
        }
        return;
    }
    const flag = ev.target.closest('select.em-flag');
    if (flag) {
        const m = meta[flag.dataset.k]?.[Number(flag.dataset.i)];
        if (m) { m.flag = flag.value; markDirty(); }
        return;
    }
    const pick = ev.target.closest('input[data-pick]');
    if (pick) {
        const ta = $('ta-wins');
        if (!ta || ta.disabled) return;
        const line = pick.dataset.pick;
        const lines = linesToItems(ta.value);
        const has = lines.includes(line);
        if (pick.checked && !has) lines.push(line);
        if (!pick.checked && has) lines.splice(lines.indexOf(line), 1);
        ta.value = itemsToLines(lines);
        ta.dispatchEvent(new Event('input', { bubbles: true }));
    }
});
// 標題列的愛心：點一下＝愛心（已按過＝取消）；長按 450ms 或右鍵＝選讚／愛心／笑
let _pressTimer = null, _pressed = false;
function heartMenu(btn) {
    document.querySelectorAll('.heart-menu').forEach(m => m.remove());
    const menu = document.createElement('div');
    menu.className = 'heart-menu';
    menu.innerHTML = REACTIONS.map(([k, g]) => `<button type="button" data-heart-kind="${k}">${g}</button>`).join('');
    btn.insertAdjacentElement('afterend', menu);
    const close = (e) => { if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('pointerdown', close, true); } };
    setTimeout(() => document.addEventListener('pointerdown', close, true), 0);
}
async function sendHeart(btn, kind) {
    btn.disabled = true;
    const r = await api.react({ journal_id: btn.dataset.heartJ, entry_table: btn.dataset.heartT || 'work_journals', entry_id: btn.dataset.heartE || btn.dataset.heartJ, kind });
    btn.disabled = false;
    if (!r.ok) { const d = r.json ? await r.json().catch(() => ({})) : {}; alert(d.detail || `沒送出（${r.status || '連線失敗'}）`); return; }
    const d = await r.json();
    const wrap = btn.closest('.heart-wrap');   // 整組換掉（頭像列＋愛心＋浮層）；只換按鈕會把新的一組塞進舊的裡面，連按就一直長頭像
    (wrap || btn).outerHTML = heartHtml(d.reactions, { journalId: btn.dataset.heartJ }, true);
}
$('view').addEventListener('pointerdown', (ev) => {
    const b = ev.target.closest('button[data-heart]'); if (!b) return;
    _pressed = false;
    _pressTimer = setTimeout(() => { _pressed = true; heartMenu(b); }, 450);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => $('view').addEventListener(t, () => { clearTimeout(_pressTimer); }, true));
$('view').addEventListener('click', (ev) => {
    const avs = ev.target.closest('[data-heart-pop]');
    if (!avs) { document.querySelectorAll('.heart-wrap.open').forEach(w => w.classList.remove('open')); return; }
    ev.preventDefault(); ev.stopPropagation();
    avs.closest('.heart-wrap').classList.toggle('open');
}, true);
$('view').addEventListener('contextmenu', (ev) => { const b = ev.target.closest('button[data-heart]'); if (b) { ev.preventDefault(); heartMenu(b); } });
$('view').addEventListener('click', async (ev) => {
    const pick = ev.target.closest('button[data-heart-kind]');
    if (pick) {
        ev.preventDefault(); ev.stopPropagation();
        const menu = pick.closest('.heart-menu'), btn = menu && menu.previousElementSibling;
        menu.remove();
        if (btn && btn.dataset.heart !== undefined) await sendHeart(btn, pick.dataset.heartKind);
        return;
    }
    const b = ev.target.closest('button[data-heart]'); if (!b) return;
    ev.preventDefault(); ev.stopPropagation();          // 別把 details 收起來
    if (_pressed) { _pressed = false; return; }         // 長按已開選單
    await sendHeart(b, b.classList.contains('on') ? ((b.textContent.trim().startsWith('\u{1F44D}') ? 'like' : b.textContent.trim().startsWith('\u{1F602}') ? 'laugh' : 'love')) : 'love');
});

async function fetchPeople() {
    if (people) return people;
    const r = await api.people();

    people = r.ok ? ((await r.json()).people || []) : [];
    return people;
}

    v.innerHTML = `
        <div class="card">
            <div class="card-head"><span class="eyebrow">Learnings <span class="accent">學習庫</span></span></div>
            <div class="filter-bar">
                <input type="text" id="l-q" placeholder="搜尋學習內容" value="${esc(learn.q)}">
                <select id="l-user">
                    <option value="">全部人員</option>
                    ${people.map(p => `<option value="${esc(p.username)}"${p.username === learn.username ? ' selected' : ''}>${esc(p.display_name || p.username)}</option>`).join('')}
                </select>
            </div>
            <div id="learn-list"><div class="empty">載入中…</div></div>
        </div>`;
    $('l-q').oninput = debounce((ev) => {
        learn.q = ev.target.value.trim(); learn.offset = 0; refreshLearn(false);
    }, 350);
    $('l-user').onchange = (ev) => { learn.username = ev.target.value; learn.offset = 0; refreshLearn(false); };
    await refreshLearn(false);
}

const learnItemHtml = (it) => `
        <div class="learn-item">
            <div class="lc">${renderRich(it.content)}</div>
            <div class="lm">${esc(it.display_name || it.username)} · ${weekRange(it.week_start)}</div>
        </div>`;

async function refreshLearn(append) {
    // 空值由 api.learnings 剔除 — state 直接丟
    const r = await api.learnings({ q: learn.q, username: learn.username,
                                    limit: learn.limit, offset: learn.offset });
    const list = $('learn-list');
    if (!list) return;               // 使用者已切到別的檢視
    if (authFail(r)) return;
    if (!r.ok) { list.innerHTML = `<div class="empty">${failMsg(r)}</div>`; return; }
    const d = await r.json();
    const fresh = d.items || [];
    learn.items = append ? learn.items.concat(fresh) : fresh;
    learn.total = d.total ?? learn.items.length;
    if (!learn.items.length) { list.innerHTML = '<div class="empty">還沒有累積的學習紀錄</div>'; return; }
    const moreRow = learn.items.length < learn.total
        ? '<div class="more-row"><button class="wk-btn" type="button" id="l-more">載入更多</button></div>' : '';
    if (append) {
        // 只補新的 20 條，不重建整串（載入更多 O(n²) 重繪防線）
        $('l-more')?.closest('.more-row')?.remove();
        list.insertAdjacentHTML('beforeend', fresh.map(learnItemHtml).join('') + moreRow);
    } else {
        list.innerHTML = learn.items.map(learnItemHtml).join('') + moreRow;
    }
    const more = $('l-more');
    if (more) more.onclick = () => { learn.offset += learn.limit; refreshLearn(true); };
}

// ── 檢視 3：依人回溯 ────────────────────────────────────────────────────
async function loadPerson() {
    const v = $('view');
    v.innerHTML = '<div class="empty">載入中…</div>';
    if (await fetchPeople() === null) return;
    v.innerHTML = `
        <div class="card">
            <div class="card-head"><span class="eyebrow">By Person <span class="accent">依人回溯</span></span></div>
            <div class="filter-bar">
                <select id="p-user">
                    <option value="">請選擇人員</option>
                    ${people.map(p => `<option value="${esc(p.username)}"${p.username === personSel ? ' selected' : ''}>${esc(p.display_name || p.username)}（${p.weeks} 週）</option>`).join('')}
                </select>
            </div>
            <div id="person-list"><div class="empty">請先選擇人員</div></div>
        </div>`;
    $('p-user').onchange = (ev) => { personSel = ev.target.value; refreshPerson(); };
    if (personSel) await refreshPerson();
}

async function refreshPerson() {
    const list = $('person-list');
    if (!list) return;
    if (!personSel) { list.innerHTML = '<div class="empty">請先選擇人員</div>'; return; }
    list.innerHTML = '<div class="empty">載入中…</div>';
    const r = await api.person(personSel);
    if (!list.isConnected) return;
    if (authFail(r)) return;
    if (!r.ok) { list.innerHTML = `<div class="empty">${failMsg(r)}</div>`; return; }
    const journals = (await r.json()).journals || [];
    if (!journals.length) { list.innerHTML = '<div class="empty">此人還沒有回顧</div>'; return; }
    list.innerHTML = journals.map(j =>
        personCard(j, weekRange(j.week_start), { ...CARD_CLS, card: 'timeline-card', pillFlag: 'pill-flag', pillProj: 'pill-proj', reply: 'reply', replyTime: 'reply-t' }, { projectName: projName })).join('');
}

// ── boot：mine+week 並行首載（mine 兼權限判定：401/403 → 登入提示卡；
//    status 0 = 網路錯 → 連線錯誤卡）──
(async function boot() {
    const [mr, wr] = await Promise.all(
        [api.mine(weekStart), api.week(weekStart), ensurePasteBase()]);   // 圖床基底一併預取
    if (mr.status === 401 || mr.status === 403) { showTop('auth-view'); return; }
    if (mr.status === 0) { showError(); return; }
    if (!mr.ok || !wr.ok) { showError(failMsg(mr.ok ? wr : mr)); return; }
    const m = await mr.json(), week = await wr.json();
    showTop('app-view');
    renderWeek(m, week);
})();
</script>
