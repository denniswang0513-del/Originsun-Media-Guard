<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示範｜報價單 PDF 版面（簡練版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#111; --bar:#1f1f1f; --line:#3a3a3a; --ink:#e0e0e0; --sub:#9ca3af; --pri:#3b82f6; --warn:#fbbf24; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "Noto Sans TC","Microsoft JhengHei",sans-serif; }

  /* ── 示範外殼（列印時隱藏） ── */
  .shell { position:sticky; top:0; z-index:5; background:var(--bar); border-bottom:1px solid var(--line); padding:10px 18px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .shell .tag { background:#3a2a00; color:var(--warn); border:1px solid #6b4f00; border-radius:4px; padding:2px 8px; font-size:12px; }
  .shell b { font-weight:600; }
  .shell .sp { flex:1; }
  .shell a { color:#93c5fd; font-size:13px; }
  .shell label { display:flex; align-items:center; gap:6px; color:var(--sub); font-size:13px; cursor:pointer; }
  .shell button { background:var(--pri); color:#fff; border:0; border-radius:6px; padding:7px 14px; font-size:13px; cursor:pointer; }
  .shell button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); }
  .notes { max-width:820px; margin:16px auto 0; padding:0 18px; color:var(--sub); font-size:13px; }
  .notes li { margin:3px 0; }
  .notes code { color:#93c5fd; background:#1e293b; padding:1px 5px; border-radius:3px; }

  /* ── A4 紙 ──
     結構：每個「功能區塊」＝左欄小標（基本資料／報價項目／金額／付款方式／條款／匯款資訊／簽署）＋右欄內容，
     區塊之間只用一條灰線分隔。字級三檔（7.5 標籤 / 9 內文 / 13 總額），黑線只留給總額。 */
  .paper { --k:#111; --mute:#7a7a7a; --hair:#e0e0e0; --gut:64px;
    width:210mm; min-height:297mm; margin:18px auto 40px; background:#fff; color:var(--k); padding:14mm 16mm 12mm;
    box-shadow:0 8px 40px rgba(0,0,0,.6); font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:9pt; line-height:1.45;
    font-variant-numeric:tabular-nums; display:flex; flex-direction:column; }
  .lab { font-size:7.5pt; color:var(--mute); letter-spacing:.04em; }

  /* 抬頭：一行解決。左＝報價單 + 版本，右＝logo + 公司名 */
  .hd { display:flex; justify-content:space-between; align-items:center; padding-bottom:12px; }
  .hd .t { display:flex; align-items:baseline; gap:10px; }
  .hd h1 { margin:0; font-size:13pt; font-weight:500; letter-spacing:.16em; }
  .hd .brand { display:flex; align-items:center; gap:8px; }
  .hd .brand img { height:26px; }
  .hd .brand .co { font-size:8.5pt; font-weight:500; line-height:1.25; }
  .hd .brand .co .lab { display:block; letter-spacing:.1em; }

  /* 功能區塊 */
  .blk { display:grid; grid-template-columns:var(--gut) 1fr; gap:0 16px; padding:8px 0; border-top:1px solid var(--hair); }
  .blk > .bl { padding-top:2px; }
  .blk.last { border-bottom:1px solid var(--hair); }

  .meta { display:grid; grid-template-columns:1.6fr 2.4fr 1fr 1.15fr; gap:16px; }
  .meta .val { white-space:nowrap; }
  .meta .val { font-weight:500; margin-top:1px; }
  .meta .val small { font-size:7.5pt; color:var(--mute); font-weight:400; margin-left:4px; }

  table.q { width:100%; border-collapse:collapse; margin-top:-2px; }
  table.q th { font-size:7.5pt; color:var(--mute); font-weight:400; letter-spacing:.04em; text-align:right; padding:0 0 5px 8px; border-bottom:1px solid var(--hair); }
  table.q th.l { text-align:left; padding-left:0; }
  table.q td { padding:1.5px 0 1.5px 8px; border-bottom:1px solid var(--hair); vertical-align:top; }
  table.q td.num { text-align:right; white-space:nowrap; }
  table.q td.c { text-align:right; white-space:nowrap; color:#555; }
  table.q td.desc { word-break:break-word; padding-left:10px; }
  table.q td.desc .note { color:var(--mute); font-size:7.5pt; margin-left:6px; }
  table.q tr.grp td { padding-top:6px; padding-bottom:1px; border-bottom:0; }
  table.q tr.grp td.name { font-weight:700; padding-left:0; }
  table.q tr.grp td.mute { font-size:7.5pt; color:var(--mute); text-align:right; padding-top:8px; }
  table.q tr.grp td.num { font-weight:500; }
  table.q tr:last-child td { border-bottom:0; }
  col.desc { width:auto; } col.qty { width:40px; } col.unit { width:44px; } col.price { width:78px; } col.amt { width:96px; }

  .sum { display:flex; justify-content:flex-end; }
  .sum > div { width:216px; }
  .sum .row { display:flex; justify-content:space-between; padding:2px 0; }
  .sum .row .l { color:var(--mute); }
  .sum .grand { display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid var(--k); margin-top:4px; padding-top:6px; }
  .sum .grand .l { font-weight:500; }
  .sum .grand .l small { font-size:7.5pt; color:var(--mute); font-weight:400; margin-left:6px; }
  .sum .grand .v { font-size:13pt; font-weight:700; }

  .stages { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  .stages .cell .v { margin-top:1px; font-weight:500; }
  .stages .cell .v small { font-size:9pt; color:var(--mute); font-weight:400; margin-left:6px; }

  .terms p { margin:0; white-space:pre-line; }
  .terms p + p { margin-top:4px; }
  .bank { display:grid; grid-template-columns:auto auto auto auto; gap:0 20px; }
  .bank span .lab { margin-right:6px; }

  .sign { display:grid; grid-template-columns:1fr 1fr; gap:24px; padding-top:28px; }
  .sign .line { position:relative; border-top:1px solid var(--k); padding-top:4px; }
  .sign .line .stamp { position:absolute; left:50%; transform:translateX(-50%); bottom:2px; }
  .seal { width:70px; height:70px; border:2px solid #c0392b; border-radius:50%; color:#c0392b; font-size:6.5pt; line-height:1.25; display:flex; align-items:center; justify-content:center; text-align:center; opacity:.8; transform:rotate(-6deg); }

  .pfoot { display:flex; justify-content:space-between; margin-top:auto; padding-top:6px; font-size:7pt; color:var(--mute); letter-spacing:.04em; }

  @media print {
    body { background:#fff; }
    .shell, .notes { display:none !important; }
    .paper { width:auto; min-height:auto; margin:0; padding:0; box-shadow:none; }
    @page { size:A4 portrait; margin:9mm 16mm 7mm; }
    table.q tr { page-break-inside:avoid; }
  }
</style>
</head>
<body>

<div class="shell">
  <span class="tag">示範</span>
  <b>報價單 PDF 版面（簡練版）</b>
  <a href="./quotation-pdf-classic.html">看經典版</a>
  <span class="sp"></span>
  <label><input type="checkbox" id="opt-stages" checked> 印付款階段（有填才印）</label>
  <label><input type="checkbox" id="opt-discount"> 示範稅前折扣列</label>
  <button class="ghost" onclick="toggleSeal()">章：佔位 / 隱藏</button>
  <button onclick="window.print()">列印 / 存成 PDF</button>
</div>

<div class="paper" id="paper"></div>

<ul class="notes">
  <li>整張用「功能區塊」組織：左欄小標＝基本資料／報價項目／金額／付款方式／條款／匯款資訊／簽署，右欄內容，區塊間一條灰線。</li>
  <li>金額規則不變：<b>專案優惠</b>＝含稅總計 − <code>final_price</code>；贈項＝單價 0 加原價小字；有效期同時印天數與到期日。</li>
  <li>抬頭、logo、匯款資訊、交檔條款、章：從 <code>company</code> 設定區塊帶；<code>terms</code> 只放這張案子的備註。</li>
</ul>

<script>
// ── 對應後端 _to_quotation_dict 的形狀（金額全是整數 NT$） ──
const quotation = {
  id: 31, version: 1, status: "已簽核",
  project_name: "和平行動者系列影片",
  client_name: "龍應台文化基金會",
  quote_date: "2025-07-15", valid_until: null,   // 空 → 預設 +14 天
  tax_rate: 5, discount: 0,
  final_price: 840000,
  payment_stages: [{label:"簽約", pct:30}, {label:"拍攝完成", pct:40}, {label:"交片", pct:30}],
  terms: "1. 拍攝次數規劃 9 次，若超過 9 次，每人次 12,000。",
  items: [
    g("拍攝與前期製作", [
      ["專案管理", 1, "套", 15000],
      ["導演與企劃", 1, "式", 50000],
      ["攝影師(含器材)", 9, "人次", 12000],
      ["行政雜支(臺北市外交通與住宿實報實銷，或由主辦單位安排)", 9, "人次", 1200],
    ]),
    g("後期製作(前導影片 2 支)", [
      ["活動前導短片 2 min 內 (含剪輯、調光、動態字卡)", 1, "支", 28000],
      ["Fellow 行動紀錄影像播放 5 min 內 (含剪輯、調光、動態字卡)", 1, "支", 28000],
    ]),
    g("後期製作(和平論壇 3 支 60 分鐘)", [
      ["動態視覺包裝", 1, "式", 18000],
      ["完整版(60 min 講座)_(剪輯、文案、插入 PPT、切 AB 機、平台上架)", 3, "支", 35000],
      ["中英字幕製作", 180, "分鐘", 320],
    ]),
    g("後期製作(Fellow 個人影音 6 支 45 分鐘)", [
      ["動態視覺包裝", 1, "式", 18000],
      ["Fellow 個人影音(45 min)_順剪(剪輯、文案、插入 PPT、切 AB 機、平台上架)", 6, "支", 35000],
      ["中英字幕製作", 270, "分鐘", 320],
    ]),
    g("後期製作(花絮與 2026 宣傳片)", [
      ["2026 宣傳短片剪輯與後期製作(90 秒內)", 1, "支", 28000],
      ["2025 和平計畫花絮剪輯與後期製作(5 min 內)", 1, "支", 28000],
    ]),
    g("後期製作(其他)", [
      ["音樂版權", 1, "套", 12000],
    ]),
    g("贈項", [
      ["逐字稿、原始檔", 1, "套", 0, "原價 10,000"],
    ]),
  ].flat(),
};
function g(group, rows) {
  return rows.map(([description, quantity, unit, unit_price, note], i) =>
    ({ group_name: group, sort_order: i, description, quantity, unit, unit_price, amount: quantity * unit_price, note: note || "" }));
}

// ── 新的 company 設定區塊（設定頁可編，全站共用） ──
const company = {
  name: "源日有限公司", name_en: "ORIGINSUN STUDIO", logo: "../img/originsun-logo.webp",
  tax_id: "90371657",
  bank: "012 台北富邦 中山分行", account_name: "源日有限公司", account_no: "82120000062728",
  quote_valid_days: 14,
  delivery_terms: "完成檔以雲端儲存連結交檔。若須 DVD、USB、硬碟，與任何實體儲存裝置交檔，實報實銷。",
  seal: null,   // 之後放去背 PNG 的路徑
};

const nt = n => "NT$" + Math.round(n).toLocaleString("en-US");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ymd = d => `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
let sealMode = "placeholder";
const blk = (label, html, cls = "") => `<div class="blk ${cls}"><div class="bl lab">${label}</div><div>${html}</div></div>`;

function render() {
  const q = quotation, showStages = document.getElementById("opt-stages").checked;
  const demoDiscount = document.getElementById("opt-discount").checked ? 10000 : 0;

  // 金額鏈（跟後端 _calc_quotation 一樣：稅前折扣 → 稅 → 含稅總計；專案優惠是 total − final_price）
  const subtotal = q.items.reduce((s, it) => s + it.amount, 0);
  const taxable = Math.max(subtotal - demoDiscount, 0);
  const tax = Math.floor(taxable * q.tax_rate / 100);
  const total = taxable + tax;
  const promo = q.final_price != null && q.final_price < total ? total - q.final_price : 0;
  const finalPrice = q.final_price ?? total;

  const qd = new Date(q.quote_date);
  const vu = q.valid_until ? new Date(q.valid_until) : new Date(qd.getTime() + company.quote_valid_days * 864e5);
  const validDays = Math.round((vu - qd) / 864e5);

  const groups = [];
  for (const it of q.items) {
    let grp = groups[groups.length - 1];
    if (!grp || grp.name !== it.group_name) groups.push(grp = { name: it.group_name, rows: [] });
    grp.rows.push(it);
  }
  const body = groups.map(grp => {
    const sub = grp.rows.reduce((s, r) => s + r.amount, 0);
    return `
    <tr class="grp"><td class="name" colspan="3">${esc(grp.name)}</td><td class="mute">小結</td><td class="num">${nt(sub)}</td></tr>
    ${grp.rows.map(it => `
      <tr>
        <td class="desc">${esc(it.description)}${it.note ? `<span class="note">${esc(it.note)}</span>` : ""}</td>
        <td class="c">${it.quantity}</td><td class="c">${esc(it.unit)}</td>
        <td class="num">${nt(it.unit_price)}</td><td class="num">${nt(it.amount)}</td>
      </tr>`).join("")}`;
  }).join("");

  const row = (l, v) => `<div class="row"><span class="l">${l}</span><span>${v}</span></div>`;
  const seal = sealMode === "placeholder"
    ? `<div class="seal">源日有限公司<br>統一發票專用章<br>統一編號<br>${company.tax_id}</div>`
    : (company.seal ? `<img src="${company.seal}" style="height:70px">` : "");

  const blocks = [
    blk("基本資料", `<div class="meta">
      <div><div class="lab">客戶</div><div class="val">${esc(q.client_name)}</div></div>
      <div><div class="lab">專案</div><div class="val">${esc(q.project_name)}</div></div>
      <div><div class="lab">報價日期</div><div class="val">${ymd(qd)}</div></div>
      <div><div class="lab">有效期限</div><div class="val">${ymd(vu)}<small>${validDays} 日</small></div></div>
    </div>`),
    blk("報價項目", `<table class="q">
      <colgroup><col class="desc"><col class="qty"><col class="unit"><col class="price"><col class="amt"></colgroup>
      <thead><tr><th class="l">項目</th><th>數量</th><th>單位</th><th>單價</th><th>金額</th></tr></thead>
      <tbody>${body}</tbody>
    </table>`),
    blk("金額", `<div class="sum"><div>
      ${row("合計", nt(subtotal))}
      ${demoDiscount ? row("折扣", "−" + nt(demoDiscount)) : ""}
      ${row(`營業稅 ${q.tax_rate}%`, nt(tax))}
      ${promo ? row("專案優惠", "−" + nt(promo)) : ""}
      <div class="grand"><span class="l">報價總額<small>含稅</small></span><span class="v">${nt(finalPrice)}</span></div>
    </div></div>`),
    showStages && q.payment_stages.length ? blk("付款方式", `<div class="stages">
      ${q.payment_stages.map((s, i) => `<div class="cell"><div class="lab">${i + 1}　${esc(s.label)}</div><div class="v">${s.pct}%<small>${nt(finalPrice * s.pct / 100)}</small></div></div>`).join("")}
    </div>`) : "",
    blk("條款", `<div class="terms"><p>${esc(q.terms)}</p><p>${esc(company.delivery_terms)}</p></div>`),
    blk("匯款資訊", `<div class="bank">
      <span><span class="lab">銀行</span>${esc(company.bank)}</span>
      <span><span class="lab">戶名</span>${esc(company.account_name)}</span>
      <span><span class="lab">帳號</span>${esc(company.account_no)}</span>
      <span><span class="lab">統編</span>${esc(company.tax_id)}</span>
    </div>`),
    blk("簽署", `<div class="sign">
      <div class="line"><div class="stamp">${seal}</div><span class="lab">源日有限公司</span></div>
      <div class="line"><span class="lab">${esc(q.client_name)}</span></div>
    </div>`, "last"),
  ].join("");

  document.getElementById("paper").innerHTML = `
    <div class="hd">
      <div class="t"><h1>報價單</h1><span class="lab">PROJECT ESTIMATE　v${q.version}</span></div>
      <div class="brand"><img src="${company.logo}" alt=""><div class="co">${esc(company.name)}<span class="lab">${esc(company.name_en)}</span></div></div>
    </div>
    ${blocks}
    <div class="pfoot"><span>${esc(company.name)}　統一編號 ${esc(company.tax_id)}</span><span>1 / 1</span></div>`;
}
function toggleSeal() { sealMode = sealMode === "placeholder" ? "none" : "placeholder"; render(); }
document.getElementById("opt-stages").addEventListener("change", render);
document.getElementById("opt-discount").addEventListener("change", render);
render();
</script>
</body>
</html>
