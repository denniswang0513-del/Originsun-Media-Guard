<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>示範｜報價單 PDF 版面（定稿方向）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#111; --bar:#1f1f1f; --line:#3a3a3a; --ink:#e0e0e0; --sub:#9ca3af; --pri:#3b82f6; --warn:#fbbf24; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "Noto Sans TC","Microsoft JhengHei",sans-serif; }

  /* ── 示範外殼（列印時隱藏） ── */
  .shell { position:sticky; top:0; z-index:5; background:var(--bar); border-bottom:1px solid var(--line); padding:10px 18px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .shell .tag { background:#3a2a00; color:var(--warn); border:1px solid #6b4f00; border-radius:4px; padding:2px 8px; font-size:12px; }
  .shell b { font-weight:600; }
  .shell .sp { flex:1; }
  .shell a { color:#93c5fd; font-size:13px; }
  .shell label { display:flex; align-items:center; gap:6px; color:var(--sub); font-size:13px; cursor:pointer; }
  .shell button { background:var(--pri); color:#fff; border:0; border-radius:6px; padding:7px 14px; font-size:13px; cursor:pointer; }
  .shell button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); }
  .notes { max-width:820px; margin:16px auto 0; padding:0 18px; color:var(--sub); font-size:13px; }
  .notes li { margin:3px 0; }
  .notes code { color:#93c5fd; background:#1e293b; padding:1px 5px; border-radius:3px; }

  /* ── A4 紙：照 estimate 範本 —— 上下品牌色帶、公司抬頭在左、日期在右、客戶／專案兩欄、紅表頭、右側結算 ── */
  .paper { --acc:#c9372c; --k:#1a1a1a; --mute:#767676; --hair:#d9d9d9; --soft:#f2f2f2;
    width:210mm; min-height:297mm; margin:18px auto 40px; background:#fff; color:var(--k); padding:0;
    box-shadow:0 8px 40px rgba(0,0,0,.6); font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:9.2pt; line-height:1.7;
    font-variant-numeric:tabular-nums; display:flex; flex-direction:column; }
  .bar { display:none; }
  .body { padding:14mm 16mm 12mm; display:flex; flex-direction:column; flex:1; }
  .lab { font-size:7.5pt; color:var(--mute); letter-spacing:.04em; }

  /* 抬頭：標題＋logo；公司資料在左、日期／版本在右（底線式） */
  .hd { display:flex; justify-content:space-between; align-items:flex-start; }
  .hd h1 { margin:0; font-size:17pt; font-weight:500; letter-spacing:.2em; line-height:1.1; }
  .hd h1 small { display:block; font-size:7.5pt; letter-spacing:.22em; color:var(--mute); font-weight:400; margin-top:4px; }
  .hd img { height:48px; }
  .hd .right { text-align:right; }
  .hd .right .date { margin-top:6px; font-size:9pt; color:#333; }
  .top { display:flex; justify-content:space-between; align-items:flex-end; margin-top:14px; }
  .co { line-height:1.8; }
  .co b { font-weight:700; font-size:10pt; }
  .co div { color:#333; }
  .stamps { width:190px; }
  .stamps .r { display:grid; grid-template-columns:64px 1fr; align-items:baseline; border-bottom:1px solid var(--k); padding:5px 0 3px; margin-top:6px; }
  .stamps .r .lab { font-weight:500; color:var(--k); font-size:7.5pt; }
  .stamps .r .v { text-align:right; font-weight:500; font-size:10pt; }

  /* 客戶／專案兩欄，標題底線 */
  /* 客戶與專案合成一塊：一個標題線，底下兩欄 kv */
  .parties { margin-top:22px; }
  .parties .cols { display:grid; grid-template-columns:1fr 1fr; gap:0 28px; }
  .parties h4 { margin:0 0 8px; font-size:7.5pt; letter-spacing:.08em; color:var(--k); font-weight:700; padding-bottom:3px; border-bottom:1px solid var(--hair); }
  .parties .kv { display:grid; grid-template-columns:60px 1fr; gap:2px 8px; line-height:1.8; align-content:start; }
  .parties .kv .k { color:var(--mute); }
  .parties .kv .v { color:#222; }
  .parties .kv .v.strong { font-weight:700; font-size:10pt; }
  .parties .spec span { display:block; }

  /* 明細表：紅表頭、分組列灰底、直線只在表頭下方 */
  table.q { width:100%; border-collapse:collapse; margin-top:18px; }
  table.q th { background:#e6e6e6; color:var(--k); font-size:8pt; font-weight:700; letter-spacing:.06em; text-align:right; padding:7px 8px; }
  table.q th.l { text-align:left; }
  table.q td { padding:5px 8px; font-size:9.2pt; border-bottom:1px solid var(--hair); vertical-align:top; }
  table.q td.num { text-align:right; white-space:nowrap; }
  table.q td.c { text-align:right; white-space:nowrap; color:#444; }
  table.q td.desc { word-break:break-word; }
  table.q td.desc .note { color:var(--mute); font-size:8pt; margin-left:6px; }
  table.q tr.grp td { background:#f4f4f4; padding:6px 8px; border-bottom:0; }
  table.q tr.grp td.name { font-weight:700; }
  table.q tr.grp td.mute { font-size:7.5pt; color:var(--mute); text-align:right; }
  table.q tr.grp td.num { font-weight:500; }
  col.desc { width:auto; } col.qty { width:52px; } col.unit { width:52px; } col.price { width:86px; } col.amt { width:100px; }

  /* 下半：左備註＋匯款，右結算（每列底線） */
  /* 結算靠右自成一塊；備註在它下面整寬一塊 */
  .lower { display:flex; justify-content:flex-end; margin-top:10px; }
  .lower .sum { width:78mm; }
  .remarks { margin-top:16px; padding-top:12px; border-top:1px solid var(--hair); }
  .lower h5, .remarks h5 { margin:0 0 6px; font-size:7.5pt; letter-spacing:.08em; color:var(--k); font-weight:700; }
  .remarks ol { margin:0; padding-left:16px; font-size:8.6pt; line-height:1.75; max-width:150mm; }
  .remarks ol li { padding-left:2px; }
  .remarks ol li::marker { color:var(--mute); }
  /* 匯款資訊：整寬一行 */
  .bank { display:flex; align-items:baseline; gap:20px; margin-top:12px; padding-top:8px; border-top:1px solid var(--hair); font-size:8.3pt; }
  .bank h5 { margin:0; }
  .bank span .lab { margin-right:5px; }
  .sum .row { display:grid; grid-template-columns:1fr 110px; align-items:baseline; border-bottom:1px solid var(--hair); padding:5px 8px 3px 0; }
  .sum .row .l { text-align:right; font-size:7.5pt; letter-spacing:.06em; color:#333; font-weight:500; }
  .sum .row .v { text-align:right; }
  .sum .grand { display:grid; grid-template-columns:1fr 130px; align-items:baseline; margin-top:6px; padding:8px 8px 0 0; }
  .sum .grand .l { text-align:right; font-size:10pt; font-weight:700; }
  .sum .grand .l small { font-size:7.5pt; color:var(--mute); font-weight:400; margin-left:6px; }
  .sum .grand .v { text-align:right; font-size:14pt; font-weight:700; }

  /* 簽章：整寬兩格，高度 23mm */
  .sign { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:auto; padding-top:18px; }
  .sign .blk { position:relative; height:26mm; border:1px solid var(--hair); }
  .sign .blk .lab { position:absolute; left:10px; top:7px; }
  .sign .blk .stamp { position:absolute; right:16px; bottom:8px; }
  .seal { width:74px; height:74px; border:2px solid #c0392b; border-radius:50%; color:#c0392b; font-size:6.5pt; line-height:1.25; display:flex; align-items:center; justify-content:center; text-align:center; opacity:.8; transform:rotate(-6deg); }
  .pfoot { display:flex; justify-content:space-between; gap:16px; margin-top:8px; font-size:7pt; color:var(--mute); line-height:1.6; }

  /* 跨頁規則：表頭每頁重複；結算、備註、匯款、簽章各自不拆頁；頁尾（公司資訊＋頁碼）由 PDF 產生器印在每一頁 */
  table.q thead { display:table-header-group; }
  .lower, .remarks, .bank, .sign { break-inside:avoid; page-break-inside:avoid; }
  @media print {
    body { background:#fff; }
    .shell, .notes, .pfoot { display:none !important; }
    .paper { width:auto; min-height:271mm; margin:0; box-shadow:none; }
    .body { padding:0; }
    @page { size:A4 portrait; margin:12mm 16mm 14mm; }
    table.q tr { page-break-inside:avoid; }
  }
</style>
</head>
<body>

<div class="shell">
  <span class="tag">示範</span>
  <b>報價單 PDF 版面（定稿方向）</b>
  <a href="./quotation-pdf-lean.html">上一版</a>
  <a href="./quotation-pdf-classic.html">經典版</a>
  <span class="sp"></span>
  <label>資料量 <select id="opt-data"><option value="short">精簡（5 項）</option><option value="full">完整（19 項，會跨頁）</option></select></label>
  <label><input type="checkbox" id="opt-stages" checked> 備註帶付款方式（有填才印）</label>
  <label><input type="checkbox" id="opt-discount"> 示範稅前折扣列</label>
  <button class="ghost" onclick="toggleSeal()">章：佔位 / 隱藏</button>
  <button onclick="window.print()">列印 / 存成 PDF</button>
</div>

<div class="paper" id="paper"></div>

<ul class="notes">
  <li>照 estimate 範本的骨架：上下品牌色帶、公司抬頭在左、日期／版本在右、客戶／專案兩欄、紅色表頭、右側逐列底線的結算、左側備註與匯款資訊。</li>
  <li>金額規則不變：<b>專案優惠</b>＝含稅總計 − <code>final_price</code>；贈項＝單價 0 加原價小字；有效期限在備註最後一行。</li>
  <li>公司地址／電話／Email、匯款資訊、章：從 <code>company</code> 設定區塊帶；客戶聯絡人與聯絡方式來自客戶資料表。</li>
</ul>

<script>
// ── 對應後端 _to_quotation_dict 的形狀（金額全是整數 NT$） ──
const quotation = {
  id: 31, version: 1, status: "已簽核",
  project_name: "和平行動者系列影片",
  spec: "前導短片 2 支、講座完整版 60 分 3 支、Fellow 個人影音 45 分 6 支、宣傳與花絮 2 支",
  client: { full_name: "財團法人龍應台文化基金會", contact_person: "王小姐", contact_method: "02-2345-6789　hello@civictaipei.org", tax_id: "12345678" },
  quote_date: "2025-07-15", valid_until: null,   // 空 → 預設 +14 天
  tax_rate: 5, discount: 0,
  final_price: 840000,
  payment_stages: [{label:"簽約", pct:30}, {label:"拍攝完成", pct:40}, {label:"交片", pct:30}],
  terms: "拍攝次數規劃 9 次，若超過 9 次，每人次 12,000。",
  items: [
    g("拍攝與前期製作", [
      ["專案管理", 1, "套", 15000],
      ["導演與企劃", 1, "式", 50000],
      ["攝影師(含器材)", 9, "人次", 12000],
      ["行政雜支(臺北市外交通與住宿實報實銷，或由主辦單位安排)", 9, "人次", 1200],
    ]),
    g("後期製作(前導影片 2 支)", [
      ["活動前導短片 2 min 內 (含剪輯、調光、動態字卡)", 1, "支", 28000],
      ["Fellow 行動紀錄影像播放 5 min 內 (含剪輯、調光、動態字卡)", 1, "支", 28000],
    ]),
    g("後期製作(和平論壇 3 支 60 分鐘)", [
      ["動態視覺包裝", 1, "式", 18000],
      ["完整版(60 min 講座)_(剪輯、文案、插入 PPT、切 AB 機、平台上架)", 3, "支", 35000],
      ["中英字幕製作", 180, "分鐘", 320],
    ]),
    g("後期製作(Fellow 個人影音 6 支 45 分鐘)", [
      ["動態視覺包裝", 1, "式", 18000],
      ["Fellow 個人影音(45 min)_順剪(剪輯、文案、插入 PPT、切 AB 機、平台上架)", 6, "支", 35000],
      ["中英字幕製作", 270, "分鐘", 320],
    ]),
    g("後期製作(花絮與 2026 宣傳片)", [
      ["2026 宣傳短片剪輯與後期製作(90 秒內)", 1, "支", 28000],
      ["2025 和平計畫花絮剪輯與後期製作(5 min 內)", 1, "支", 28000],
    ]),
    g("後期製作(其他)", [
      ["音樂版權", 1, "套", 12000],
    ]),
    g("贈項", [
      ["逐字稿、原始檔", 1, "套", 0, "原價 10,000"],
    ]),
  ].flat(),
};
// 精簡案例：一支形象短片，兩組五項
const quotationShort = {
  ...quotation,
  project_name: "2026 品牌形象短片",
  spec: "形象短片 90 秒 1 支，含中文字幕",
  client: { full_name: "陽光食品股份有限公司", contact_person: "林經理", contact_method: "0912-345-678", tax_id: "87654321" },
  final_price: 165000,   // 含稅 168,000 → 專案優惠 3,000
  payment_stages: [{label:"簽約", pct:50}, {label:"交片", pct:50}],
  terms: "拍攝一日（8 小時），超時每小時 3,000。\n修改兩次，第三次起每次 5,000。",
  items: [
    g("拍攝", [
      ["導演與企劃", 1, "式", 40000],
      ["攝影師(含器材)", 2, "人次", 12000],
      ["燈光與收音", 1, "人次", 8000],
    ]),
    g("後期製作", [
      ["剪輯、調光、動態字卡（90 秒內）", 1, "支", 85000],
      ["中文字幕製作", 1, "式", 3000],
    ]),
  ].flat(),
};
function g(group, rows) {
  return rows.map(([description, quantity, unit, unit_price, note], i) =>
    ({ group_name: group, sort_order: i, description, quantity, unit, unit_price, amount: quantity * unit_price, note: note || "" }));
}

// ── 新的 company 設定區塊（設定頁可編，全站共用） ──
const company = {
  name: "源日有限公司", name_en: "ORIGINSUN STUDIO", logo: "../img/originsun-logo.webp",
  tax_id: "90371657",
  address: "台北市中山區（設定頁填公司地址）",
  phone: "02-0000-0000", email: "hello@originsun-studio.com",
  bank: "012 台北富邦 中山分行", account_name: "源日有限公司", account_no: "82120000062728",
  quote_valid_days: 14,
  delivery_terms: "完成檔以雲端儲存連結交檔。若須 DVD、USB、硬碟，與任何實體儲存裝置交檔，實報實銷。",
  seal: null,   // 之後放去背 PNG 的路徑
};

const nt = n => "NT$" + Math.round(n).toLocaleString("en-US");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ymd = d => `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
let sealMode = "placeholder";

function render() {
  const q = document.getElementById("opt-data").value === "short" ? quotationShort : quotation;
  const showStages = document.getElementById("opt-stages").checked;
  const demoDiscount = document.getElementById("opt-discount").checked ? 10000 : 0;

  // 金額鏈（跟後端 _calc_quotation 一樣：稅前折扣 → 稅 → 含稅總計；專案優惠是 total − final_price）
  const subtotal = q.items.reduce((s, it) => s + it.amount, 0);
  const taxable = Math.max(subtotal - demoDiscount, 0);
  const tax = Math.floor(taxable * q.tax_rate / 100);
  const total = taxable + tax;
  const promo = q.final_price != null && q.final_price < total ? total - q.final_price : 0;
  const finalPrice = q.final_price ?? total;

  const qd = new Date(q.quote_date);
  const vu = q.valid_until ? new Date(q.valid_until) : new Date(qd.getTime() + company.quote_valid_days * 864e5);
  const validDays = Math.round((vu - qd) / 864e5);

  const groups = [];
  for (const it of q.items) {
    let grp = groups[groups.length - 1];
    if (!grp || grp.name !== it.group_name) groups.push(grp = { name: it.group_name, rows: [] });
    grp.rows.push(it);
  }
  const body = groups.map(grp => {
    const sub = grp.rows.reduce((s, r) => s + r.amount, 0);
    return `
    <tr class="grp"><td class="name" colspan="3">${esc(grp.name)}</td><td class="mute">小結</td><td class="num">${nt(sub)}</td></tr>
    ${grp.rows.map(it => `
      <tr>
        <td class="desc">${esc(it.description)}${it.note ? `<span class="note">${esc(it.note)}</span>` : ""}</td>
        <td class="c">${it.quantity}</td><td class="c">${esc(it.unit)}</td>
        <td class="num">${nt(it.unit_price)}</td><td class="num">${nt(it.amount)}</td>
      </tr>`).join("")}`;
  }).join("");

  const row = (l, v) => `<div class="row"><span class="l">${l}</span><span class="v">${v}</span></div>`;
  const summary = `
    <div class="sum">
      ${row("合計", nt(subtotal))}
      ${demoDiscount ? row("折扣", "−" + nt(demoDiscount)) : ""}
      ${row(`營業稅 ${q.tax_rate}%`, nt(tax))}
      ${promo ? row("專案優惠", "−" + nt(promo)) : ""}
      <div class="grand"><span class="l">報價總額<small>含稅</small></span><span class="v">${nt(finalPrice)}</span></div>
    </div>`;

  const nw = t => `<span style="white-space:nowrap">${t}</span>`;
  const notes = String(q.terms || "").split(/\r?\n/).map(t => t.trim()).filter(Boolean).map(esc);
  if (showStages && q.payment_stages.length)
    notes.push("付款方式：" + q.payment_stages.map(s => nw(`${esc(s.label)} ${s.pct}%　${nt(finalPrice * s.pct / 100)}`)).join("　"));
  notes.push("完成檔交檔：" + esc(company.delivery_terms));
  notes.push(nw(`報價有效期限 ${validDays} 日（至 ${ymd(vu)}）`));

  const specHtml = String(q.spec || "").split(/[、\n]/).map(x => x.trim()).filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("");
  const seal = sealMode === "placeholder"
    ? `<div class="seal">源日有限公司<br>統一發票專用章<br>統一編號<br>${company.tax_id}</div>`
    : (company.seal ? `<img src="${company.seal}" style="height:72px">` : "");

  document.getElementById("paper").innerHTML = `
    <div class="bar"></div>
    <div class="body">
      <div class="hd">
        <h1>報價單<small>PROJECT ESTIMATE</small></h1>
        <img src="${company.logo}" alt="${esc(company.name)}">
      </div>
      <div class="parties">
        <div class="cols">
          <div class="kv">
            <span class="k">客戶</span><span class="v">${esc(q.client.full_name)}</span>
            <span class="k">專案</span><span class="v">${esc(q.project_name)}</span>
          </div>
          <div class="kv">
            <span class="k">規格</span><span class="v spec">${specHtml}</span>
          </div>
        </div>
      </div>
      <table class="q">
        <colgroup><col class="desc"><col class="qty"><col class="unit"><col class="price"><col class="amt"></colgroup>
        <thead><tr><th class="l">項目</th><th>數量</th><th>單位</th><th>單價</th><th>金額</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
      <div class="lower">${summary}</div>
      <div class="remarks">
        <h5>備註</h5><ol>${notes.map(n => `<li>${n}</li>`).join("")}</ol>
      </div>
      <div class="bank">
        <h5>匯款資訊</h5>
        <span><span class="lab">銀行</span>${esc(company.bank)}</span>
        <span><span class="lab">戶名</span>${esc(company.account_name)}</span>
        <span><span class="lab">帳號</span>${esc(company.account_no)}</span>
        <span><span class="lab">統編</span>${esc(company.tax_id)}</span>
      </div>
      <div class="sign">
        <div class="blk"><div class="lab">${esc(company.name)}　簽章</div><div class="stamp">${seal}</div></div>
        <div class="blk"><div class="lab">客戶簽章</div></div>
      </div>
      <div class="pfoot">
        <span>${esc(company.name)}　統一編號 ${esc(company.tax_id)}　${esc(company.address)}　${esc(company.phone)}　${esc(company.email)}　${ymd(qd)}　v${q.version}</span>
        <span>1 / 1</span>
      </div>
    </div>
    <div class="bar"></div>`;
}
function toggleSeal() { sealMode = sealMode === "placeholder" ? "none" : "placeholder"; render(); }
document.getElementById("opt-data").addEventListener("change", render);
document.getElementById("opt-stages").addEventListener("change", render);
document.getElementById("opt-discount").addEventListener("change", render);
render();
</script>
