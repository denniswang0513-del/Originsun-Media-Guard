<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>編輯作品展示 — Originsun Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root {
  --bg:#1e1e1e;--bg2:#222;--bg3:#2a2a2a;
  --card:#252525;
  --border:#2e2e2e;--border2:#3a3a3a;
  --text:#e0e0e0;--text2:#9ca3af;--text3:#6b7280;
  --accent:#3b82f6;--accent2:#2563eb;
  --danger:#fca5a5;--danger-bg:#7f1d1d;
  --success:#86efac;--success-bg:#14532d;
  --warn:#fbbf24;
  --font-body:'Segoe UI','Noto Sans TC',system-ui,sans-serif;
  --max-w:1080px;
}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.7;font-size:14px;min-height:100vh}

#loading{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;transition:opacity .5s}
#loading.fade{opacity:0;pointer-events:none}
.loading-bar{width:120px;height:2px;background:var(--border);border-radius:1px;overflow:hidden}
.loading-bar::after{content:'';display:block;width:40%;height:100%;background:var(--accent);animation:loadSlide 1s ease infinite}
@keyframes loadSlide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
.loading-text{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--text3)}

#error{display:none;text-align:center;padding:120px 20px;color:var(--text3)}
#error h2{font-size:48px;font-weight:300;color:var(--text2);margin-bottom:8px}

.readonly-banner{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;color:var(--text2);font-size:13px;margin-bottom:24px}

.page{max-width:var(--max-w);margin:0 auto;padding:40px 20px 80px;opacity:0;transform:translateY(12px);transition:all .5s}
.page.visible{opacity:1;transform:translateY(0)}

.page-title{font-size:22px;font-weight:600;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text3);margin-bottom:24px}

/* ── Embed 模式（嵌入 CRM「完稿結案」分頁 iframe；iframe 自動偵測、?embed=0 可逃）──
   隱藏本頁自己的大頁首/頁尾，貼合 CRM 容器。 */
html.embed-mode body{min-height:0}
html.embed-mode .page{max-width:none;padding:14px 6px 48px}
html.embed-mode #page-title,html.embed-mode .page-sub,html.embed-mode .footer{display:none}

/* ── 7 階段容器 + 右側檢查清單雙欄 ── */
.sc-layout{display:flex;gap:20px;max-width:1080px;margin:0 auto}
.sc-main{flex:1;min-width:0}
.sc-rail{width:250px;flex-shrink:0}
@media (max-width:1100px){.sc-layout{flex-direction:column}.sc-rail{width:100%;order:-1}}
.sc-stage{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-bottom:16px}
.sc-stage-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.sc-stage-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sc-stage-title{font-size:15px;font-weight:600;color:var(--text)}
.sc-stage-hint{color:var(--text3);font-size:12px;line-height:1.6;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:14px}
.sc-sub-hint{color:var(--text3);font-size:11px;margin:-6px 0 8px}
.sc-instant{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--bg3);border:1px solid var(--border2);color:var(--text3);font-size:10px;font-weight:400;letter-spacing:1px;vertical-align:middle;flex:none}
.sc-stage,.section{scroll-margin-top:70px}

/* ── 右側上架檢查清單 ── */
#sc-checklist{position:sticky;top:64px}
.sc-check-card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.sc-check-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;user-select:none;font-size:13px;font-weight:600;color:var(--text)}
.sc-check-body{padding:0 14px 12px}
.sc-check-group{color:var(--text3);font-size:11px;letter-spacing:1px;margin:10px 0 4px}
.sc-check-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px;color:var(--text2);cursor:pointer}
.sc-check-row:hover{color:var(--text)}
.sc-check-row .ok{color:var(--success)}
.sc-check-row .no{color:var(--text3)}
.sc-check-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sc-highlight{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}

.section{margin-bottom:28px}
.sc-stage .section:last-child{margin-bottom:0}
.section-label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:12px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

textarea,input[type="text"],input[type="url"],input[type="number"]{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-family:var(--font-body);font-size:14px;resize:vertical}
/* Hide number input spinner — 設計上不需要箭頭 */
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type="number"]{-moz-appearance:textfield}
textarea:focus,input:focus{outline:none;border-color:var(--accent)}
textarea{min-height:80px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--border2);border-radius:6px;background:var(--bg3);color:var(--text2);font-size:13px;cursor:pointer;font-family:var(--font-body);transition:all .2s}
.btn:hover{border-color:var(--accent);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
.btn-primary:hover{background:var(--accent2)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-sm{padding:4px 10px;font-size:12px}

.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{padding:4px 12px;font-size:12px;background:var(--bg3);border:1px solid var(--border);border-radius:999px;color:var(--text2);display:flex;align-items:center;gap:6px}
.tag.tag-on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
.tag button{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0;line-height:1}
.tag-input{display:flex;gap:6px;align-items:center}
.tag-input input{flex:1;max-width:200px}

.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.gallery-item{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.gallery-item img{width:100%;height:100%;object-fit:cover}
.gallery-item .del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}

.credit-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.credit-role{color:var(--accent);font-size:12px;width:80px;flex-shrink:0}
.credit-name{flex:1}
.credit-link{color:var(--text3);font-size:12px;text-decoration:none}
.credit-link:hover{color:var(--accent)}
.credit-link-dot{transition:transform .15s,box-shadow .15s}
.credit-link-dot:hover{transform:translateY(-50%) scale(1.4);box-shadow:0 0 6px var(--success)}
.credit-name-dropdown{font-family:var(--font-body)}
.credit-name-dropdown::-webkit-scrollbar{width:6px}
.credit-name-dropdown::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.sc-staff-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-overlay input[type="text"],.modal-overlay select{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--text);font-family:var(--font-body);font-size:14px}
.modal-overlay input[type="text"]:focus,.modal-overlay select:focus{outline:none;border-color:var(--accent)}

/* 非 modal 區域的獨立 select（系列下拉等）— 與 .modal-overlay select 同一套樣式 */
select.sc-select{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--text);font-family:var(--font-body);font-size:14px}
select.sc-select:focus{outline:none;border-color:var(--accent)}

/* 分類小測驗 */
.quiz-opt{display:block;width:100%;text-align:left;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:12px 14px;margin-bottom:8px;color:var(--text);font-size:14px;cursor:pointer;font-family:var(--font-body);transition:border-color .15s,background .15s}
.quiz-opt:hover{border-color:var(--accent)}
.quiz-opt.on{border-color:var(--accent);background:var(--bg2)}
.quiz-dot{width:8px;height:8px;border-radius:50%;background:var(--border2);display:inline-block}
.quiz-dot.on{background:var(--accent)}

/* ── 發布 stage：開關列 + 必備未完成警示 + 發布時間線 ── */
.sc-toggle-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;background:var(--bg2)}
.sc-toggle-row input[type="checkbox"]{margin-top:4px}
.sc-toggle-title{color:var(--text);font-size:13px;font-weight:500;cursor:pointer;display:block}
.sc-toggle-hint{color:var(--text3);font-size:11px;line-height:1.6}
.sc-publish-warn{display:none;color:var(--warn);background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);border-radius:6px;padding:8px 12px;font-size:12px;margin:8px 0}
.sc-publish-warn.show{display:block}
#sec-publish-status{margin-top:12px;padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text2);line-height:1.7}
#sec-publish-status:empty{display:none}

/* 創作過程：三張一列卡片牆（頁面流內的 grid，非捲動容器 — 無列高塌陷問題；auto-rows 保險照放） */
.process-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:max-content;gap:12px;margin-top:4px}
.process-item{position:relative;display:flex;flex-direction:column;background:var(--bg3);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.process-item img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.process-text{padding:8px 10px;font-size:12px;color:var(--text2)}
.process-del{position:absolute;top:6px;right:6px}
@media(max-width:700px){.process-grid{grid-template-columns:repeat(2,1fr)}}

/* ── 從影像紀錄挑選 modal（創作過程用；劇組收檔照片直接挑進官網） ── */
/* grid-auto-rows:max-content 必留 — 定高捲動容器裡 auto 列會被 Chromium 攤成 ~4px（cell 塌成細條、縮圖全被 overflow:hidden 裁掉） */
.sc-mlp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));grid-auto-rows:max-content;gap:10px;overflow-y:auto;min-height:120px;padding:2px}
.sc-mlp-item{position:relative;cursor:pointer;border:2px solid transparent;border-radius:6px;overflow:hidden;background:var(--bg3);transition:border-color .15s}
.sc-mlp-item:hover{border-color:var(--border2)}
.sc-mlp-item.on{border-color:var(--accent)}
.sc-mlp-item img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.sc-mlp-meta{font-size:10px;color:var(--text3);padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-mlp-check{display:none;position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;line-height:1}
.sc-mlp-item.on .sc-mlp-check{display:flex}
@media(max-width:600px){.sc-mlp-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}}

.footer{text-align:center;padding-top:40px;margin-top:40px;border-top:1px solid var(--border);font-size:11px;letter-spacing:2px;color:var(--text3)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--success-bg);color:var(--success);border:1px solid rgba(134,239,172,.4);padding:8px 20px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100}
.toast.show{opacity:1}

@media(max-width:600px){.page{padding:24px 14px 60px}.gallery-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.credit-row{flex-wrap:wrap}}
</style>
</head>
<body>
<div id="loading"><div class="loading-bar"></div><div class="loading-text">Loading</div></div>
<div id="error"><h2>404</h2><p>此連結無效或已失效</p></div>
<div class="page" id="page"></div>

<div id="staff-quick-add-modal" class="modal-overlay">
    <div style="background:var(--bg2);padding:24px;border-radius:12px;width:420px;max-width:calc(100vw - 32px);border:1px solid var(--border);">
        <h3 style="margin:0 0 16px;color:var(--text);font-weight:600;">建立新人員</h3>

        <label style="display:block;margin-bottom:6px;color:var(--text2);font-size:12px;">姓名 *</label>
        <input id="qa-name" type="text" style="width:100%;margin-bottom:14px;">

        <label style="display:block;margin-bottom:6px;color:var(--text2);font-size:12px;">職能（選填）</label>
        <select id="qa-role" style="width:100%;margin-bottom:14px;">
            <option value="">— 不指定 —</option>
        </select>

        <p style="color:var(--text3);font-size:11px;line-height:1.5;margin:8px 0 16px;">
            注意：此人員會新增到「人力資源」資料庫，狀態預設「專案」、對外簡歷預設關閉。
            可稍後在人力資源 Tab 補完聯絡方式、勞報資料。
        </p>

        <div style="display:flex;gap:8px;justify-content:flex-end;">
            <button id="qa-cancel" class="btn">取消</button>
            <button id="qa-submit" class="btn btn-primary">建立並選用</button>
        </div>
    </div>
</div>

<!-- 分類小測驗（心理測驗式：答 4 題 → 建議分類/標籤 → 確認套用） -->
<div id="cat-quiz-modal" class="modal-overlay">
    <div id="cat-quiz-body" style="background:var(--bg2);padding:24px;border-radius:12px;width:520px;max-width:calc(100vw - 32px);border:1px solid var(--border);"></div>
</div>

<!-- 從影像紀錄挑選（創作過程）— 劇組已收檔的工作照直接挑進官網創作過程，免重新上傳 -->
<div id="media-log-pick-modal" class="modal-overlay">
    <div style="background:var(--bg2);padding:24px;border-radius:12px;width:900px;max-width:calc(100vw - 32px);border:1px solid var(--border);display:flex;flex-direction:column;max-height:min(88vh, 1040px);">
        <h3 style="margin:0 0 4px;color:var(--text);font-weight:600;">從影像紀錄挑選</h3>
        <p style="color:var(--text3);font-size:11px;margin:0 0 14px;">劇組在影像紀錄上傳的照片（僅圖片）</p>
        <div id="mlp-grid" class="sc-mlp-grid"></div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
            <span id="mlp-count" style="color:var(--text2);font-size:12px;">已選 0 張</span>
            <div style="flex:1;"></div>
            <button id="mlp-cancel" class="btn btn-sm" type="button">取消</button>
            <button id="mlp-submit" class="btn btn-primary btn-sm" type="button" disabled>加入創作過程</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<!-- 這一頁的程式碼（原本 226–2305 行的 inline script，約 2,080 行）2026-09-12 原樣拆到 js/showcase-edit/ 底下。
     刻意維持「傳統 script 標籤」，不要改成 type="module"：六支共用同一個全域詞法環境，
     頂層的 const／let／function 跨檔直接看得見（DATA、EDITABLE、_render、_bindEvents …）；
     載入順序＝原本由上而下的執行順序，不可調換；開頁就跑的 _load() 在最後一支的檔尾。 -->
<script src="./js/showcase-edit/shell.js"></script>
<script src="./js/showcase-edit/render.js"></script>
<script src="./js/showcase-edit/events.js"></script>
<script src="./js/showcase-edit/quiz.js"></script>
<script src="./js/showcase-edit/checklist.js"></script>
<script src="./js/showcase-edit/media-pick.js"></script>
</body>
</html>
