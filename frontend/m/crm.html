<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="源日 CRM">
<link rel="manifest" href="/m/manifest.webmanifest">
<link rel="apple-touch-icon" href="/m/icon-180.png">
<link rel="icon" href="/m/icon-192.png">
<title>源日 CRM</title>
<!-- CRM 手機版（docs/CRM_MOBILE_PLAN.md）：現場輸入＋快看，跟桌機版分開。
     七個分頁（發票／零用金／專案／報價／行事曆／工作紀錄／假勤），hash 路由；殼只有 ./shell.js 一份。
     付款（owner 2026-09-03 被行事曆取代）與記雜支是隱藏路由，從專案抽屜進。
     閘門：管理員（Lv3）或擁有「crm_projects」模組；寫入鈕再看 /options 的 me.can_write。
     字彙（階段／案型／狀態／款項／發票種類）全部來自 GET /api/v1/crm/m/options，
     這裡一個都不寫死 —— /invoice.html 寫死 payment_status 的下場見計畫 §7。
     只掛 master / foundry（NAS 對外容器沒有 CRM 後端）；不進 core/public_assets。 -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="/m/m.css">
<style>
  /* CRM 三把寫入鑰匙的 class（/options.me.can_*）—— 只有 CRM 頁有，留在這裡 */
  body.no-write .w { display:none !important; }
  body.no-invoice .wi { display:none !important; }   /* 發票／付款（/options.me.can_invoice） */
  body.no-expense .we { display:none !important; }   /* 記雜支（/options.me.can_expense） */
</style>
</head>
<body>
<div id="m-auth" hidden></div>

<div id="m-app" hidden>
  <header class="m-hdr">
    <button type="button" class="nav" id="m-back" aria-label="上一頁">‹ 上一頁</button>
    <div class="ttl"><div class="brand"><img class="logo" src="/img/originsun-logo.webp" alt="源日"><span>源日</span> CRM</div><div class="page" id="m-page"></div></div>
    <button type="button" class="nav" id="m-home" aria-label="首頁">首頁</button>
    <!-- 舊版 crm.js 開頭會找這個元素填帳號；Cloudflare 對 .js 給瀏覽器 4 小時快取而 html 是即時的，
         發版後有一段時間會是「新 html＋舊 js」——元素留著（藏起來）舊 js 才不會在這裡中斷（2026-09-03 實際踩到） -->
    <div id="m-who" hidden></div>
  </header>
  <main id="m-view"></main>
  <nav class="m-tabbar" id="m-tabbar">
    <button type="button" data-tab="invoice"><i class="ico"></i>發票</button>
    <button type="button" data-tab="petty"><i class="ico"></i>零用金</button>
    <button type="button" data-tab="projects"><i class="ico"></i>專案</button>
    <button type="button" data-tab="quotes"><i class="ico"></i>報價</button>
    <button type="button" data-tab="calendar"><i class="ico"></i>行事曆</button>
    <button type="button" data-tab="worklog"><i class="ico"></i>工作紀錄</button>
    <button type="button" data-tab="leave"><i class="ico"></i>假勤</button>
  </nav>
</div>

<div id="m-sheet" hidden>
  <div class="bd"></div>
  <div class="pn"><button type="button" class="x" id="m-sheet-x" aria-label="關閉">&times;</button><div class="grip"></div><div id="m-sheet-body"></div></div>
</div>

<script type="module" src="./crm.js"></script>
</body>
</html>
