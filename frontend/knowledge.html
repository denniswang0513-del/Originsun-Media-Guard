<!-- ?v= 是破快取用的：Cloudflare 把 js/css 的 no-cache 改寫成 max-age=14400，

<link rel="stylesheet" href="/js/knowledge/knowledge.css?v=2.5.54">
<style>
  /* 色票是一組語彙，不是寫死的顏色 —— 窄螢幕整組換成深色（見檔尾的 @media）。
     🔴 `--red` 原本同時當強調色與危險色；深色底下強調色要換成 logo 的天藍，
     但「刪除」那類還是得是紅的，所以拆成 `--red`（強調）與 `--danger`（危險）。 */
  :root {
    --red: #c9372c; --danger: #c9372c;
    --ink: #262626; --sub: #737373; --line: #e5e5e5;
    --bg: #fff;                 /* 頁面底色 */
    --panel: #fff;              /* 卡片、輸入框、按鈕的底 */
    --soft: #f3f3f3;            /* 標籤、淡底那一類 */
    --soft-2: #fafafa;          /* 更淡的一層（hover、拖放框） */
    --on-ink: #fff;             /* 壓在 --ink 實心色塊上的字 */
    --mine: #fdf1f0;            /* 討論裡「你說的」那一則的底 */
    --dim: rgba(0,0,0,.3);      /* 抽屜後面壓暗的那層 */
    /* --ok 原本 #15803d 在 --ok-bg 上只有 4.42（AA 要 4.5）——「已編譯」那顆 pill 差一點點 */
    --bg-soft: #fafafa; --ok: #136c34; --warn: #b45309;
    --ok-bg: #e6f4ea; --warn-bg: #fff3e0; --bad-bg: #fdecea; --na-bg: #f0f0f0;
    --shadow: rgba(0,0,0,.14); --shadow-soft: rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif; }
  a { color: inherit; text-decoration: none; }
  .eyebrow { font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase; color: var(--sub); }
  .accent { color: var(--red); }

  header { position: sticky; top: 0; z-index: 50; display: flex; align-items: center;
    justify-content: space-between; padding: 14px 20px; background: var(--panel);
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  header .brand-name { font-size: 13px; letter-spacing: 0.25em; font-weight: 300;
    display: inline-flex; align-items: center; gap: 9px; white-space: nowrap; }
  /* 記號是「三道浪」（frontend/img/knowledge-icon.svg，owner 2026-09-18 拍板）：源日本家那三道橫線起伏而成，
     午夜藍底、天藍到淡紫藍的漸層。PNG 各尺寸同資料夾，給分頁圖示與手機主畫面用。 */
  header .brand-mark { display: block; border-radius: 6px; flex: none; }
  @media (max-width: 640px) {
    header .brand-name { letter-spacing: 0.1em; gap: 7px; }
    header .brand-mark { width: 22px; height: 22px; }
  }
  header .hdr-right { display: flex; align-items: center; gap: 12px; }
  header .hdr-user { font-size: 12px; color: var(--sub); }
  .btn-ghost { background: none; border: 1px solid var(--line); border-radius: 2px;
    padding: 6px 14px; font-size: 12px; color: var(--sub); cursor: pointer; }
  .btn-ghost:hover { color: var(--red); border-color: var(--red); }

  /* 左右一律走 max(留白, 安全區)：桌機就是留白，手機遇到瀏海／圓角會自己讓開 */
  main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right)); }

  .center-wrap { max-width: 380px; margin: 8vh auto 0; }
  .login-card { border: 1px solid var(--line); padding: 36px 32px; }
  .login-card h1 { font-size: 16px; letter-spacing: .1em; font-weight: 400; margin: 0 0 22px; }
  .login-card input { width: 100%; padding: 11px 12px; border: 1px solid var(--line);
    border-radius: 2px; font-size: 14px; margin-bottom: 10px; font-family: inherit;
    background: var(--panel); color: var(--ink); }
  .login-card button[type=submit] { width: 100%; padding: 11px; background: var(--ink);
    color: var(--on-ink); border: 0; border-radius: 2px; font-size: 14px; cursor: pointer; }
  .divider { display: none; align-items: center; gap: 10px; color: var(--sub);
    font-size: 11px; margin: 16px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .err { display: none; color: var(--danger); font-size: 12px; margin-top: 14px; line-height: 1.6; }
  .state-msg { color: var(--sub); font-size: 13px; padding: 24px 0; text-align: center; }
  html.embed header { display: none; }
  html.embed main { padding-top: 14px; }

  main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 60px;
    padding-left: max(24px, env(safe-area-inset-left));
    padding-right: max(24px, env(safe-area-inset-right)); }
  #kb-host { min-height: 60vh; }
  /* 提示浮在底部（書頁很長、手機上看不到頁尾）；顏色照 kind */
  #kb-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60;
    background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 24px var(--shadow-soft); border-radius: 6px;
    padding: 10px 16px; font-size: 13px;
    max-width: calc(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right)); }
  html.embed main { padding: 14px 18px 40px; }
  @media (max-width: 640px) {
    main { padding: 16px 12px 40px;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right)); }
    header { padding: 12px 14px;
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right)); }
  }

  /* 手機／直式：整頁換成 logo 那組午夜藍（owner 2026-09-18：「手機 RWD 希望是深色配色 和 logo 匹配」）。
     色票就是 frontend/img/knowledge-icon.svg 裡的：底 #12294D→#070F22、浪 #38BDF8→#A5B4FC。
     斷點跟既有的手機版版面同一個（899），桌機維持白底。
     這裡**只換色票**，沒有一條版面規則 —— 兩套配色共用同一份版面。 */
  @media (max-width: 899px) {
    :root {
      --red: #38BDF8;           /* 強調色＝浪的天藍 */
      --danger: #FCA5A5;        /* 危險色在深底上要提亮，不然紅字會糊掉 */
      --ink: #E8EEF8; --sub: #8FA6C6; --line: #1E3557;
      /* owner 2026-09-18：「書的藍色再深一點」。背景直接用 logo 漸層最深的那一端，
         書卡那層跟著壓下來 —— 層次還在（背景 < 書卡 < 淡底），只是整體更沉。 */
      --bg: #070F22;            /* 同 <meta name="theme-color">，捲動時手機瀏覽器的框才不會跳色 */
      --panel: #0E1F3A; --soft: #13294B; --soft-2: #0A1730;
      --on-ink: #071324;        /* 深色底下 --ink 是淺的，壓在上面的字要反過來 */
      /* 你說的那則用偏青的藍，跟 AI 那則的 --soft（偏靛）分得開 */
      --mine: #0B3243; --dim: rgba(0,0,0,.65);
      --bg-soft: #0A1730; --ok: #6EE7B7; --warn: #FCD34D;
      --ok-bg: #0E3226; --warn-bg: #32270F; --bad-bg: #331616; --na-bg: #13294B;
      --shadow: rgba(0,0,0,.5); --shadow-soft: rgba(0,0,0,.45);
    }
    header { background: var(--bg); }
    /* 深色底下的輸入框游標與自動填入 */
    input, textarea { caret-color: var(--red); }
  }
</style>

<body>

<header>
  <span class="brand-name"><img class="brand-mark" src="/img/knowledge-icon.svg" alt="" width="26" height="26">Knowledge <span class="accent">知識庫</span></span>
  <div class="hdr-right">
    <a class="btn-ghost" href="/my.html">個人工作台</a>
    <span class="hdr-user" id="hdr-user" style="display:none;"></span>
    <button class="btn-ghost" id="btn-logout" style="display:none;" onclick="doLogout()">登出</button>
  </div>
</header>

<main>
  <div id="login-view" style="display:none;">
    <div class="center-wrap">
      <div class="login-card">
        <h1>登入</h1>
        <div class="err" id="login-err"></div>
        <form onsubmit="doPwdLogin(event)">
          <input id="in-user" placeholder="帳號" autocomplete="username">
          <input id="in-pwd" type="password" placeholder="密碼" autocomplete="current-password">
          <button type="submit">登入</button>
        </form>
        <div class="divider" id="login-divider" style="display:none">或</div>
        <div id="g_id_signin_container" style="display:none;justify-content:center;"></div>
      </div>
    </div>
  </div>

  <div id="noperm-view" style="display:none;">
    <div class="state-msg" id="noperm-msg">這個帳號沒有知識庫的權限，請聯絡管理員開啟「知識庫」。</div>
  </div>

  <div id="app-view" style="display:none;">
    <div id="kb-host"></div>
    <div id="kb-toast" style="display:none;"></div>
  </div>
</main>

<script>
// 被別的頁面的浮動視窗嵌進來（?embed=1）：藏自己的頁首、少留白 —— 叉叉在外面那層
if (new URLSearchParams(location.search).get("embed")) {
    document.documentElement.classList.add("embed");
}
</script>
<script type="module">
import { authFetch, bearerHeader } from "/js/shared/utils.js";
import { initGoogleSignIn } from "/js/shared/google-signin.js";

const TOKEN_KEY = "auth_token";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function _show(view) {
    for (const v of ["login-view", "noperm-view", "app-view"])
        $(v).style.display = (v === view ? "block" : "none");
    $("btn-logout").style.display = (view === "login-view") ? "none" : "";
}
function showLogin(msg) {
    _show("login-view"); $("hdr-user").style.display = "none";
    if (msg) { const e = $("login-err"); e.textContent = msg; e.style.display = "block"; }
    initGoogle();
}
window.doLogout = () => {
    localStorage.removeItem(TOKEN_KEY); localStorage.removeItem("auth_user");
    location.href = location.pathname;
};
function onLoginOk(d) {
    localStorage.setItem(TOKEN_KEY, d.token); $("login-err").style.display = "none"; boot();
}
window.doPwdLogin = async (ev) => {
    ev.preventDefault();
    try {
        const r = await fetch("/api/v1/auth/login", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: $("in-user").value.trim(), password: $("in-pwd").value }) });
        const d = await r.json();
        if (!r.ok) { showLogin(d.detail || "登入失敗"); return; }
        onLoginOk(d);
    } catch (_) { showLogin("連線失敗，請稍後再試"); }
};
let _gisInited = false;
async function initGoogle() {
    if (_gisInited) return;
    _gisInited = await initGoogleSignIn({
        container: $("g_id_signin_container"), divider: $("login-divider"),
        theme: "outline", width: 320, onSuccess: onLoginOk, onError: showLogin,
    });
}
// 元件要的 fetch(path, {method, body}) → json；錯誤丟 Error(detail) 帶 .status／.detail／.data。
// body 是 FormData 就原樣送（authFetch 一律 JSON.stringify ＋ Content-Type: application/json，
// FormData 不能走它 —— boundary 會被蓋掉），只帶 Authorization。
async function kbFetch(path, opts = {}) {
    const isForm = typeof FormData !== "undefined" && opts.body instanceof FormData;
    const r = isForm
        ? await fetch(path, { method: opts.method || "POST", headers: bearerHeader(), body: opts.body })
        : await authFetch(path, { method: opts.method || "GET", ...(opts.body !== undefined ? { body: opts.body } : {}) });
    const text = await r.text();
    let d = null;
    try { d = text ? JSON.parse(text) : null; } catch (_) { d = null; }
    if (!r.ok) {
        const raw = d && d.detail;
        const detail = typeof raw === "string" ? raw
            : Array.isArray(raw) ? raw.map((x) => x.msg || x.message || JSON.stringify(x)).join("; ")
                : (raw && (raw.message || raw.reason)) || "";
        const e = new Error(detail || ("載入失敗（" + r.status + "）"));
        e.status = r.status; e.detail = detail; e.data = d;
        throw e;
    }
    return d;
}
let _toastT = null;
function toast(msg, kind) {
    const t = $("kb-toast"); t.textContent = msg; t.style.color = kind === "err" ? "var(--red)" : "var(--ok)"; t.style.display = "";
    clearTimeout(_toastT); _toastT = setTimeout(() => { t.style.display = "none"; }, 4000);
}

async function boot() {
    if (!localStorage.getItem(TOKEN_KEY)) { showLogin(""); return; }
    let me;
    try {
        const r = await authFetch("/api/v1/auth/me");
        if (r.status === 401) { localStorage.removeItem(TOKEN_KEY); showLogin(""); return; }
        if (!r.ok) { showLogin("載入失敗（" + r.status + "）"); return; }
        me = await r.json();
        if (me.token) localStorage.setItem(TOKEN_KEY, me.token);
    } catch (_) { showLogin("連線失敗，請稍後再試"); return; }
    const mods = me.modules || [];
    const isAdmin = (me.access_level || 0) >= 3;
    $("hdr-user").textContent = me.username || "";
    $("hdr-user").style.display = "";
    if (!isAdmin && !mods.includes("knowledge")) { _show("noperm-view"); return; }
    _show("app-view");
    const { mountKnowledge } = await import("/js/knowledge/index.js");
    await mountKnowledge({ host: $("kb-host"), fetch: kbFetch, esc, toast });
}
boot();
</script>
</body>
